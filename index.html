/** Давлатлар — харитадаги чегара коди ва марказий нуқтаси */
var AI_DAVLAT=[
  {kalit:'узбекистон',  nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},
  {kalit:'узбекстан',   nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},
  {kalit:'тожикистон',  nom:'Тожикистон',  kod:'tj', lat:38.6, lon:71.4},
  {kalit:'таджикистан', nom:'Тожикистон',  kod:'tj', lat:38.6, lon:71.4},
  {kalit:'козогистон',  nom:'Қозоғистон',  kod:'kz', lat:43.6, lon:68.5},
  {kalit:'казахстан',   nom:'Қозоғистон',  kod:'kz', lat:43.6, lon:68.5},
  {kalit:'киргизистон', nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4},
  {kalit:'киргизстан',  nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4},
  {kalit:'кыргызстан',  nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4}
];

/* «Киргизистан» ва «Қирғизистон», «Козогистон» ва «Казахстан» —
   ёзилиши ҳар хил, шунинг учун охирги «стан/стон» бир кўринишга келтирилади. */
function davlatNorm(nom){
  return shaharNorm(nom).replace(/стан$/,'стон');
}

function davlatTop(nom){
  var t=davlatNorm(nom);
  if(!t) return null;
  for(var i=0;i<AI_DAVLAT.length;i++)
    if(t===davlatNorm(AI_DAVLAT[i].kalit)) return AI_DAVLAT[i];
  return null;
}

/**
 * ДАВЛАТЛАР ХАРИТАСИ — чегаралар бўялади, марказига доира ва рақам қўйилади.
 * Харитада йўқ давлатлар пастда чип бўлиб чиқади.
 */
function xaritaDavlat(guruh){
  var nuq=[], tashqari=[];
  guruh.forEach(function(g){
    var d=davlatTop(g.nom);
    if(d) nuq.push({d:d, g:g}); else tashqari.push(g);
  });
  if(!nuq.length) return '';

  var W=XARITA_W, H=XARITA_H, max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni });

  // ── чегаралар ──
  var bor={};
  nuq.forEach(function(x){ bor[x.d.kod]=x });
  var yer='';
  ['kz','uz','kg','tj'].forEach(function(k,i){
    var x=bor[k];
    var c=x?DAVLAT_RANG[x.d.nom]:null;
    yer+='<path class="xyer'+(x?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(c||'var(--line)')+'" stroke="'+(c||'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+
      (x?esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув':'')+'</title></path>';
  });

  // ── доиралар ──
  var shar='';
  nuq.forEach(function(x,i){
    var c=xproy(x.d.lon,x.d.lat);
    var px=c[0], py=c[1];
    var r=14+20*Math.sqrt(x.g.soni/max);
    var rng=DAVLAT_RANG[x.d.nom]||'var(--a)';
    var ulush=jami?Math.round(x.g.soni/jami*100)+'%':'';
    shar+='<g class="xsh" style="animation-delay:'+(0.4+i*0.1).toFixed(2)+'s">'+
      '<circle class="xdoira" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+r.toFixed(1)+
        '" fill="'+rng+'" fill-opacity=".38" stroke="'+rng+'" stroke-width="2"/>'+
      '<text class="xson" x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+px.toFixed(1)+'" y="'+(py+r+16).toFixed(1)+'" text-anchor="middle">'+
        esc(x.d.nom)+'</text>'+
      '<text class="xizoh" x="'+px.toFixed(1)+'" y="'+(py+r+30).toFixed(1)+'" text-anchor="middle" '+
        'fill="'+rng+'">'+ulush+'</text>'+
      '<title>'+esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув</title></g>';
  });

  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){
        return '<span class="xchip"><b>'+fmt(g.soni)+'</b>'+esc(g.nom)+'</span>';
      }).join('')+'</div>'
    : '';

  var afsona='<div class="xafs">'+nuq.map(function(x){
    return '<span><i style="background:'+DAVLAT_RANG[x.d.nom]+'"></i>'+esc(x.d.nom)+
           ' <b>'+fmt(x.g.soni)+'</b></span>';
  }).join('')+'</div>';

  return '<div class="xkarta"><div class="xscroll">'+
    '<svg class="xsvg" viewBox="0 0 '+W+' '+H+'">'+yer+shar+'</svg></div>'+
    '<div class="xsurish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Харитани чапга-ўнгга суринг</div>'+
    afsona+chip+'</div>';
}

      '<div class="xato"><b>Серверга уланиб бўлмади</b>'+esc(D.aiXato)+
      '<div style="margin-top:10px;font-size:12.5px">Apps Script: <b>Deploy → Anyone</b> '+
      'қилинганми ва AI.gs 2.0 версиями?</div></div>';
  if(!D || !D.ai)
    return sarlavha('AI 3.0','Юкланмоқда…',mobilTugma())+
      '<div class="load"><div class="spin"></div>Маълумот юкланмоқда…</div>';
  return null;
}

/* ── ПАНЕЛ 1: УМУМИЙ ────────────────────────────────── */

function aiUmumiy(){
  var h=aiHolat(); if(h) return h;

  var l=aSatrlar(), j=jam(l);
  var reja=(D.aiReja)||[];
  var rJami=0,fJami=0;
  reja.forEach(function(x){ rJami+=x.reja; fJami+=x.fakt });
  var b=foiz(fJami,rJami);

  var men=guruhla(l,function(x){ return x.menejer });
  var dav=guruhla(l,function(x){ return x.davlat });

  var o=sarlavha('AI 3.0 — умумий','План, сотув сони, пул ва география',
    sanaFiltr()+mobilTugma())+

  '<div class="mets">'+
    '<div class="met o"><div class="met-l">План</div><div class="met-v num">'+fmt(rJami)+'</div>'+
      '<div class="met-d">факт '+fmt(fJami)+' · қолди '+fmt(Math.max(0,rJami-fJami))+
        ' <span style="opacity:.7">(«план» варағидан)</span></div>'+
      '<div class="mprog"><i style="width:'+Math.min(100,b)+'%;background:'+
        (b>=100?'var(--green)':'var(--ochre)')+'"></i></div></div>'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">'+fmt(l.length)+' та ёзув · «нечи киши» қўшилган</div></div>'+
    '<div class="met k"><div class="met-l">Тўланган</div><div class="met-v num">'+pul(j.tolangan)+'</div>'+
      '<div class="met-d">дагавор '+pul(j.kelishuv)+'</div></div>'+
    '<div class="met c"><div class="met-l">Қарздорлик</div><div class="met-v num">'+pul(j.qarz)+'</div>'+
      '<div class="met-d">дагаворнинг '+foiz(j.qarz,j.kelishuv)+'%</div></div>'+
  '</div>'+

  bolim('План бажарилиши','Ҳар бир менежер бўйича. Қора чизиқ — план даражаси.',
    rejaUstun(reja))+

  bolim('Менежерлар','Ким қанча сотган',
    ustunlar(men.map(function(x){
      return { nom:x.nom, qiy:x.soni, ong:pul(x.tolangan) };
    })))+

  bolim('Сотув динамикаси','Ҳар бир санада нечта сотув бўлган',
    davrQatori(l)+dinamika(l));

  // ── География ──
  if(dav.length && dav.some(function(x){ return x.nom!=='—' })){
    var jd=0; dav.forEach(function(x){ jd+=x.soni });
    o+='<div class="sec"><h2>География</h2><p>Мижозлар қайси давлатдан</p></div>';
    var xr=xaritaDavlat(dav);
    if(xr) o+=xr;
    o+='<div class="dbody"><div class="eb">Давлатлар бўйича</div>'+
      ustunlar(dav.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong:(jd?Math.round(x.soni/jd*100)+'% · ':'')+pul(x.tolangan) };
      }))+'</div>';
  }

  return o;
}

/* ── ПАНЕЛ 2: ЁЗУВЛАР ───────────────────────────────── */

function aiJurnal(){
  var h=aiHolat(); if(h) return h;

  var l=aSatrlar();
  if(S.qidiruv){
    var q=S.qidiruv.toLowerCase();
    l=l.filter(function(x){
      return [x.fio,x.menejer,x.davlat].join(' ').toLowerCase().indexOf(q)>=0;
    });
  }
  l=l.sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var kes=l.slice(0,300);
  var j=jam(l);

  var o=sarlavha('AI 3.0 — ёзувлар','Google Sheets’даги қаторлар',
    '<input type="text" id="qid" placeholder="Исм, менежер, давлат…" value="'+esc(S.qidiruv)+'" style="width:190px">'+
    sanaFiltr()+mobilTugma());

  o+='<div class="chips" style="margin:0 0 14px">'+
    '<span class="chip">Ёзув: <b>'+fmt(l.length)+'</b></span>'+
    '<span class="chip">Сотув: <b>'+fmt(j.soni)+'</b></span>'+
    '<span class="chip k">Тўланган <b>'+pul(j.tolangan)+'</b></span>'+
    '<span class="chip c">Қарз <b>'+pul(j.qarz)+'</b></span></div>';

  var O='text-align:right';
  o+='<div class="tw"><div class="tscroll"><table class="tbl"><thead><tr>'+
    '<th>Сана</th><th>Мижоз</th><th>Давлати</th><th>Менежер</th>'+
    '<th style="'+O+'">Киши</th><th style="'+O+'">Дагавор</th>'+
    '<th style="'+O+'">Тўланган</th><th style="'+O+'">Қарз</th>'+
    '</tr></thead><tbody>'+
    (kes.length?kes.map(function(x){
      return '<tr><td class="num" style="color:var(--muted)">'+dfmt(x.sana)+'</td>'+
        '<td style="font-weight:500">'+esc(x.fio||'—')+'</td>'+
        '<td><span class="pill">'+esc(x.davlat||'—')+'</span></td>'+
        '<td>'+esc(x.menejer||'—')+'</td>'+
        '<td class="num" style="'+O+';font-weight:600">'+fmt(x.kishi||1)+'</td>'+
        '<td class="num" style="'+O+'">'+pul(x.kelishuv)+'</td>'+
        '<td class="num" style="'+O+';color:var(--green);font-weight:600">'+pul(x.tolangan)+'</td>'+
        '<td class="num" style="'+O+';color:'+(x.qarz>0?'var(--red)':'var(--muted)')+'">'+pul(x.qarz)+'</td></tr>';
    }).join(''):'<tr><td colspan="8" style="padding:26px;text-align:center;color:var(--muted)">Ёзув топилмади</td></tr>')+
    '</tbody></table></div></div>';

  o+='<div class="jfaqat">'+kunlikRoyxat(kes)+'</div>';

  if(l.length>kes.length)
    o+='<div class="sub" style="margin-top:10px">Биринчи '+fmt(kes.length)+
       ' таси кўрсатилди (жами '+fmt(l.length)+')</div>';

  return o;
}


function menyu(){
  if(panelMi() || rbcPanelMi() || iiPanelMi() || yoqMi() || arxPanelMi() || (potok() && arxHolat())) return [{p:'umumiy', nom:'Умумий', ik:'chart'}];
  if(nazoratMi()){
    var nz=D&&D.nazorat;
    return [
      {p:'umumiy', nom:'Қурилмалар', ik:'odam',   son:nz?(nz.qurilmalar||[]).length:null},
      {p:'jurnal', nom:'Журнал',     ik:'jadval', son:nz?(nz.jurnal||[]).length:null},
      {p:'kesim',  nom:'Кодлар',     ik:'kalit'}];
  }
  if(markMi()){
    var kl=(D&&D.marketing)?kSatrlar():[];
    var kb=(D&&D.marketing)?sanaFiltrla(D.marketing):[];
    return [
      {p:'umumiy', nom:'Умумий',       ik:'chart'},
      {p:'menejer',nom:'Таргетологлар',ik:'odam',  son:kTargetlar(kb).length},
      {p:'kesim',  nom:'Стадиялар',    ik:'joy',   son:kGuruh(kl,function(x){return x.stadiya}).length},
      {p:'jurnal', nom:'Лидлар',       ik:'jadval',son:kl.length},
      {p:'konv',   nom:'Конверсия',    ik:'voronka'}];
  }
  if(moliyaMi()){
    var ml=(D&&D.moliya)?mSatrlar():[];
    return [
      {p:'umumiy', nom:'Умумий',  ik:'chart'},
      {p:'menejer',nom:'Кирим',   ik:'kirim', son:ml.filter(function(x){return x.tip==='kirim'}).length},
      {p:'kesim',  nom:'Чиқим',   ik:'chiqim',son:ml.filter(function(x){return x.tip==='chiqim'}).length},
      {p:'jurnal', nom:'Ёзувлар', ik:'jadval',son:ml.length}];
  }
  if(turonMi()){
    var tl=(D&&D.turon)?tSatrlar():[];
    return [
      {p:'umumiy', nom:'Умумий',   ik:'chart'},
      {p:'menejer',nom:'География',ik:'joy'},
      {p:'jurnal', nom:'Аъзолар',  ik:'jadval', son:tl.length},
      {p:'kesim',  nom:'Ўқувчилар',ik:'odam',   son:(D&&D.turonOq)?tOquvchilar().length:undefined}];
  }
  if(aiMi()){
    var al=(D&&D.ai)?aSatrlar():[];
    return [
      {p:'umumiy', nom:'Умумий',  ik:'chart'},
      {p:'jurnal', nom:'Ёзувлар', ik:'jadval', son:al.length}];
  }
  var l=satrlar();
  return [
    {p:'umumiy', nom:'Умумий',     ik:'chart'},
    {p:'menejer',nom:'Менежерлар', ik:'odam', son:guruhla(l,function(x){return x.menejer}).length},
    {p:'kesim',  nom:praktikumMi()?'Шаҳарлар':'Продукт', ik:'joy',
                 son:guruhla(l,kesim().ol).length},
    {p:'jurnal', nom:'Сотувлар',   ik:'jadval',son:l.length}];
}


function chiz(){
  if(S.xato && !D){
    main.innerHTML='<div class="xato"><b>Серверга уланиб бўлмади</b>'+esc(S.xato)+
      '<div style="margin-top:10px;font-size:12.5px">Текширинг: Apps Script <b>Deploy → Anyone</b> қилинганми.</div></div>'+
      '<button class="btn" id="qaytaBtn">Қайта уриниш</button>';
    return;
  }
  if(!D) return;

  var axh=yoqMi()?null:arxHolat();
  main.innerHTML = yoqMi()
    ? ulanmaganSahifa()
    : axh
    ? axh
    : arxPanelMi()
    ? arxPanelSahifa()
    : rbcPanelMi()
    ? rbcPanelSahifa()
    : iiPanelMi()
    ? iiPanelSahifa()
    : panelMi()
    ? panelSahifa()
    : nazoratMi()
    ? nazoratSahifa()
    : markMi()
    ? ( S.sahifa==='umumiy'  ? markUmumiy()  :
        S.sahifa==='menejer' ? markTarget()  :
        S.sahifa==='kesim'   ? markStadiya() :
        S.sahifa==='konv'    ? markKonv()    : markJurnal() )
    : aiMi()
    ? ( S.sahifa==='umumiy' ? aiUmumiy() : aiJurnal() )
    : turonMi()
    ? ( S.sahifa==='umumiy'  ? turonUmumiy() :
        S.sahifa==='menejer' ? turonGeo()    :
        S.sahifa==='kesim'   ? turonOquvchi(): turonJurnal() )
    : moliyaMi()
    ? ( S.sahifa==='umumiy'  ? moliyaUmumiy()          :
        S.sahifa==='menejer' ? moliyaYonalish('kirim') :
        S.sahifa==='kesim'   ? moliyaYonalish('chiqim'): moliyaJurnal() )
    : ( S.sahifa==='umumiy'  ? umumiySahifa()  :
        S.sahifa==='menejer' ? menejerSahifa() :
        S.sahifa==='kesim'   ? kesimSahifa()   : jurnalSahifa() );

  // Телефонда харита кенг — уни шаҳарлар турган жойга суриб қўямиз
  var xs=main.querySelector('.xscroll');
  if(xs) xs.scrollLeft=Math.max(0,(xs.scrollWidth-xs.clientWidth)*0.62);

  /* Бўлим тугмалари икки жойда: чап менюда ва пастки панелда */
  var m=menyu();
  document.body.classList.toggle('dokyoq', m.length<2);
  ['#side','#bnav'].forEach(function(joy){
    var n=document.querySelectorAll(joy+' .ni[data-p]');
    for(var i=0;i<n.length;i++){
      var b=m[i];
      // Баъзи бўлимларда панел камроқ (масалан, сунъий интеллектда 2 та)
      if(!b){ n[i].style.display='none'; continue }
      n[i].style.display='';
      n[i].dataset.p=b.p;
      n[i].querySelector('.ik').innerHTML=
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+IKONKA[b.ik]+'</svg>';
      n[i].querySelector('.nt').textContent=b.nom;
      var sn=n[i].querySelector('.nson');
      if(sn){
        var bor=(b.son||b.son===0);
        sn.textContent=bor?fmt(b.son):'';
        sn.style.display=bor?'':'none';
      }
      n[i].classList.toggle('on',b.p===S.sahifa);
    }
  });
  var jg=guruhTop(S.prod); if(jg) S.gOch=jg.g.k;
  guruhChiz();
  var p=document.querySelectorAll('#pswitch .adm-btn');
  for(var j=0;j<p.length;j++) p[j].classList.toggle('on',p[j].dataset.prod===S.prod);

  var tp=document.getElementById('tbProd');
  if(tp) tp.textContent=PROD_NOM[S.prod]||'';
}

function tepaga(){ main.scrollTop=0; window.scrollTo(0,0) }

function sahifaOch(nom){ S.sahifa=nom; S.ochiq=null; S.qidiruv=''; chiz(); tepaga() }
function produktOch(p){
  if(S.prod===p) return;
  if(p==='admin' && !adminMi()) return;
  S.prod=p;
  faolYubor(PROD_NOM[p]||p);
  if(p==='admin') nazoratYukla();
  if(p==='moliya') moliyaYukla();
  if(p==='marketing') markYukla();
  if(p==='ai') aiYukla();
  if(p==='turon') turonYukla();
  if(p==='panel' && D){ moliyaYukla(); markYukla(); }
  if(p==='rbc_panel') turonYukla();
  if(potok()) arxYukla(potok());
  if(p==='ii_panel') aiYukla();
  // Фильтрни тозалаймиз: акс ҳолда «Бугун» қолиб кетиб,
  // янги бўлим сабабсиз бўм-бўш кўринади.
  S.sahifa='umumiy'; S.ochiq=null; S.qidiruv=''; S.oraliq='hammasi'; S.target='hammasi';
  S.tDav=null; S.tVil=null; S.oqId=null;
  S.dan=null; S.gacha=null;
  chiz(); tepaga();
}

var navlar=document.querySelectorAll('.ni[data-p]');
for(var i=0;i<navlar.length;i++)
  navlar[i].onclick=function(){ sahifaOch(this.dataset.p) };

guruhChiz();
document.getElementById('pswitch').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-guruh]'))){
    var k=t.dataset.guruh;
    if(S.gOch===k){ S.gOch=null; guruhChiz(); return }       // очиқ бўлса — ёпамиз
    S.gOch=k;
    var j=guruhTop(S.prod);
    // Бошқа гуруҳ очилса — ўша гуруҳнинг бошқарув панелига ўтамиз
    if(!j || j.g.k!==k){
      var g=GURUH.filter(function(x){ return x.k===k })[0];
      produktOch(g.ich[0].p);
    } else guruhChiz();
    return;
  }
  if((t=e.target.closest('[data-prod]'))) produktOch(t.dataset.prod);
});

main.addEventListener('click',async function(e){
  var t;
  if((t=e.target.closest('[data-prodga]'))){ produktOch(t.dataset.prodga); return }
  /* ── Turon club: давлат / вилоят танлаш ── */
  if((t=e.target.closest('[data-tdav]'))){
    e.preventDefault();
    S.tDav=t.getAttribute('data-tdav')||null; S.tVil=null;
    if(S.sahifa!=='menejer'){ S.sahifa='menejer'; S.qidiruv='' }
    chiz(); tepaga(); return;
  }
  if((t=e.target.closest('[data-oq]'))){
    e.preventDefault();
    S.oqId=t.getAttribute('data-oq')||null; chiz(); tepaga(); return;
  }
  if((t=e.target.closest('[data-tvil]'))){
    e.preventDefault();
    var v=t.getAttribute('data-tvil')||null;
    S.tVil=(S.tVil===v)?null:v; chiz(); return;
  }
  /* ── Молия: ёзувни босса — изоҳи пастда очилади ── */
  if((t=e.target.closest('[data-miz]'))){
    if(window.getSelection && String(window.getSelection())) return;   // матн белгиланаётган бўлса
    t.classList.toggle('och');
    return;
  }
  /* ── Назорат (admin) ── */
  if((t=e.target.closest('[data-qnom]'))){
    S.nomTahrir=t.dataset.qnom; chiz();
    var n=document.getElementById('nzNomIn'); if(n){ n.focus(); n.select() }
    return;
  }
  if(e.target.closest('[data-qbekor]')){ S.nomTahrir=null; chiz(); return }
  if((t=e.target.closest('[data-qsaqla]'))){
    var inp=document.getElementById('nzNomIn');
    if(await nzAmal({amal:'nom',qid:t.dataset.qsaqla,nom:inp?inp.value.trim():''},'Ном сақланди')){
      S.nomTahrir=null; nazoratYukla(true);
    }
    return;
  }
  if((t=e.target.closest('[data-qblok]'))){
    var bl=t.dataset.b==='1';
    if(!confirm(bl?'Бу қурилмани блоклайсизми? У қайта кира олмайди.':'Блокдан чиқарасизми?')) return;
    if(await nzAmal({amal:'blok',qid:t.dataset.qblok,blok:bl},bl?'Қурилма блокланди':'Блокдан чиқарилди')) nazoratYukla(true);
    return;
  }
  if((t=e.target.closest('[data-qjur]'))){ S.jQid=t.dataset.qjur; sahifaOch('jurnal'); return }
  if(e.target.closest('[data-jtoz]')){ S.jQid=null; chiz(); return }
  if((t=e.target.closest('[data-kodsaqla]'))){
    var rol=t.dataset.kodsaqla, el=document.getElementById('kod_'+rol), v=el?el.value.replace(/\D/g,''):'';
    if(v.length!==6){ xabar('Код 6 та рақам бўлиши керак',true); return }
    if(!confirm((rol==='admin'?'Admin':'Ходим')+' кодини '+v+' га алмаштирасизми?')) return;
    if(await nzAmal({amal:'kod',rol:rol,yangi:v},'Код алмаштирилди')){ if(el) el.value=''; nazoratYukla(true) }
    return;
  }
  if(e.target.closest('#chiqarBtn')){
    if(!confirm('Ҳамма қурилмадаги сеанс тугайди, сиз ҳам қайта кирасиз. Давом этамизми?')) return;
    if(await nzAmal({amal:'chiqar'},'Ҳамма чиқарилди')) qulfla('Ҳамма сеанслар тугатилди — қайта киринг');
    return;
  }
  if((t=e.target.closest('[data-prod]'))){ produktOch(t.dataset.prod); return }
  if((t=e.target.closest('[data-o]'))){
    S.oraliq=t.dataset.o;
    if(S.oraliq!=='oraliq'){ S.dan=null; S.gacha=null }
    chiz(); return;
  }
  if(e.target.closest('#qollaBtn')){
    var a=document.getElementById('dan').value, b=document.getElementById('gacha').value;
    if(!a&&!b){ xabar('Санани танланг',true); return }
    S.tmpDan=a; S.tmpGacha=b; S.dan=a||null; S.gacha=b||null;
    chiz(); xabar('Сана қўлланди'); return;
  }
  if((t=e.target.closest('[data-davr]'))){ S.davr=t.dataset.davr; chiz(); return }
  if(e.target.closest('[data-konvga]')){ sahifaOch('konv'); return }
  if((t=e.target.closest('[data-tg]'))){ S.target=t.dataset.tg; S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-tgk]'))){
    S.ochiq = S.ochiq===t.dataset.tgk ? null : t.dataset.tgk;
    chiz();
    setTimeout(function(){
      var d=document.querySelector('.detail');
      if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'});
    },40);
    return;
  }
  if((t=e.target.closest('[data-val]'))){ S.valyuta=t.dataset.val; S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-mkes]'))){
    S.ochiq = S.ochiq===t.dataset.mkes ? null : t.dataset.mkes;
    chiz();
    setTimeout(function(){ var d=document.querySelector('.detail'); if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'}) },40);
    return;
  }
  if(e.target.closest('#mTema')){ temaQoy(!qoraMi(),true); chiz(); return }
  if(e.target.closest('#mYangila')||e.target.closest('#eskiYangila')){ hammasiYangila(); return }
  if(e.target.closest('#qaytaBtn')){ yukla(); return }
  if(e.target.closest('[data-yop]')){ S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-men]'))||(t=e.target.closest('[data-kes]'))){
    var nomi=t.dataset.men||t.dataset.kes;
    S.ochiq = S.ochiq===nomi ? null : nomi;
    chiz();
    setTimeout(function(){
      var d=document.querySelector('.detail');
      if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'});
    },40);
  }
});

main.addEventListener('input',function(e){
  if(e.target.id==='qid'){
    S.qidiruv=e.target.value;
    var joy=e.target.selectionStart;
    chiz();
    var n=document.getElementById('qid');
    if(n){ n.focus(); n.setSelectionRange(joy,joy) }
  }
  if(e.target.id==='dan')   S.tmpDan=e.target.value;
  if(e.target.id==='gacha') S.tmpGacha=e.target.value;
});

function hammasiYangila(){
  xabar('Янгиланмоқда…');
  S.yangi=true;                       // сервердаги кэшни четлаб ўтамиз
  yukla(true);
  if(moliyaMi()) moliyaYukla(true);
  if(markMi())   markYukla(true);
  if(aiMi())     aiYukla(true);
  if(turonMi())  turonYukla(true);
  if(panelMi()){ moliyaYukla(true); markYukla(true); }
  if(rbcPanelMi()) turonYukla(true);
  if(iiPanelMi())  aiYukla(true);
  if(potok())      arxYukla(potok(),true);
  if(nazoratMi()) nazoratYukla(true);
  setTimeout(function(){ S.yangi=false },4000);
}
document.getElementById('yangilaBtn').onclick=hammasiYangila;
document.getElementById('yangilaBtn2').onclick=hammasiYangila;
document.getElementById('chiqishBtn').onclick=function(){
  if(confirm('Тизимдан чиқасизми?')) chiqish();
};

/* ── чап меню: очиш / ёпиш ── */
function telefonmi(){ return window.matchMedia('(max-width:820px)').matches }

function menyuHolat(ochiq){
  document.body.classList.toggle('yopiq',!ochiq);
  try{ if(!telefonmi()) localStorage.setItem(MENYU,ochiq?'1':'0') }catch(e){}
}
function menyuAlmash(){ menyuHolat(document.body.classList.contains('yopiq')) }

document.getElementById('burger').onclick=menyuAlmash;
document.getElementById('ovl').onclick=function(){ menyuHolat(false) };

/* Телефонда бўлим танлангач меню ўзи ёпилади */
document.getElementById('side').addEventListener('click',function(e){
  if(telefonmi() && e.target.closest('.ni[data-p], #pswitch [data-prod]')) menyuHolat(false);
});

/* Дастлабки ҳолат: компьютерда очиқ, телефонда ёпиқ */
(function(){
  var v=null;
  try{ v=localStorage.getItem(MENYU) }catch(e){}
  menyuHolat(telefonmi() ? false : v!=='0');
})();

/* ── ранг режими ── */
function temaQoy(qora,eslab){
  document.body.classList.toggle('oq',!qora);
  var s=document.querySelector('#temaBtn span');
  if(s) s.textContent=qora?'Оқ режим':'Қора режим';
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',qora?'#0B0D10':'#F4F2ED');
  if(eslab){ try{ localStorage.setItem(TEMA,qora?'qora':'oq') }catch(e){} }
}
function temaAlmash(){ temaQoy(!qoraMi(),true); chiz() }
document.getElementById('temaBtn').onclick=temaAlmash;
document.getElementById('temaBtn2').onclick=temaAlmash;

var tid;
function xabar(m,xato){
  var t=document.getElementById('toast');
  t.textContent=m; t.className='toast on'+(xato?' err':'');
  clearTimeout(tid); tid=setTimeout(function(){ t.className='toast' },3000);
}

/* ── ишга тушириш ── */
(function(){
  var v=null;
  try{ v=localStorage.getItem(TEMA) }catch(e){}
  // Асосийси — қора режим. Фойдаланувчи оқни танласагина оқ бўлади.
  temaQoy(v!=='oq',false);
})();
kirishBoshla();
</script>
