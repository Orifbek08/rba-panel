  {kalit:'хужанд',    nom:'Хўжанд',    davlat:'Тожикистон',  lat:40.28, lon:69.62},
  {kalit:'тошкент',   nom:'Тошкент',   davlat:'Ўзбекистон',  lat:41.31, lon:69.24}
];

var DAVLAT_RANG = {
  'Ўзбекистон':  '#4ECB92',
  'Қозоғистон':  '#5E9BD6',
  'Қирғизистон': '#E8A244',
  'Тожикистон':  '#A08FD0'
};

/**
 * «6 Тошкент» → шаҳар маълумоти.
 * ⚠ Диққат: «тошкент» ичида «ош» бор, шунинг учун ичидан излаш МУМКИН ЭМАС —
 *   фақат тўлиқ мослик текширилади.
 */
function shaharNorm(nom){
  return String(nom||'').toLowerCase()
    .replace(/ў/g,'у').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҳ/g,'х')
    .replace(/ы/g,'и').replace(/ё/g,'е').replace(/й/g,'и')
    .replace(/[\s\d.,\-—]/g,'');
}

function shaharTop(nom){
  var t=shaharNorm(nom);
  if(!t) return null;
  for(var i=0;i<SHAHAR.length;i++)
    if(t===shaharNorm(SHAHAR[i].kalit)) return SHAHAR[i];
  return null;
}


/**
 * Тадбирлар харитаси.
 * Доира катталиги — сотув сони, ранги — давлат.
 * ⚠ Бу схематик харита: шаҳарлар ҳақиқий координаталари бўйича
 *   жойлаштирилган, лекин давлат чегаралари чизилмаган.
 */
/** Координатани харита нуқтасига айлантиради */
function xproy(lon,lat){
  var p=XARITA_PROY;
  return [ (lon-p.lon0)*p.kx, (p.lat1-lat)*p.k ];
}

/**
 * ТАДБИРЛАР ХАРИТАСИ — ҳақиқий давлат чегаралари билан.
 * Шаҳарлар аниқ координатасида туради; ном ва изоҳ ёнига чиқарилиб,
 * бир-бирига халақит бермаслиги учун сурилади (ингичка чизиқ билан боғланади).
 */
function xarita(guruh, mijoz){
  var nuq=[];
  guruh.forEach(function(g){
    var sh=shaharTop(g.nom);
    if(sh) nuq.push({sh:sh, g:g});
  });
  if(!nuq.length) return '';

  var birlik = mijoz ? ' та мижоз' : ' та сотув';
  var W=XARITA_W, H=XARITA_H;
  var max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni; });

  // ── давлатлар ──
  var davKod={'Ўзбекистон':'uz','Қозоғистон':'kz','Қирғизистон':'kg','Тожикистон':'tj'};
  var dav={};
  nuq.forEach(function(x){
    var d=x.sh.davlat;
    if(!dav[d]) dav[d]={nom:d,soni:0,shahar:0};
    dav[d].soni+=x.g.soni; dav[d].shahar++;
  });

  var yer='';
  ['kz','uz','kg','tj'].forEach(function(k,i){
    var nomi=null;
    for(var d in davKod) if(davKod[d]===k) nomi=d;
    var bor=!!dav[nomi];
    yer+='<path class="xyer'+(bor?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(bor?DAVLAT_RANG[nomi]:'var(--line)')+'" '+
      'stroke="'+(bor?DAVLAT_RANG[nomi]:'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+nomi+
      (bor?' — '+fmt(dav[nomi].soni)+birlik:'')+'</title></path>';
  });

  // ── шаҳар нуқталари ──
  var P=nuq.map(function(x){
    var c=xproy(x.sh.lon,x.sh.lat);
    return { x:c[0], y:c[1], r:9+15*Math.sqrt(x.g.soni/max), it:x };
  });

  /* Ёзувни доиранинг ЁНИГА чиқарамиз (тагига эмас) —
     Тошкент, Шимкент ва Хўжанд бир вертикалда тургани учун
     тагига қўйилса устма-уст тушади. */
  P.sort(function(a,b){ return a.y-b.y });
  var ENI=96;                                  // ёзув эгаллайдиган тахминий кенглик
  P.forEach(function(p){
    p.ong = p.x < XARITA_W*0.62;               // ўнгда жой борми
    p.lx = p.ong ? p.x+p.r+10 : p.x-p.r-10;
    p.ly = p.y-1;
  });
  /* Ёзувлар бир-бирини босмаслиги учун вертикал суриб чиқарамиз.
     Чапга ва ўнгга ёзилганлар турли томонга чўзилади, шунинг учун
     фақат lx эмас, ёзувнинг БУТУН эгаллаган жойи солиштирилади. */
  function chap(p){ return p.ong ? p.lx : p.lx-ENI }
  function ong(p){  return p.ong ? p.lx+ENI : p.lx }
  for(var q=0;q<220;q++){
    for(var i=0;i<P.length;i++){
      for(var j=i+1;j<P.length;j++){
        if(chap(P[i])>ong(P[j]) || ong(P[i])<chap(P[j])) continue;   // кесишмайди
        var dy=P[j].ly-P[i].ly, d=Math.abs(dy);
        if(d<42){
          var s2=(42-d)/2*(dy<0?-1:1);
          P[i].ly-=s2; P[j].ly+=s2;
        }
      }
    }
  }
  P.forEach(function(p){ p.ly=Math.max(22,Math.min(H-24,p.ly)) });

  var shar='';
  P.forEach(function(p,i){
    var x=p.it, t=mijoz?null:tadbir(x.g.nom);
    var kutil=t && !t.otdi;
    var c=DAVLAT_RANG[x.sh.davlat];
    var uch=p.ong ? p.x+p.r : p.x-p.r;
    var chiziq='<line class="xulash" x1="'+uch.toFixed(1)+'" y1="'+p.y.toFixed(1)+
      '" x2="'+p.lx.toFixed(1)+'" y2="'+p.ly.toFixed(1)+'" stroke="'+c+'"/>';
    var yon=p.ong?'start':'end';
    shar+='<g class="xsh'+(S.ochiq===x.g.nom?' tanlangan':'')+'" data-kes="'+esc(x.g.nom)+
      '" style="animation-delay:'+(0.4+i*0.09).toFixed(2)+'s">'+chiziq+
      (kutil?'<circle class="xpuls" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'"/>':'')+
      '<circle class="xdoira" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'" fill-opacity="'+(kutil?.55:.34)+'" stroke="'+c+'" stroke-width="2"/>'+
      '<text class="xson" x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+p.lx.toFixed(1)+'" y="'+(p.ly-3).toFixed(1)+'" text-anchor="'+yon+'">'+
        esc(x.sh.nom)+'</text>'+
      '<text class="xizoh" x="'+p.lx.toFixed(1)+'" y="'+(p.ly+11).toFixed(1)+'" text-anchor="'+yon+'" '+
        'fill="'+(kutil?c:'currentColor')+'">'+
        (t?(t.otdi?'бўлиб ўтди':t.kun+' кун қолди')
           :(mijoz&&jami?Math.round(x.g.soni/jami*100)+'%':''))+'</text>'+
      '<title>'+esc(x.sh.nom)+' · '+x.sh.davlat+' — '+fmt(x.g.soni)+birlik+'</title></g>';
  });

  var tashqari=guruh.filter(function(g){ return !shaharTop(g.nom) });
  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){
        return '<button class="xchip" data-kes="'+esc(g.nom)+'"><b>'+fmt(g.soni)+'</b>'+esc(g.nom)+'</button>';
      }).join('')+'</div>'
    : '';

  var afsona='<div class="xafs">'+Object.keys(dav).sort().map(function(d){
    return '<span><i style="background:'+DAVLAT_RANG[d]+'"></i>'+d+' <b>'+fmt(dav[d].soni)+'</b></span>';
  }).join('')+'</div>';

  return '<div class="xkarta"><div class="xscroll">'+
    '<svg class="xsvg" viewBox="0 0 '+W+' '+H+'">'+yer+shar+'</svg></div>'+
    '<div class="xsurish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Харитани чапга-ўнгга суринг</div>'+
    afsona+chip+'</div>';
}


/* ══════════════════════════════════════════════════════
   10. БЎЛИМ 3 — ШАҲАРЛАР / ПРОДУКТ
   «Қаерга сотилди ва ким сотди?»

function kesimSahifa(){
  var l=satrlar(), k=kesim();
  var guruh=tartibla(guruhla(l,k.ol));
  var max=1;
  guruh.forEach(function(x){ if(x.soni>max) max=x.soni });
  var ochiq=null;
  guruh.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var h=sarlavha(praktikumMi()?'Шаҳарлар':'Продукт',
    'Қаерга қанча сотилган — батафсил учун босинг',
    sanaFiltr()+mobilTugma());

  h+='<div class="grid">'+(guruh.length?guruh.map(function(x,i){
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-kes="'+esc(x.nom)+'">'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+(kunIzoh(x.nom)||pul(x.tolangan))+'</div>'+
      '<div class="cq"><b class="num">'+fmt(x.soni)+'</b><span>та сотув</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.soni/max*100)+'%;background:'+rang(i)+'"></i></div>'+
    '</button>';
  }).join(''):'<div class="empty">Маълумот йўқ</div>')+'</div>';

  if(ochiq){
    var men=guruhla(ochiq.satrlar,function(x){ return x.menejer });
    h+='<div class="detail">'+
      '<div class="dh"><div class="dm"><h3>'+esc(ochiq.nom)+'</h3>'+
        '<div class="sub">'+esc(kunIzoh(ochiq.nom))+'</div>'+
        '<div class="chips">'+
          '<span class="chip">Сотув: <b>'+fmt(ochiq.soni)+'</b></span>'+
          '<span class="chip k">Тўланган <b>'+pul(ochiq.tolangan)+'</b></span>'+
          '<span class="chip c">Қарз <b>'+pul(ochiq.qarz)+'</b></span>'+
        '</div></div>'+
        '<button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="eb">Ким сотган</div>'+
        ustunlar(men.map(function(x){ return {nom:x.nom,qiy:x.soni,ong:pul(x.tolangan)} }))+'</div>'+
      '<div class="dbody"><div class="eb">Қачон сотилган</div>'+kunlikRoyxat(ochiq.satrlar)+'</div>'+
    '</div>';
  }

  // ── Саҳифа охири: мижозлар географияси + манбалар (фақат 3 кунлик) ──
  if(praktikumMi()) h+=mijozGeo(l);

  return h;
}

/**
 * МИЖОЗЛАР ГЕОГРАФИЯСИ — «Давлати» устуни бўйича.
 * Тадбир қаерда бўлгани эмас, МИЖОЗ қаердан экани кўрсатилади.
 */
function mijozGeo(l){
  var h='';

  /* «Давлати» устуни тўлдирилган қаторлар. Бўшлари фоизни бузмаслиги учун
     ҳисобдан чиқарилади, лекин сони пастда айтиб ўтилади. */
  var bilan=l.filter(function(x){ return x.davlat });
  var yoq=l.length-bilan.length;

  if(bilan.length){
    /* Ёзилиши ҳар хил бўлса ҳам битта давлат битта сатр бўлсин:
       «Киргизистан» ва «Қирғизистон» — бир хил ҳисобланади. */
    var geo=guruhla(bilan,function(x){
      var d=davlatTop(x.davlat);
      return d ? d.nom : x.davlat;
    });
    var xrt=xaritaDavlat(geo);
    var jami=0;
    geo.forEach(function(g){ jami+=g.soni });

    h+='<div class="sec"><h2>Мижозлар географияси</h2>'+
       '<p>Мижоз қайси давлатдан — доира катталиги мижозлар сони</p></div>';
    if(xrt) h+=xrt;

    h+='<div class="dbody"><div class="eb">Давлатлар бўйича мижозлар</div>'+
      ustunlar(geo.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong: jami?Math.round(x.soni/jami*100)+'%':'' };
      }))+
      (yoq?'<div class="sub" style="margin-top:12px">Яна '+fmt(yoq)+
           ' та сотувда «Давлати» устуни тўлдирилмаган</div>':'')+
      '</div>';
  }

  // ── Манбалар (Источник) ──
  if(l.some(function(x){ return x.manba })){
    var mn=guruhla(l,function(x){ return x.manba || 'Кўрсатилмаган' });
    var mj=0;
    mn.forEach(function(g){ mj+=g.soni });
    h+='<div class="sec"><h2>Манбалар</h2><p>Мижоз қайси манбадан келган</p></div>'+
      '<div class="dbody">'+ustunlar(mn.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong: (mj?Math.round(x.soni/mj*100)+'% · ':'')+pul(x.tolangan) };
      }))+'</div>';
  }

  return h;
}

function moliyaMi(){ return S.prod==='moliya' }

/** Молия ёзувлари: сана фильтри + валюта фильтри */
function mSatrlar(){
  var l=((D&&D.moliya)||[]).filter(function(x){ return x.valyuta===S.valyuta });
  return sanaFiltrla(l);
}

/** Валюта белгиси билан сумма */
function mpul(v){
  return S.valyuta==='USD' ? '$'+fmt(v) : fmt(v)+' сўм';
}

/** Қисқа кўриниш: 1 830 000 → 1.8 млн (метрикалар учун) */
function mqisqa(v){
  var a=Math.abs(v), b=v<0?'−':'';
  if(S.valyuta==='USD') return b+'$'+fmt(a);
  if(a>=1e9) return b+(a/1e9).toFixed(a>=1e10?0:1).replace('.',',')+' млрд';
  if(a>=1e6) return b+(a/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' млн';
  if(a>=1e3) return b+Math.round(a/1e3)+' минг';
  return b+fmt(a);
}

/** Кирим/чиқим бўйича жамлаш */
function mJam(l){
  var o={kirim:0,chiqim:0,soni:l.length};
  l.forEach(function(x){ if(x.tip==='kirim') o.kirim+=x.summa; else o.chiqim+=x.summa });
  o.farq=o.kirim-o.chiqim;
  return o;
}

/** Калит бўйича гуруҳлаб, суммаси бўйича тартиблайди */
function mGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,summa:0,soni:0,satrlar:[]}; t.push(k) }
    m[k].summa+=x.summa; m[k].soni++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.summa-a.summa });
}

/** Валюта танлаш тугмалари */
function valyutaSeg(){
  function b(v){ return '<button data-val="'+v+'" class="'+(S.valyuta===v?'on':'')+'">'+
    (v==='UZS'?'сўм':'$ USD')+'</button>' }
  return '<div class="seg">'+b('UZS')+b('USD')+'</div>';
}

/** Молия улданмаган ёки маълумот йўқ бўлса */

/**
 * КАССАДАГИ ҚОЛДИҚ — ҳозир ҳар бир кассада қанча пул борлиги.
 * Ҳисоб оддий: кирим − чиқим. Пастда ҳаммасининг йиғиндиси.
 */
function mKassaBlok(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.kassa||'Кўрсатилмаган';
    if(!m[k]){ m[k]={nom:k,kirim:0,chiqim:0,soni:0}; t.push(k) }
    var g=m[k];
    g.soni++;
    if(x.tip==='kirim') g.kirim+=x.summa; else g.chiqim+=x.summa;
  });
  if(!t.length) return bosh('Бу даврда маълумот йўқ');

  var q=t.map(function(k){ var g=m[k]; g.qoldiq=g.kirim-g.chiqim; return g })
         .sort(function(a,b){ return b.qoldiq-a.qoldiq });

  var jami={kirim:0,chiqim:0,soni:0};
  q.forEach(function(g){ jami.kirim+=g.kirim; jami.chiqim+=g.chiqim; jami.soni+=g.soni });
  jami.qoldiq=jami.kirim-jami.chiqim;

  var eng=1;
  q.forEach(function(g){ if(Math.abs(g.qoldiq)>eng) eng=Math.abs(g.qoldiq) });

  var h='<div class="kgrid">'+q.map(function(g){
    var manfiy=g.qoldiq<0;
    return '<div class="kk'+(manfiy?' minus':'')+'">'+
      '<div class="knom">'+esc(g.nom)+'</div>'+
      '<div class="kson num">'+mqisqa(g.qoldiq)+'</div>'+
      '<div class="kpul">'+mpul(Math.abs(g.qoldiq))+(manfiy?' минусда':'')+'</div>'+
      '<div class="kbar"><i style="width:'+Math.max(2,Math.abs(g.qoldiq)/eng*100)+'%"></i></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdk"></i>кирим</span><b class="num">'+mqisqa(g.kirim)+'</b></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdc"></i>чиқим</span><b class="num">'+mqisqa(g.chiqim)+'</b></div>'+
      '<div class="kqat kson2"><span>'+fmt(g.soni)+' та ёзув</span></div>'+
    '</div>';
  }).join('')+'</div>';

  h+='<div class="kjami'+(jami.qoldiq<0?' minus':'')+'">'+
    '<div><div class="kjl">Ҳамма кассада жами</div>'+
      '<div class="kjv num">'+mqisqa(jami.qoldiq)+'</div>'+
      '<div class="kjd">'+mpul(Math.abs(jami.qoldiq))+(jami.qoldiq<0?' минусда':'')+'</div></div>'+
    '<div class="kjo">'+
      '<div><span>кирим</span><b class="num">'+mqisqa(jami.kirim)+'</b></div>'+
      '<div><span>чиқим</span><b class="num">'+mqisqa(jami.chiqim)+'</b></div>'+
      '<div><span>ёзувлар</span><b class="num">'+fmt(jami.soni)+'</b></div>'+
    '</div></div>';

  return h;
}

/**
 * Доира диаграмма — фоизлар билан.
 * Ўртасида жами, ёнида рўйхат: ном, фоиз, сумма.
 */
function mDoira(guruh, rang, fmtFn){
  var F=fmtFn||mqisqa;
  if(!guruh.length) return bosh('Маълумот йўқ');
  var jami=0; guruh.forEach(function(x){ jami+=x.summa });
  if(!jami) return bosh('Маълумот йўқ');

  var top=guruh.slice(0,7);
  var qolgan=guruh.slice(7);
  if(qolgan.length){
    var q={nom:'Бошқалари',summa:0,soni:0};
    qolgan.forEach(function(x){ q.summa+=x.summa; q.soni+=x.soni });
    if(q.summa>0) top=top.concat([q]);
  }

  var R=62, qalin=30, C=2*Math.PI*R, siljish=0, halqa='', ichYorliq='';
  var AJRAT=5;                                  // бўлаклар орасидаги қора чизиқ
  top.forEach(function(x,i){
    var ul=x.summa/jami*C;
    if(ul<=0) return;
    var f=x.summa/jami*100;
    var kor=Math.max(0.5,ul-AJRAT);
    halqa+='<circle class="dsek" cx="90" cy="90" r="'+R+'" fill="none" stroke="'+mRang(i,rang)+'" '+
      'stroke-width="'+qalin+'" stroke-dasharray="0 '+C.toFixed(2)+'" '+
      'stroke-dashoffset="'+(-siljish-AJRAT/2).toFixed(2)+'" transform="rotate(-90 90 90)" '+
      'style="--ul:'+kor.toFixed(2)+';--bo:'+(C-kor).toFixed(2)+';animation-delay:'+
      (0.15+i*0.09).toFixed(2)+'s"><title>'+esc(x.nom)+': '+F(x.summa)+
      ' ('+(f>=10?Math.round(f):f.toFixed(1))+'%)</title></circle>';

    if(f>=6){
      var brc=(siljish+ul/2)/C*360-90;
      var rad=brc*Math.PI/180;
      ichYorliq+='<text class="dich" x="'+(90+R*Math.cos(rad)).toFixed(1)+'" y="'+
        (90+R*Math.sin(rad)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" '+
        'style="animation-delay:'+(0.7+i*0.07).toFixed(2)+'s">'+
        (f>=10?Math.round(f):f.toFixed(1))+'%</text>';
    }
    siljish+=ul;
  });

  return '<div class="doira">'+
    '<svg class="chart dsvg" viewBox="0 0 180 180">'+halqa+ichYorliq+
      '<text class="dt" x="90" y="86" text-anchor="middle">'+F(jami)+'</text>'+
      '<text class="dl" x="90" y="103" text-anchor="middle">жами</text></svg>'+
    '<div class="dleg">'+top.map(function(x,i){
      var f=jami?x.summa/jami*100:0;
      return '<div class="dlq" style="animation-delay:'+(0.25+i*0.06).toFixed(2)+'s">'+
        '<i style="background:'+mRang(i,rang)+'"></i>'+
        '<span class="dnom">'+esc(x.nom)+'</span>'+
        '<b class="dfo">'+(f>=10?Math.round(f):f.toFixed(1))+'%</b>'+
        '<span class="dsum">'+F(x.summa)+'</span></div>';
    }).join('')+'</div></div>';
}


/** Диаграмма учун ранг: асосий рангдан очиқроқ поғоналар */
function mRang(i,asos){
  /* Поғоналар етарлича тўқ — устидаги оқ фоиз ёзуви ҳамма бўлакда ўқилади */
  var yashil=['#2E9670','#38A87E','#25835F','#43BA8D','#1C704F','#4ECB92','#155C41','#66D7A3'];
  var qizil =['#C0524A','#D3625A','#A8443D','#E0736A','#8E3831','#EC8880','#7A2E28','#F09E97'];
  var l=(asos==='var(--red)')?qizil:yashil;
  return l[i%l.length];
}


/** Энг йирик моддалар — 2-даража (Стадия) кесимида */
function mTopModda(l,tip,rang){
  var g=mGuruh(l.filter(function(x){ return x.tip===tip }),
               function(x){ return x.stadiya||x.asosiy||'—' }).slice(0,8);
  return mUstunlar(g,rang);
}

/**
 * Саҳифа тагидаги изоҳ — ҳозир НИМА кўрсатилаётганини айтади.
 * Фильтр қўйилганда чалкашмаслик учун.
 */
function filtrIzoh(l){
  var d=['Ҳаммаси','Шу ой','Кеча','Бугун','Сана оралиғи'];
  var k=['hammasi','oy','kecha','kun','oraliq'].indexOf(S.oraliq);
  var davr=d[k<0?0:k];

  var sanalar=l.map(function(x){ return x.sana }).filter(Boolean).sort();
  var oraliq = sanalar.length
    ? dfmt(sanalar[0])+' — '+dfmt(sanalar[sanalar.length-1])
    : '—';

  var q=[
    ['Давр', davr],
    ['Сана оралиғи', oraliq],
    ['Валюта', S.valyuta==='USD'?'AQSH доллари':'сўм'],
    ['Ёзувлар', fmt(l.length)+' та']
  ];
  if(S.kassa && S.kassa!=='hammasi') q.push(['Касса', S.kassa]);

  return '<div class="fizoh"><div class="eb">Ҳозир нима кўрсатилмоқда</div><div class="fq">'+
    q.map(function(x){
      return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';
    }).join('')+'</div>'+
    '<p>Юқоридаги барча рақамлар шу шартларга мос ёзувлардан ҳисобланган. '+
    'Бошқа давр керак бўлса, тепадаги сана тугмаларини ўзгартиринг.</p></div>';
}

/** Молия учун Кун / Ҳафта / Ой тугмалари — хулосада энг катта кирим кўрсатилади */
function mDavrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    if(x.tip!=='kirim') return;
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+x.summa;
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг катта кирим: '+davrYorliq(eng)+' \u2014 '+mqisqa(m[eng]) : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}

/** Кирим/чиқим динамикаси — ёнма-ён иккита устун */
function mDinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={kirim:0,chiqim:0}; t.push(k) }
    m[k][x.tip]+=x.summa;
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда ёзув йўқ');

  var slot = S.davr==='kun' ? 28 : 56;
  var chap = 68, ong = 26, tep = 30, past = 54;
  var bor = Math.max(320, (main.clientWidth||960) - 74);
  var W = Math.max(bor, chap+ong+slot*(t.length-1)), H = 252;
  var max = 1;
  t.forEach(function(k){ max=Math.max(max,m[k].kirim,m[k].chiqim) });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+mqisqa(max*f)+'</text>';
  });

  var id=Math.floor(Math.random()*1e6);
  var qatlam='';
  [['kirim','var(--ok)','k'+id],['chiqim','var(--no)','c'+id]].forEach(function(p,qi){
    var nuq=t.map(function(k,i){ return [X(i),Y(m[k][p[0]])] });
    var yol=egri(nuq);
    qatlam+='<path class="aarea" d="'+yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+
      'L'+X(0).toFixed(1)+' '+(H-past)+'Z" fill="url(#'+p[2]+')" '+
      'style="animation-delay:'+(0.45+qi*0.12).toFixed(2)+'s"/>'+
      '<path class="aline" d="'+yol+'" fill="none" stroke="'+p[1]+'" stroke-width="2.4" '+
      'stroke-linecap="round" stroke-linejoin="round" '+
      'style="animation-delay:'+(0.1+qi*0.18).toFixed(2)+'s"/>';
  });

  var qadam=Math.max(1,Math.ceil(t.length/12));
  var yorliq='',belgi='';
  t.forEach(function(k,i){
    var x=X(i);
    if(t.length<=30 || i%qadam===0 || i===t.length-1){
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].kirim).toFixed(1)+
        '" r="3" fill="var(--ok)" style="animation-delay:'+(0.55+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · кирим '+mpul(m[k].kirim)+'</title></circle>'+
        '<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].chiqim).toFixed(1)+
        '" r="3" fill="var(--no)" style="animation-delay:'+(0.6+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · чиқим '+mpul(m[k].chiqim)+'</title></circle>';
    }
  });

  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" '+
    'viewBox="0 0 '+W+' '+H+'" style="max-width:100%">'+
    '<defs>'+
      '<linearGradient id="k'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--ok);stop-opacity:.40"/>'+
        '<stop offset="100%" style="stop-color:var(--ok);stop-opacity:0"/></linearGradient>'+
      '<linearGradient id="c'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--no);stop-opacity:.36"/>'+
        '<stop offset="100%" style="stop-color:var(--no);stop-opacity:0"/></linearGradient>'+
    '</defs>'+tor+qatlam+belgi+yorliq+'</svg></div>'+
    '<div class="mlg"><span><i class="mkirb"></i>кирим</span><span><i class="mchib"></i>чиқим</span></div>'+
    (W>bor+4 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Сумма бўйича горизонтал устунлар */
function mUstunlar(l,rangi){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var jami=l.reduce(function(s,x){ return s+x.summa },0);
  var max=l[0].summa||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+'<small>'+x.soni+' та ёзув · '+foiz(x.summa,jami)+'%</small></div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.summa/max*100)+
        '%;background:'+(rangi||rang(i))+'"></div></div>'+
      '<div class="bv">'+mqisqa(x.summa)+'</div></div>';
  }).join('')+'</div>';
}

/** Сана бўйича гуруҳланган молия ёзувлари */
function mRoyxat(l){
  if(!l.length) return '<div class="empty">Ёзув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) }).slice(0,200);
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],kir=0,chi=0;
    lst.forEach(function(x){ if(x.tip==='kirim') kir+=x.summa; else chi+=x.summa });
    var yozuv=[];
    if(kir) yozuv.push('<span style="color:var(--green)">+'+mqisqa(kir)+'</span>');
    if(chi) yozuv.push('<span style="color:var(--red)">−'+mqisqa(chi)+'</span>');
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+yozuv.join(' · ')+'</span></div>'+
      lst.map(function(x){
        var kir2=x.tip==='kirim';
        return '<div class="jkart"><div class="jchap">'+
          '<div class="jnom">'+esc(x.stadiya||x.asosiy||'—')+'</div>'+
          '<div class="jmeta">'+esc([x.asosiy,x.kichik].filter(Boolean).join(' · '))+'</div></div>'+
          '<div class="jong"><div class="jmiq" style="color:'+(kir2?'var(--green)':'var(--red)')+'">'+
            (kir2?'+':'−')+mqisqa(x.summa)+'</div>'+
          '<div class="jxod">'+esc(x.kassa||'')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

/* ══════════════════════════════════════════════════════
   15. МАРКЕТИНГ
   «Лидлар қаердан келди ва нечтаси сотувга айланди?»
   ══════════════════════════════════════════════════════ */

function markMi(){ return S.prod==='marketing' }

var MK_NOM={yangi:'Янги лид',sifatsiz:'Сифатсиз',sotuv:'Сотув',obrabotka:'Обработкада'};
var MK_RANG={yangi:'var(--info)',sifatsiz:'var(--no)',sotuv:'var(--ok)',obrabotka:'var(--a)'};

/** Сана ва таргетолог фильтридан ўтган лидлар */
function kSatrlar(barchaTarget){
  if(!D || !D.marketing) return [];
  var l=sanaFiltrla(D.marketing);
  if(!barchaTarget && S.target!=='hammasi')
    l=l.filter(function(x){ return x.target===S.target });
  return l;
}

function kJam(l){
  var o={jami:l.length,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0};
  l.forEach(function(x){ o[x.holat]++ });
  o.konv=o.jami?o.sotuv/o.jami*100:0;
  return o;
}

function kFoiz(f){ return (f>=10?Math.round(f):f.toFixed(1))+'%' }

/** Таргетологлар кесими — конверсия бўйича */
function kTargetlar(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.target||'—';
    if(!m[k]){ m[k]={nom:k,jami:0,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0,satrlar:[]}; t.push(k) }
    m[k].jami++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){
    var g=m[k]; g.konv=g.jami?g.sotuv/g.jami*100:0; return g;
  }).sort(function(a,b){ return b.jami-a.jami });
}

function kBoshHolat(){
  if(S.kBand || (markUlangan() && D && !D.marketing && !D.markXato))
    return '<div class="load"><div class="spin"></div>Маркетинг маълумоти юкланмоқда…</div>';
  if(!markUlangan())
    return '<div class="empty"><b>Маркетинг уланмаган</b>HTML файлдаги <b>API_MARKETING</b> га '+
           'Marketing.gs дан чиққан ҳаволани қўйинг.</div>';
  if(D && D.markXato)
    return '<div class="xato"><b>Маркетинг серверига уланиб бўлмади</b>'+esc(D.markXato)+'</div>';
  if(!D.marketing || !D.marketing.length) return kTashxis();
  return '';
}

function kTashxis(){
  var t=D.markTashxis;
  if(!t) return '<div class="tsh"><h3>Лид ўқилмади</h3>'+
    '<p>Сервер ташхис юбормади — эски версия ишлаяпти.</p>'+
    '<div class="tshq">Apps Script → Deploy → Manage deployments → ✏ → '+
    'Version: <b>New version</b> → Deploy</div></div>';
  return '<div class="tsh"><h3>Лид ўқилмади</h3><table class="tshj">'+
    '<tr><td>Скрипт версияси</td><td><b>'+esc(t.versiya||'?')+'</b></td></tr>'+
    '<tr><td>Ўқилган варақ</td><td><b>«'+esc(t.varaq)+'»</b></td></tr>'+
    '<tr><td>Варақдаги қаторлар</td><td><b>'+fmt(t.jamiQator)+'</b></td></tr>'+
    '<tr><td>Сана йўқ</td><td><b>'+fmt(t.sanasiz||0)+'</b></td></tr>'+
    '<tr><td>Ўқилди</td><td><b>'+fmt(t.oqilgan)+'</b></td></tr></table></div>';
}

/** Таргетолог танлаш тугмалари */
function kTargetSeg(){
  var l=kTargetlar(sanaFiltrla(D.marketing||[]));
  var h='<div class="seg ksg"><button data-tg="hammasi" class="'+(S.target==='hammasi'?'on':'')+'">Ҳаммаси</button>';
  l.forEach(function(x){
    h+='<button data-tg="'+esc(x.nom)+'" class="'+(S.target===x.nom?'on':'')+'">'+esc(x.nom)+'</button>';
  });
  return h+'</div>';
}

/** Ҳолат бўйича тақсимот — тўртта рангли полоса */
function kHolatChiziq(j){
  if(!j.jami) return '';
  var q=['sotuv','obrabotka','yangi','sifatsiz'];
  return '<div class="kchiz">'+q.map(function(k){

/** Маркетинг учун гуруҳлаш (сон бўйича) */
function kGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,soni:0,sotuv:0,sifatsiz:0,obrabotka:0,yangi:0,satrlar:[]}; t.push(k) }
    m[k].soni++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.soni-a.soni });
}

/* ══════════════════════════════════════════════════════
   0. БОШҚАРУВ ПАНЕЛИ — эрталабки ҳисобот
   1) Режа / факт   2) Кечаги энг зўр менежер
   3) Кечаги ҳисобот   4) Молия: кассалар ва кечаги кирим/чиқим
   Сана фильтри йўқ — бу саҳифа доим «кеча» ва «ҳозир» ҳақида.
   ══════════════════════════════════════════════════════ */

function panelMi(){ return S.prod==='panel' }

var PV_PROD=[
  {k:'praktikum', nom:'3 кунлик', rang:'#E0A048'},
  {k:'kouch',     nom:'Коучинг',  rang:'#4ECB92'},
  {k:'ai',        nom:'AI 3.0',   rang:'#A08FD0'}
];

var HAFTA_KUN=['якшанба','душанба','сешанба','чоршанба','пайшанба','жума','шанба'];
var OY_NOM=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];

function kechaSana(){ var k=new Date(); k.setHours(0,0,0,0); k.setDate(k.getDate()-1); return k }
function kechaMi(sana){
  var d=sanaOqi(sana); if(!d) return false;
  d.setHours(0,0,0,0);
  return d.getTime()===kechaSana().getTime();
}
function kechaMatn(){
  var k=kechaSana();
  return k.getDate()+' '+OY_NOM[k.getMonth()]+', '+HAFTA_KUN[k.getDay()];
}

/** Продуктнинг ҳамма сотувлари (ёки null — юкланмаган) */
function pvBarcha(k){
  if(!D) return null;
  if(k==='ai') return D.ai||null;
  return (k==='praktikum'?D.praktikum:D.kouch)||[];
}

/** Режа («план» варағидан) */
function pvReja(k){
  var l = k==='ai' ? (D&&D.aiReja)||[] : (D&&D.reja&&D.reja[k])||[];
  if(!Array.isArray(l)) l=[];
  var o={reja:0,fakt:0};
  l.forEach(function(x){ o.reja+=x.reja; o.fakt+=x.fakt });
  o.qoldi=Math.max(0,o.reja-o.fakt);
  o.foiz=o.reja?o.fakt/o.reja*100:0;
  return o;
}

/** Ҳалқа (доира прогресс) */
function halqa(f,rang,olcham,qalin,ichi){
  var R=52, C=2*Math.PI*R, d=Math.max(0,Math.min(100,f))/100*C;
  qalin=qalin||10;
  return '<div class="halqa-w" style="width:'+olcham+'px;height:'+olcham+'px">'+
    '<svg width="'+olcham+'" height="'+olcham+'" viewBox="0 0 120 120">'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="'+qalin+'"/>'+
      '<circle class="hq" cx="60" cy="60" r="'+R+'" fill="none" stroke="'+rang+'" stroke-width="'+qalin+'" '+
        'stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>'+
    '</svg><div class="halqa-m">'+(ichi||'')+'</div></div>';
}

/** Валюта билан сумма: $1 200 · 1 830 000 сўм */
function vPul(n,v){
  if(v==='USD') return (n<0?'−':'')+'$'+fmt(Math.abs(n));
  return (n<0?'−':'')+fmt(Math.abs(n))+' сўм';
}

function pvKutish(m){
  return '<div class="pv-wait"><div class="spin"></div>'+esc(m||'Юкланмоқда…')+'</div>';
}

/* ── Асосий саҳифа ───────────────────────────────────────── */
function panelSahifa(){
  var h=sarlavha('Бошқарув панели','Кечаги ҳисобот — '+kechaMatn(),'');

  /* ═══ 1. РЕЖА / ФАКТ ═══ */
  var rj=PV_PROD.map(function(p){ return {p:p, r:pvReja(p.k)} });
  var jr={reja:0,fakt:0};
  rj.forEach(function(x){ jr.reja+=x.r.reja; jr.fakt+=x.r.fakt });
  jr.qoldi=Math.max(0,jr.reja-jr.fakt);
  jr.foiz=jr.reja?jr.fakt/jr.reja*100:0;

  function rjKarta(nom,r,rang,katta){
    var ichi='<b class="num" style="font-size:'+(katta?30:22)+'px">'+Math.round(r.foiz)+'%</b>';
    return '<div class="pv-rj'+(katta?' jami':'')+'" style="--pc:'+rang+'">'+
      '<div class="pv-rjn">'+esc(nom)+'</div>'+
      '<div class="pv-rjb">'+halqa(r.foiz,rang,katta?112:84,katta?11:12,ichi)+
        '<div class="pv-rjs">'+
          '<div><span>Факт</span><b class="num">'+fmt(r.fakt)+'</b></div>'+
          '<div><span>Режа</span><b class="num">'+fmt(r.reja)+'</b></div>'+
          '<div><span>Қолди</span><b class="num q">'+fmt(r.qoldi)+'</b></div>'+
        '</div></div></div>';
  }
  h+='<div class="sec" style="margin-top:4px"><h2>Режа ва факт</h2><p>«План» варақларидан — ойлик режа қанчаси бажарилди</p></div>'+
    '<div class="pv-rjg">'+
      rjKarta('Жами',jr,jr.foiz>=100?'var(--ok)':'var(--a)',true)+
      rj.map(function(x){ return rjKarta(x.p.nom,x.r,x.p.rang,false) }).join('')+
    '</div>';

  /* ═══ 2. КЕЧАГИ ЭНГ ЗЎР МЕНЕЖЕР ═══ */
  var kecha=[], yuk=false;
  PV_PROD.forEach(function(p){
    var l=pvBarcha(p.k);
    if(!l){ if(!(p.k==='ai'&&!aiUlangan())) yuk=true; return }
    l.forEach(function(x){ if(kechaMi(x.sana)) kecha.push({x:x,p:p}) });
  });

  var men={},mt=[];
  kecha.forEach(function(r){
    var k=r.x.menejer||'—'; if(k==='—') return;
    if(!men[k]){ men[k]={nom:k,soni:0,pul:0,prod:{}}; mt.push(k) }

    men[k].soni+=n; men[k].pul+=r.x.tolangan||0;

  });
  var reyt=mt.map(function(k){ return men[k] })

  h+='<div class="sec"><h2>Кечаги энг зўр менежер</h2><p>Учала продукт бирга — кечаги сотув сони бўйича</p></div>';
  if(!reyt.length){
    h+='<div class="pv-card">'+(yuk?pvKutish():'<div class="pv-wait">Кеча сотув бўлмаган</div>')+'</div>';
  }else{
    var g=reyt[0];
    var ch=Object.keys(g.prod).map(function(k){
      return '<span class="pv-gch">'+esc(k)+' <b>'+fmt(g.prod[k])+'</b></span>' }).join('');

        '<div class="pv-gmed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
          '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></div>'+
        '<div class="pv-gtx"><div class="pv-kick">Кечанинг ғолиби</div>'+

        '<div class="pv-gval"><div><b class="num">'+fmt(g.soni)+'</b><span>та сотув</span></div>'+
          '<div><b class="num k">'+pul(g.pul)+'</b><span>тушум</span></div></div>'+
      '</div>';
    if(reyt.length>1){
      h+='<div class="pv-runs">'+reyt.slice(1,5).map(function(x,i){
        return '<div class="pv-run"><div class="pv-md '+(i===0?'m2':i===1?'m3':'mx')+'">'+(i+2)+'</div>'+
          '<div class="pv-tn"><b>'+esc(x.nom)+'</b><span>'+pul(x.pul)+'</span></div>'+
          '<div class="pv-rv num">'+fmt(x.soni)+'</div></div>';
      }).join('')+'</div>';
    }
  }

  /* ═══ 3. КЕЧАГИ ҲИСОБОТ ═══ */
  var kj={soni:0,pul:0,kelishuv:0};
  var kt=PV_PROD.map(function(p){
    var l=pvBarcha(p.k);
    if(!l) return {p:p, yoq:true};
    var q=l.filter(function(x){ return kechaMi(x.sana) }), j=jam(q);
    kj.soni+=j.soni; kj.pul+=j.tolangan; kj.kelishuv+=j.kelishuv;
    return {p:p, j:j};
  });
  var ld=(D&&D.marketing)?D.marketing.filter(function(x){ return kechaMi(x.sana) }):null;
  var lj=ld?kJam(ld):null;

  h+='<div class="sec"><h2>Кечаги ҳисобот</h2><p>'+esc(kechaMatn())+' — ҳамма бўлим бўйича</p></div>'+
    '<div class="pv-kgrid">'+
      '<div class="pv-kt jami"><div class="pv-ktn">Жами кеча</div>'+
        '<div class="pv-ktv num">'+fmt(kj.soni)+'<small>сотув</small></div>'+
        '<div class="pv-ktp"><span>Тушум</span><b class="num k">'+pul(kj.pul)+'</b></div>'+
        '<div class="pv-ktp"><span>Келишув</span><b class="num">'+pul(kj.kelishuv)+'</b></div></div>'+
      kt.map(function(x){
        if(x.yoq) return '<div class="pv-kt" style="--pc:'+x.p.rang+'"><div class="pv-ktn">'+esc(x.p.nom)+'</div>'+
          '<div class="pv-ktw">'+(x.p.k==='ai'&&!aiUlangan()?'уланмаган':'юкланмоқда…')+'</div></div>';
        return '<div class="pv-kt" style="--pc:'+x.p.rang+'"><div class="pv-ktn">'+esc(x.p.nom)+'</div>'+
          '<div class="pv-ktv num">'+fmt(x.j.soni)+'<small>сотув</small></div>'+
          '<div class="pv-ktp"><span>Тушум</span><b class="num k">'+pul(x.j.tolangan)+'</b></div>'+
          '<div class="pv-ktp"><span>Қарз</span><b class="num q">'+pul(x.j.qarz)+'</b></div></div>';

      '<div class="pv-kt" style="--pc:var(--info)"><div class="pv-ktn">Маркетинг</div>'+
        (lj ? '<div class="pv-ktv num">'+fmt(lj.jami)+'<small>лид</small></div>'+
              '<div class="pv-ktp"><span>Сотув</span><b class="num k">'+fmt(lj.sotuv)+'</b></div>'+

            : '<div class="pv-ktw">'+(markUlangan()?'юкланмоқда…':'уланмаган')+'</div>')+
      '</div>'+
    '</div>';

  /* ═══ 4. МОЛИЯ — фақат admin ═══ */
  if(!adminMi()) return h;
  h+='<div class="sec"><h2>Молия</h2><p>Кассаларда ҳозир қанча пул бор ва кечаги пул ҳаракати</p></div>';

  if(!moliyaUlangan()) return h+'<div class="pv-card"><div class="pv-wait">Молия уланмаган</div></div>';
  if(!D || !D.moliya)  return h+'<div class="pv-card">'+pvKutish()+'</div>';

  // Кассалар — БУТУН тарих бўйича қолдиқ (кирим − чиқим), валюта алоҳида
  var ks={},kn=[];
  D.moliya.forEach(function(x){
    var k=x.kassa||'Кўрсатилмаган', v=x.valyuta==='USD'?'USD':'UZS';
    if(!ks[k]){ ks[k]={nom:k,UZS:0,USD:0,bor:{}}; kn.push(k) }
    ks[k][v]+= x.tip==='kirim' ? x.summa : -x.summa;
    ks[k].bor[v]=1;
  });
  kn.sort(function(a,b){ return a.localeCompare(b,'ru') });
  var kJ={UZS:0,USD:0,bor:{}};
  kn.forEach(function(k){ ['UZS','USD'].forEach(function(v){
    if(ks[k].bor[v]){ kJ[v]+=ks[k][v]; kJ.bor[v]=1 } }) });

  var KR=['#E0A048','#4ECB92','#6FA8DC','#A08FD0','#D77B96','#C08B5E'];
  function qoldiq(o,v,katta){
    var n=o[v];
    return '<div class="pv-kv'+(n<0?' minus':'')+'"><span>'+(v==='USD'?'Доллар':'Сўм')+'</span>'+
      '<b class="num"'+(katta?' style="font-size:24px"':'')+'>'+vPul(n,v)+'</b></div>';
  }
  h+='<div class="pv-vt" style="margin:0 0 10px 2px">Кассаларда ҳозир</div>'+
    '<div class="pv-kas">'+kn.map(function(k,i){
      var o=ks[k], vv=['UZS','USD'].filter(function(v){ return o.bor[v] });
      return '<div class="pv-ka" style="--pc:'+KR[i%KR.length]+';animation-delay:'+(i*.06)+'s">'+
        '<div class="pv-kah"><i></i>'+esc(k)+'</div>'+vv.map(function(v){ return qoldiq(o,v) }).join('')+'</div>';
    }).join('')+'</div>'+
    '<div class="pv-kasj"><div class="pv-kick">Ҳамма кассада жами</div><div class="pv-kasjv">'+
      ['UZS','USD'].filter(function(v){ return kJ.bor[v] }).map(function(v){ return qoldiq(kJ,v,true) }).join('')+
    '</div></div>';

  // Кечаги кирим / чиқим
  var km=D.moliya.filter(function(x){ return kechaMi(x.sana) });
  var kv={};
  km.forEach(function(x){
    var v=x.valyuta==='USD'?'USD':'UZS';
    if(!kv[v]) kv[v]={kirim:0,chiqim:0};
    kv[v][x.tip==='kirim'?'kirim':'chiqim']+=x.summa;
  });
  var kvk=['UZS','USD'].filter(function(v){ return kv[v] });

  h+='<div class="pv-vt" style="margin:22px 0 10px 2px">Кечаги кирим ва чиқим</div>';
  if(!kvk.length){
    h+='<div class="pv-card"><div class="pv-wait">Кеча молия ёзуви бўлмаган</div></div>';
  }else{
    h+='<div class="pv-kc">'+kvk.map(function(v){
      var o=kv[v], f=o.kirim-o.chiqim;
      return '<div class="pv-kci k"><span>Кирим · '+(v==='USD'?'доллар':'сўм')+'</span><b class="num">'+vPul(o.kirim,v)+'</b></div>'+
             '<div class="pv-kci c"><span>Чиқим · '+(v==='USD'?'доллар':'сўм')+'</span><b class="num">'+vPul(o.chiqim,v)+'</b></div>'+
             '<div class="pv-kci"><span>Фарқ · '+(v==='USD'?'доллар':'сўм')+'</span><b class="num" style="color:'+
               (f<0?'var(--no)':'var(--ink)')+'">'+vPul(f,v)+'</b></div>';
    }).join('')+'</div>';

    // Кечаги ёзувлар — каттасидан бошлаб
    var ks2=km.slice().sort(function(a,b){ return b.summa-a.summa }).slice(0,10);
    h+='<div class="pv-card" style="margin-top:12px"><div class="pv-yz">'+ks2.map(function(x){
      var kir=x.tip==='kirim';
      var nm=[x.asosiy,x.stadiya,x.kichik].filter(function(t){ return t }).join(' · ')||'—';
      return '<div class="pv-yr"><i class="'+(kir?'k':'c')+'">'+(kir?'+':'−')+'</i>'+
        '<div class="pv-yn"><b>'+esc(nm)+'</b><span>'+esc(x.kassa||'—')+(x.izoh?' · '+esc(x.izoh):'')+'</span></div>'+
        '<div class="pv-ys num '+(kir?'k':'c')+'">'+(kir?'+':'−')+vPul(x.summa,x.valyuta==='USD'?'USD':'UZS')+'</div></div>';
    }).join('')+'</div>'+
    (km.length>ks2.length?'<div class="sub" style="margin-top:10px">Кечаги '+fmt(km.length)+' та ёзувдан энг каттаси '+ks2.length+' таси</div>':'')+
    '<button class="pv-lnk" data-prod="moliya" style="margin-top:8px">Молия бўлимини очиш '+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>';
  }

  return h;
}

function nazoratMi(){ return S.prod==='admin' }

async function nazoratYukla(majburiy){
  if(!adminMi() || !kirishUlangan() || S.nBand) return;
  if(D && D.nazorat && !majburiy) return;
  S.nBand=true; belgi(true); chiz();
  try{
    var j=await kirPost({amal:'jurnal',t:AUTH.token});
    if(!j.ok) throw new Error(j.xato||'Хатолик');
    if(D){ D.nazorat=j; D.nazoratXato=null }
  }catch(e){
    if(D) D.nazoratXato=e.message;
  }
  S.nBand=false; belgi(false); chiz();
}

function nzVaqt(v){ var d=new Date(String(v||'').replace(' ','T')); return isNaN(d)?null:d }
function nzOldin(v){
  var d=nzVaqt(v); if(!d) return '—';
  var f=(Date.now()-d)/60000;
  if(f<1) return 'ҳозиргина';
  if(f<60) return Math.floor(f)+' дақиқа олдин';
  if(f<1440) return Math.floor(f/60)+' соат олдин';
  if(f<2880) return 'кеча '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return dfmt(v.slice(0,10))+' '+String(v).slice(11,16);
}
function nzOnlayn(v){ var d=nzVaqt(v); return d && (Date.now()-d)<10*60000 }
function nzRol(r){ return r==='admin'?'<span class="nz-b adm">Admin</span>':r==='xodim'?'<span class="nz-b">Ходим</span>':'' }

function nzHolat(){
  if(!D || (!D.nazorat && !D.nazoratXato))
    return '<div class="load"><div class="spin"></div>Журнал юкланмоқда…</div>';
  if(D.nazoratXato) return '<div class="xato"><b>Журнални олиб бўлмади</b>'+esc(D.nazoratXato)+'</div>';
  return null;
}

  var onl=l.filter(function(q){ return nzOnlayn(q.oxirgi) }).length;

  h+='<div class="sec"><h2>Қурилмалар</h2><p>Охирги фаоллик бўйича · 10 дақиқа ичида фаол бўлса — онлайн</p></div>';
  if(!l.length) return h+'<div class="empty"><b>Ҳали ҳеч ким кирмаган</b></div>';

  h+='<div class="nz-grid">'+l.map(function(q,i){

      '<div class="nz-qh"><i class="nz-dot'+(nzOnlayn(q.oxirgi)?' on':'')+'"></i>'+nom+

      '</div>'+
      '<div class="nz-qq">'+esc(q.qurilma||'—')+'</div>'+
      '<div class="nz-qr"><span>Охирги фаоллик</span><b>'+esc(nzOldin(q.oxirgi))+'</b></div>'+
      '<div class="nz-qr"><span>Биринчи кириш</span><b>'+esc(nzOldin(q.birinchi))+'</b></div>'+
      '<div class="nz-qr"><span>Киришлар сони</span><b class="num">'+fmt(q.soni)+'</b></div>'+

/* ── Журнал ── */
function nzJurnal(){
  var h=sarlavha('Назорат — журнал','Ким, қачон кирди ва қайси бўлимни очди',
    '<input type="text" id="qid" placeholder="Ном, қурилма, бўлим…" value="'+esc(S.qidiruv)+'" style="width:210px">');
  var x=nzHolat(); if(x) return h+x;
  var nomlar={};
  (D.nazorat.qurilmalar||[]).forEach(function(q){ nomlar[q.qid]=q.nom });
  var l=D.nazorat.jurnal||[];
  if(S.jQid) l=l.filter(function(r){ return r.qid===S.jQid });
  if(S.qidiruv){
    var t=S.qidiruv.toLowerCase();
    l=l.filter(function(r){
      return [nomlar[r.qid]||r.nom,r.qurilma,r.hodisa,r.bolim,r.rol].join(' ').toLowerCase().indexOf(t)>=0 });
  }
  if(S.jQid){
    var qn=nomlar[S.jQid]||((D.nazorat.qurilmalar||[]).filter(function(q){return q.qid===S.jQid})[0]||{}).qurilma||'қурилма';
    h+='<button class="nz-flt" data-jtoz="1">Фақат: <b>'+esc(qn)+'</b> ✕</button>';
  }
  if(!l.length) return h+'<div class="empty"><b>Ёзув йўқ</b></div>';

  var gr={},t2=[];
  l.slice(0,400).forEach(function(r){
    var k=String(r.vaqt).slice(0,10);
    if(!gr[k]){ gr[k]=[]; t2.push(k) }
    gr[k].push(r);
  });
  var bug=new Date(), kch=new Date(); kch.setDate(kch.getDate()-1);
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2) }
  function sar(k){ return k===iso(bug)?'Бугун':k===iso(kch)?'Кеча':dfmt(k) }

  h+='<div class="pv-card">'+t2.map(function(k){
    return '<div class="nz-jk">'+sar(k)+' · '+gr[k].length+'</div>'+gr[k].map(function(r){
      var hd=String(r.hodisa||''), cls=/✅/.test(hd)?'ok':/❌|⛔/.test(hd)?'no':/🔑|🚪/.test(hd)?'a':'';
      var ik=/✅/.test(hd)?'✓':/❌/.test(hd)?'✕':/⛔/.test(hd)?'⛔':/🔑/.test(hd)?'🔑':/🚪/.test(hd)?'🚪':'◉';
      var kim=nomlar[r.qid]||r.nom||r.qurilma||'—';
      var matn=hd.replace(/^[✅❌⛔🔑🚪]\s*/,'')+(r.bolim?' — '+r.bolim:'');
      return '<div class="nz-jr"><div class="nz-jt">'+String(r.vaqt).slice(11,16)+'</div>'+
        '<div class="nz-ji '+cls+'">'+ik+'</div>'+
        '<div class="nz-jn"><b>'+esc(kim)+'</b><span>'+esc(matn)+(nomlar[r.qid]&&r.qurilma?' · '+esc(r.qurilma):'')+'</span></div>'+
        nzRol(r.rol)+'</div>';
    }).join('');
  }).join('')+'</div>';
  if(l.length>400) h+='<div class="sub" style="margin-top:10px">Охирги 400 таси кўрсатилди</div>';
  if(D.nazorat.jadval) h+='<a class="pv-lnk" href="'+esc(D.nazorat.jadval)+'" target="_blank" rel="noopener" style="margin-top:10px">Тўлиқ журнал — Google Sheets</a>';
  return h;
}

/** Давлатлар — харитадаги чегара коди ва марказий нуқтаси */
var AI_DAVLAT=[
  {kalit:'узбекистон',  nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},
  {kalit:'узбекстан',   nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},
  {kalit:'тожикистон',  nom:'Тожикистон',  kod:'tj', lat:38.6, lon:71.4},
  {kalit:'таджикистан', nom:'Тожикистон',  kod:'tj', lat:38.6, lon:71.4},
  {kalit:'козогистон',  nom:'Қозоғистон',  kod:'kz', lat:43.6, lon:68.5},
  {kalit:'казахстан',   nom:'Қозоғистон',  kod:'kz', lat:43.6, lon:68.5},
  {kalit:'киргизистон', nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4},
  {kalit:'киргизстан',  nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4},
  {kalit:'кыргызстан',  nom:'Қирғизистон', kod:'kg', lat:41.5, lon:74.4}
];

/* «Киргизистан» ва «Қирғизистон», «Козогистон» ва «Казахстан» —
   ёзилиши ҳар хил, шунинг учун охирги «стан/стон» бир кўринишга келтирилади. */
function davlatNorm(nom){
  return shaharNorm(nom).replace(/стан$/,'стон');
}

function davlatTop(nom){
  var t=davlatNorm(nom);
  if(!t) return null;
  for(var i=0;i<AI_DAVLAT.length;i++)
    if(t===davlatNorm(AI_DAVLAT[i].kalit)) return AI_DAVLAT[i];
  return null;
}

/**
 * ДАВЛАТЛАР ХАРИТАСИ — чегаралар бўялади, марказига доира ва рақам қўйилади.
 * Харитада йўқ давлатлар пастда чип бўлиб чиқади.
 */
function xaritaDavlat(guruh){
  var nuq=[], tashqari=[];
  guruh.forEach(function(g){
    var d=davlatTop(g.nom);
    if(d) nuq.push({d:d, g:g}); else tashqari.push(g);
  });
  if(!nuq.length) return '';

  var W=XARITA_W, H=XARITA_H, max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni });

  // ── чегаралар ──
  var bor={};
  nuq.forEach(function(x){ bor[x.d.kod]=x });
  var yer='';
  ['kz','uz','kg','tj'].forEach(function(k,i){
    var x=bor[k];
    var c=x?DAVLAT_RANG[x.d.nom]:null;
    yer+='<path class="xyer'+(x?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(c||'var(--line)')+'" stroke="'+(c||'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+
      (x?esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув':'')+'</title></path>';
  });

  // ── доиралар ──
  var shar='';
  nuq.forEach(function(x,i){
    var c=xproy(x.d.lon,x.d.lat);
    var px=c[0], py=c[1];
    var r=14+20*Math.sqrt(x.g.soni/max);
    var rng=DAVLAT_RANG[x.d.nom]||'var(--a)';
    var ulush=jami?Math.round(x.g.soni/jami*100)+'%':'';
    shar+='<g class="xsh" style="animation-delay:'+(0.4+i*0.1).toFixed(2)+'s">'+
      '<circle class="xdoira" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+r.toFixed(1)+
        '" fill="'+rng+'" fill-opacity=".38" stroke="'+rng+'" stroke-width="2"/>'+
      '<text class="xson" x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+px.toFixed(1)+'" y="'+(py+r+16).toFixed(1)+'" text-anchor="middle">'+
        esc(x.d.nom)+'</text>'+
      '<text class="xizoh" x="'+px.toFixed(1)+'" y="'+(py+r+30).toFixed(1)+'" text-anchor="middle" '+
        'fill="'+rng+'">'+ulush+'</text>'+
      '<title>'+esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув</title></g>';
  });

  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){
        return '<span class="xchip"><b>'+fmt(g.soni)+'</b>'+esc(g.nom)+'</span>';
      }).join('')+'</div>'
    : '';

  var afsona='<div class="xafs">'+nuq.map(function(x){
    return '<span><i style="background:'+DAVLAT_RANG[x.d.nom]+'"></i>'+esc(x.d.nom)+
           ' <b>'+fmt(x.g.soni)+'</b></span>';
  }).join('')+'</div>';

  return '<div class="xkarta"><div class="xscroll">'+
    '<svg class="xsvg" viewBox="0 0 '+W+' '+H+'">'+yer+shar+'</svg></div>'+
    '<div class="xsurish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Харитани чапга-ўнгга суринг</div>'+
    afsona+chip+'</div>';
}

  bolim('Режа бажарилиши','Ҳар бир менежер бўйича. Қора чизиқ — режа даражаси.',
    rejaUstun(reja))+

  bolim('Менежерлар','Ким қанча сотган',
    ustunlar(men.map(function(x){
      return { nom:x.nom, qiy:x.soni, ong:pul(x.tolangan) };
    })))+

  bolim('Сотув динамикаси','Ҳар бир санада нечта сотув бўлган',

  // ── География ──
  if(dav.length && dav.some(function(x){ return x.nom!=='—' })){
    var jd=0; dav.forEach(function(x){ jd+=x.soni });
    o+='<div class="sec"><h2>География</h2><p>Мижозлар қайси давлатдан</p></div>';
    var xr=xaritaDavlat(dav);

    o+='<div class="dbody"><div class="eb">Давлатлар бўйича</div>'+

                 ong:(jd?Math.round(x.soni/jd*100)+'% · ':'')+pul(x.tolangan) };

      {p:'kesim',  nom:'Кодлар',     ik:'kalit'}];
  }
  if(markMi()){

    var kb=(D&&D.marketing)?sanaFiltrla(D.marketing):[];
    return [
      {p:'umumiy', nom:'Умумий',       ik:'chart'},

      {p:'jurnal', nom:'Лидлар',       ik:'jadval',son:kl.length}];

  if(moliyaMi()){

function chiz(){
  if(S.xato && !D){
    main.innerHTML='<div class="xato"><b>Серверга уланиб бўлмади</b>'+esc(S.xato)+
      '<div style="margin-top:10px;font-size:12.5px">Текширинг: Apps Script <b>Deploy → Anyone</b> қилинганми.</div></div>'+
      '<button class="btn" id="qaytaBtn">Қайта уриниш</button>';
    return;
  }
  if(!D) return;

  main.innerHTML = panelMi()
    ? panelSahifa()
    : nazoratMi()
    ? nazoratSahifa()
    : markMi()
    ? ( S.sahifa==='umumiy'  ? markUmumiy()  :
        S.sahifa==='menejer' ? markTarget()  :
        S.sahifa==='kesim'   ? markStadiya() : markJurnal() )
    : aiMi()
    ? ( S.sahifa==='umumiy' ? aiUmumiy() : aiJurnal() )
    : moliyaMi()
    ? ( S.sahifa==='umumiy'  ? moliyaUmumiy()          :
        S.sahifa==='menejer' ? moliyaYonalish('kirim') :
        S.sahifa==='kesim'   ? moliyaYonalish('chiqim'): moliyaJurnal() )
    : ( S.sahifa==='umumiy'  ? umumiySahifa()  :
        S.sahifa==='menejer' ? menejerSahifa() :
        S.sahifa==='kesim'   ? kesimSahifa()   : jurnalSahifa() );

  // Телефонда харита кенг — уни шаҳарлар турган жойга суриб қўямиз
  var xs=main.querySelector('.xscroll');
  if(xs) xs.scrollLeft=Math.max(0,(xs.scrollWidth-xs.clientWidth)*0.62);

  /* Бўлим тугмалари икки жойда: чап менюда ва пастки панелда */
  var m=menyu();
  document.body.classList.toggle('dokyoq', m.length<2);
  ['#side','#bnav'].forEach(function(joy){
    var n=document.querySelectorAll(joy+' .ni[data-p]');
    for(var i=0;i<n.length;i++){
      var b=m[i];
      // Баъзи бўлимларда панел камроқ (масалан, сунъий интеллектда 2 та)
      if(!b){ n[i].style.display='none'; continue }
      n[i].style.display='';
      n[i].dataset.p=b.p;
      n[i].querySelector('.ik').innerHTML=
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+IKONKA[b.ik]+'</svg>';
      n[i].querySelector('.nt').textContent=b.nom;
      var sn=n[i].querySelector('.nson');
      if(sn){
        var bor=(b.son||b.son===0);
        sn.textContent=bor?fmt(b.son):'';
        sn.style.display=bor?'':'none';
      }
      n[i].classList.toggle('on',b.p===S.sahifa);
    }
  });
  var p=document.querySelectorAll('#pswitch button');
  for(var j=0;j<p.length;j++) p[j].classList.toggle('on',p[j].dataset.prod===S.prod);

  var tp=document.getElementById('tbProd');
  if(tp) tp.textContent=PROD_NOM[S.prod]||'';
}

function tepaga(){ main.scrollTop=0; window.scrollTo(0,0) }

function sahifaOch(nom){ S.sahifa=nom; S.ochiq=null; S.qidiruv=''; chiz(); tepaga() }
function produktOch(p){
  if(S.prod===p) return;
  if((p==='moliya'||p==='admin') && !adminMi()) return;
  S.prod=p;
  faolYubor(PROD_NOM[p]||p);
  if(p==='admin') nazoratYukla();
  if(p==='moliya') moliyaYukla();
  if(p==='marketing') markYukla();
  if(p==='ai') aiYukla();
  if(p==='panel' && D){ aiYukla(); moliyaYukla(); markYukla(); }
  // Фильтрни тозалаймиз: акс ҳолда «Бугун» қолиб кетиб,
  // янги бўлим сабабсиз бўм-бўш кўринади.
  S.sahifa='umumiy'; S.ochiq=null; S.qidiruv=''; S.oraliq='hammasi'; S.target='hammasi';
  S.dan=null; S.gacha=null;
  chiz(); tepaga();
}

  }
  if(e.target.closest('[data-qbekor]')){ S.nomTahrir=null; chiz(); return }
  if((t=e.target.closest('[data-qsaqla]'))){
    var inp=document.getElementById('nzNomIn');
    if(await nzAmal({amal:'nom',qid:t.dataset.qsaqla,nom:inp?inp.value.trim():''},'Ном сақланди')){
      S.nomTahrir=null; nazoratYukla(true);
    }
    return;
  }
  if((t=e.target.closest('[data-qblok]'))){
    var bl=t.dataset.b==='1';
    if(!confirm(bl?'Бу қурилмани блоклайсизми? У қайта кира олмайди.':'Блокдан чиқарасизми?')) return;
    if(await nzAmal({amal:'blok',qid:t.dataset.qblok,blok:bl},bl?'Қурилма блокланди':'Блокдан чиқарилди')) nazoratYukla(true);
    return;
  }
  if((t=e.target.closest('[data-qjur]'))){ S.jQid=t.dataset.qjur; sahifaOch('jurnal'); return }
  if(e.target.closest('[data-jtoz]')){ S.jQid=null; chiz(); return }
  if((t=e.target.closest('[data-kodsaqla]'))){
    var rol=t.dataset.kodsaqla, el=document.getElementById('kod_'+rol), v=el?el.value.replace(/\D/g,''):'';
    if(v.length!==6){ xabar('Код 6 та рақам бўлиши керак',true); return }
    if(!confirm((rol==='admin'?'Admin':'Ходим')+' кодини '+v+' га алмаштирасизми?')) return;
    if(await nzAmal({amal:'kod',rol:rol,yangi:v},'Код алмаштирилди')){ if(el) el.value=''; nazoratYukla(true) }
    return;
  }
  if(e.target.closest('#chiqarBtn')){
    if(!confirm('Ҳамма қурилмадаги сеанс тугайди, сиз ҳам қайта кирасиз. Давом этамизми?')) return;
    if(await nzAmal({amal:'chiqar'},'Ҳамма чиқарилди')) qulfla('Ҳамма сеанслар тугатилди — қайта киринг');
    return;
  }
  if((t=e.target.closest('[data-prod]'))){ produktOch(t.dataset.prod); return }
  if((t=e.target.closest('[data-o]'))){
    S.oraliq=t.dataset.o;
    if(S.oraliq!=='oraliq'){ S.dan=null; S.gacha=null }
    chiz(); return;
  }
  if(e.target.closest('#qollaBtn')){
    var a=document.getElementById('dan').value, b=document.getElementById('gacha').value;
    if(!a&&!b){ xabar('Санани танланг',true); return }
    S.tmpDan=a; S.tmpGacha=b; S.dan=a||null; S.gacha=b||null;
    chiz(); xabar('Сана қўлланди'); return;
  }
  if((t=e.target.closest('[data-davr]'))){ S.davr=t.dataset.davr; chiz(); return }
  if((t=e.target.closest('[data-tg]'))){ S.target=t.dataset.tg; S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-tgk]'))){
    S.ochiq = S.ochiq===t.dataset.tgk ? null : t.dataset.tgk;
    chiz();
    setTimeout(function(){
      var d=document.querySelector('.detail');
      if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'});
    },40);
    return;
  }
  if((t=e.target.closest('[data-val]'))){ S.valyuta=t.dataset.val; S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-mkes]'))){
    S.ochiq = S.ochiq===t.dataset.mkes ? null : t.dataset.mkes;
    chiz();
    setTimeout(function(){ var d=document.querySelector('.detail'); if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'}) },40);
    return;
  }
  if(e.target.closest('#mTema')){ temaQoy(!qoraMi(),true); chiz(); return }
  if(e.target.closest('#mYangila')||e.target.closest('#eskiYangila')){ hammasiYangila(); return }
  if(e.target.closest('#qaytaBtn')){ yukla(); return }
  if(e.target.closest('[data-yop]')){ S.ochiq=null; chiz(); return }
  if((t=e.target.closest('[data-men]'))||(t=e.target.closest('[data-kes]'))){
    var nomi=t.dataset.men||t.dataset.kes;
    S.ochiq = S.ochiq===nomi ? null : nomi;
    chiz();
    setTimeout(function(){
      var d=document.querySelector('.detail');
      if(d) d.scrollIntoView({behavior:'smooth',block:'nearest'});
    },40);
  }
});

main.addEventListener('input',function(e){
  if(e.target.id==='qid'){
    S.qidiruv=e.target.value;
    var joy=e.target.selectionStart;
    chiz();
    var n=document.getElementById('qid');
    if(n){ n.focus(); n.setSelectionRange(joy,joy) }
  }
  if(e.target.id==='dan')   S.tmpDan=e.target.value;
  if(e.target.id==='gacha') S.tmpGacha=e.target.value;
});

function hammasiYangila(){
  xabar('Янгиланмоқда…');
  S.yangi=true;                       // сервердаги кэшни четлаб ўтамиз
  yukla(true);
  if(moliyaMi()) moliyaYukla(true);
  if(markMi())   markYukla(true);
  if(aiMi())     aiYukla(true);
  if(panelMi()){ aiYukla(true); moliyaYukla(true); markYukla(true); }
  if(nazoratMi()) nazoratYukla(true);
  setTimeout(function(){ S.yangi=false },4000);
}
document.getElementById('yangilaBtn').onclick=hammasiYangila;
document.getElementById('yangilaBtn2').onclick=hammasiYangila;
document.getElementById('chiqishBtn').onclick=function(){
  if(confirm('Тизимдан чиқасизми?')) chiqish();
};

/* ── чап меню: очиш / ёпиш ── */
function telefonmi(){ return window.matchMedia('(max-width:820px)').matches }

function menyuHolat(ochiq){
  document.body.classList.toggle('yopiq',!ochiq);
  try{ if(!telefonmi()) localStorage.setItem(MENYU,ochiq?'1':'0') }catch(e){}
}
function menyuAlmash(){ menyuHolat(document.body.classList.contains('yopiq')) }

document.getElementById('burger').onclick=menyuAlmash;
document.getElementById('ovl').onclick=function(){ menyuHolat(false) };

/* Телефонда бўлим танлангач меню ўзи ёпилади */
document.getElementById('side').addEventListener('click',function(e){
  if(telefonmi() && e.target.closest('.ni[data-p], #pswitch button')) menyuHolat(false);
});

/* Дастлабки ҳолат: компьютерда очиқ, телефонда ёпиқ */
(function(){
  var v=null;
  try{ v=localStorage.getItem(MENYU) }catch(e){}
  menyuHolat(telefonmi() ? false : v!=='0');
})();

/* ── ранг режими ── */
function temaQoy(qora,eslab){
  document.body.classList.toggle('oq',!qora);
  var s=document.querySelector('#temaBtn span');
  if(s) s.textContent=qora?'Оқ режим':'Қора режим';
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',qora?'#0B0D10':'#F4F2ED');
  if(eslab){ try{ localStorage.setItem(TEMA,qora?'qora':'oq') }catch(e){} }
}
function temaAlmash(){ temaQoy(!qoraMi(),true); chiz() }
document.getElementById('temaBtn').onclick=temaAlmash;
document.getElementById('temaBtn2').onclick=temaAlmash;

var tid;
function xabar(m,xato){
  var t=document.getElementById('toast');
  t.textContent=m; t.className='toast on'+(xato?' err':'');
  clearTimeout(tid); tid=setTimeout(function(){ t.className='toast' },3000);
}

/* ── ишга тушириш ── */
(function(){
  var v=null;
  try{ v=localStorage.getItem(TEMA) }catch(e){}
  // Асосийси — қора режим. Фойдаланувчи оқни танласагина оқ бўлади.
  temaQoy(v!=='oq',false);
})();
kirishBoshla();
</script>
