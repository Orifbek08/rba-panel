<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Real Business Academy — Бошқарув панели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   РБА — БОШҚАРУВ ПАНЕЛИ · дизайн тизими
   Қора режим асосий. Оқ режим — тугма орқали.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* фон қатламлари */
  --bg:#0B0D10; --bg2:#11141A; --card:#151A21; --card2:#1B212A;
  --line:#232A34; --line2:#333C48;
  /* матн */
  --ink:#F0EEE9; --ink2:#B9BEC7; --muted:#7D858F;
  /* акцент */
  --a:#E0A048; --a2:#F2C078; --a-dim:rgba(224,160,72,.13); --a-line:rgba(224,160,72,.30);
  /* ҳолат ранглари */
  --ok:#4ECB92; --ok-dim:rgba(78,203,146,.12); --ok-line:rgba(78,203,146,.26);
  --no:#F0796E; --no-dim:rgba(240,121,110,.12); --no-line:rgba(240,121,110,.26);
  --info:#6FA8DC; --info-dim:rgba(111,168,220,.12);
  /* матрица шкаласи */
  --z0:#161B22; --z0f:#3E4650; --z1:#1D2530; --z1f:#8A929C;
  --z2:#3A2D14; --z2f:#E0A048; --z3:#123024; --z3f:#4ECB92;
  /* ўлчов */
  --r:14px; --r2:10px; --nav:66px; --tb:56px; --sw:252px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --side:#0E1116; --side2:#1A1F27; --side3:#232A34;
  --track:#1D232C; --thead:#141920; --hover:#1A2028;
  --sel-bg:var(--a); --sel-fg:#1A1206; --toast:#232A34;
  --prog:rgba(255,255,255,.08);
  /* JS ичида ишлатиладиган эски номлар — янгиларига боғланган */
  --green:var(--ok); --red:var(--no); --ochre:var(--a);
}
body.oq{
  --bg:#F4F2ED; --bg2:#EDEAE3; --card:#FFFFFF; --card2:#F7F5F1;
  --line:#E2DFD7; --line2:#CBC6BB;
  --ink:#16181C; --ink2:#4A4F57; --muted:#767C85;
  --a:#B87218; --a2:#8A5310; --a-dim:#FBF1DF; --a-line:#EBD6AF;
  --ok:#2C7A57; --ok-dim:#E6F3EC; --ok-line:#C7E2D4;
  --no:#B23A31; --no-dim:#FBEAE8; --no-line:#F0D0CC;
  --info:#2F5C8F; --info-dim:#E9EFF7;
  --z0:#F1EFEA; --z0f:#A9A49B; --z1:#F5F3EE; --z1f:#767C85;
  --z2:#FBF0DE; --z2f:#8A5310; --z3:#E6F3EC; --z3f:#2C7A57;
  --sh:0 1px 2px rgba(20,22,26,.05), 0 8px 24px -14px rgba(20,22,26,.18);
  --side:#12151A; --side2:#1E232B; --side3:#2A313B;
  --track:#EDEAE4; --thead:#FAF8F5; --hover:#FAF8F5;
  --sel-bg:#16181C; --sel-fg:#FFFFFF; --toast:#16181C;
  --prog:rgba(0,0,0,.08);
  --green:var(--ok); --red:var(--no); --ochre:var(--a);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.02em;font-weight:600}
button{font-family:inherit;font-size:13px;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
/* ═══ ЮҚОРИ ПАНЕЛ ═══ */
.tbar{position:fixed;top:0;left:0;right:0;height:var(--tb);z-index:95;display:flex;
  align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(180deg,var(--side2),var(--side));
  border-bottom:1px solid rgba(255,255,255,.07);
  box-shadow:0 2px 18px -8px rgba(0,0,0,.7)}
.tbic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#C2C9D2;
  transition:.15s}
.tbic:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.16)}
.tbic svg{width:19px;height:19px}
.tbic i{display:block;width:17px;height:1.9px;border-radius:2px;background:currentColor;
  transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .18s}
.burger{flex-direction:column;gap:4px;display:flex;align-items:center;justify-content:center}
body:not(.yopiq) .burger i:nth-child(1){transform:translateY(5.9px) rotate(45deg)}
body:not(.yopiq) .burger i:nth-child(2){opacity:0}
body:not(.yopiq) .burger i:nth-child(3){transform:translateY(-5.9px) rotate(-45deg)}
.tbmid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  gap:9px;pointer-events:none}
.tbmid b{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:17px;color:#fff;
  letter-spacing:.14em}
.tbmid .tbn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6E757E;
  border-left:1px solid rgba(255,255,255,.12);padding-left:9px;white-space:nowrap}
.tbong{margin-left:auto;display:flex;gap:7px;align-items:center}
.tblive{display:flex;align-items:center;gap:7px;font-size:11px;color:#6E757E;
  padding-right:6px;white-space:nowrap}

.app{display:block;height:calc(100vh - var(--tb));margin-top:var(--tb);
  overflow:hidden;position:relative}
.ovl{position:fixed;inset:var(--tb) 0 0 0;z-index:80;background:rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transition:.24s;backdrop-filter:blur(2px)}

/* ═══ ПАСТКИ БЎЛИМЛАР ДОКИ ═══
   Компьютерда — ўртада сузиб турувчи панел, телефонда — тўлиқ кенглик. */
.bnav{position:fixed;left:calc(50% + var(--sw)/2);transform:translateX(-50%);bottom:18px;z-index:78;
  transition:left .3s cubic-bezier(.22,1,.36,1);
  display:flex;align-items:stretch;gap:4px;padding:6px;
  background:linear-gradient(180deg,rgba(30,35,43,.96),rgba(18,21,26,.96));
  border:1px solid rgba(255,255,255,.09);border-radius:17px;
  box-shadow:0 18px 44px -16px rgba(0,0,0,.75),0 2px 8px -3px rgba(0,0,0,.5);
  backdrop-filter:blur(14px);max-width:calc(100% - 40px)}
.bnav .ni{position:relative;flex-direction:row;gap:9px;padding:9px 16px;border-radius:12px;
  font-size:12.5px;color:#9AA1AB;width:auto;white-space:nowrap}
.bnav .ni:hover{background:rgba(255,255,255,.06);color:#fff}
.bnav .ni svg{width:17px;height:17px}
.bnav .ni.on{background:linear-gradient(145deg,var(--a2),var(--a));color:#1A1206;font-weight:600;
  box-shadow:0 4px 14px -4px rgba(224,160,72,.6)}
.bnav .ni.on::before{display:none}
.bnav .ni.on .ik{color:#1A1206}
.bnav .nson{position:static;margin:0;font-size:10.5px;padding:1px 7px;
  background:rgba(255,255,255,.07);color:#8A919B}
.bnav .ni.on .nson{background:rgba(26,18,6,.22);color:#1A1206}

/* ═══ ЧАП ПАНЕЛ ═══ */
.side{position:fixed;top:var(--tb);left:0;bottom:0;width:var(--sw);z-index:85;
  background:var(--side);color:#D7D3CC;display:flex;flex-direction:column;
  padding:16px 14px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.05);
  transform:translateX(0);transition:transform .3s cubic-bezier(.22,1,.36,1)}
body.yopiq .side{transform:translateX(-101%)}
body.yopiq .bnav{left:50%}
.side .ni[data-p],#nlBolim{display:none}
.side .nl{padding:4px 10px 8px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 20px}
.bm{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--a2),var(--a));color:#1A1206;
  font-family:Archivo;font-weight:700;font-size:11.5px;letter-spacing:.02em;
  box-shadow:0 3px 10px -2px rgba(224,160,72,.45)}
.bt{font-family:Archivo;font-weight:600;font-size:14.5px;line-height:1.2;color:#fff}
.bs{font-size:10px;color:#6E757E;letter-spacing:.11em;text-transform:uppercase;margin-top:2px}

.pswitch{display:flex;flex-direction:column;gap:2px;background:var(--side2);
  border-radius:12px;padding:4px;margin-bottom:6px}
.pswitch button{border:none;background:none;color:#8A919B;padding:10px;border-radius:9px;
  font-size:12.5px;font-weight:500;transition:.14s;text-align:center}
.pswitch button:hover{color:#fff;background:rgba(255,255,255,.04)}
.pswitch button.on{background:linear-gradient(145deg,var(--a2),var(--a));color:#1A1206;font-weight:600;
  box-shadow:0 3px 10px -3px rgba(224,160,72,.5)}

.nl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#5C636C;padding:18px 10px 8px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;
  color:#9AA1AB;font-size:13.5px;border:none;background:none;width:100%;text-align:left;
  transition:.14s;position:relative}
.ni:hover{background:var(--side2);color:#fff}
.ni.on{background:var(--side2);color:#fff;font-weight:500}
.ni.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--a)}
.ni .ik{display:grid;place-items:center;flex-shrink:0}
.ni .nt{flex:1;min-width:0}
.nson{margin-left:auto;font-style:normal;font-family:"JetBrains Mono",monospace;
  font-size:11px;font-weight:600;color:#6E757E;background:rgba(255,255,255,.05);
  border-radius:7px;padding:2px 7px;min-width:24px;text-align:center;transition:.14s}
.ni.on .nson{color:var(--a);background:rgba(224,160,72,.14)}
.ni svg{width:18px;height:18px}
.ni.on .ik{color:var(--a)}
.sf{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.live{display:flex;align-items:center;gap:8px;font-size:11px;color:#5C636C;padding:9px 11px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(78,203,146,.15);animation:p 2.6s infinite}
.dot.bad{background:var(--no);box-shadow:0 0 0 3px rgba(240,121,110,.15);animation:none}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══ АСОСИЙ МАЙДОН ═══ */
.main{height:100%;overflow-y:auto;padding:26px 30px 104px;min-width:0;
  background:radial-gradient(1100px 540px at 78% -12%,rgba(224,160,72,.07),transparent 62%),
             radial-gradient(760px 420px at 6% 104%,rgba(78,203,146,.05),transparent 60%),
             var(--bg);margin-left:var(--sw);transition:margin-left .3s cubic-bezier(.22,1,.36,1)}
body.yopiq .main{margin-left:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;margin-bottom:22px;min-width:0}
h1{font-size:27px;overflow-wrap:anywhere;line-height:1.15}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seg{display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 13px;color:var(--muted);
  border-radius:8px;white-space:nowrap;transition:.13s;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
input{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:var(--ink);max-width:100%;transition:.13s}
input:focus{border-color:var(--a-line);outline:none}
input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:11px;
  display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap;transition:.13s}
.btn:hover{border-color:var(--line2);background:var(--card2)}
.btn svg{width:15px;height:15px}
.btn-o{background:linear-gradient(145deg,var(--a2),var(--a));border-color:transparent;
  color:#1A1206;font-weight:600}
.btn-o:hover{filter:brightness(1.07)}
.sanaqut{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:5px 7px}

/* ═══ МЕТРИКА КАРТАЛАРИ ═══ */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.met{background:linear-gradient(162deg,var(--card2),var(--card) 58%);
  border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--sh);
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,border-color .18s}
.met:hover{transform:translateY(-2px);border-color:var(--line2);
  box-shadow:0 16px 34px -18px rgba(0,0,0,.6),var(--sh)}
.met::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.met::before{content:"";position:absolute;right:-46px;top:-46px;width:130px;height:130px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%);
  pointer-events:none}
.met-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.met-v{font-size:29px;font-weight:600;margin-top:9px;letter-spacing:-.035em;line-height:1.05;
  font-family:Archivo,Inter,sans-serif}
.met-d{font-size:11.5px;color:var(--muted);margin-top:5px}
.met.k::after{background:var(--ok)} .met.k .met-v{color:var(--ok)}
.met.c::after{background:var(--no)} .met.c .met-v{color:var(--no)}
.met.o::after{background:var(--a)}  .met.o .met-v{color:var(--a)}
.mprog{height:5px;border-radius:5px;background:var(--prog);margin-top:12px;overflow:hidden}
.mprog i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ═══ БЎЛИМ САРЛАВҲАСИ ═══ */
.sec{margin:34px 0 14px;padding-left:13px;position:relative}
.sec::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--a),transparent)}
.sec h2{font-size:16.5px;letter-spacing:-.015em}
.sec p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.panel{background:linear-gradient(168deg,var(--card2),var(--card) 62%);
  border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;min-width:0;box-shadow:var(--sh)}
.eb{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;font-weight:600}

/* ═══ УСТУНЛИ РЎЙХАТ ═══ */
.bl{display:flex;flex-direction:column;gap:13px}
.bi{display:grid;grid-template-columns:172px 1fr 92px;gap:14px;align-items:center;min-width:0}
.bn{font-size:13px;line-height:1.3;overflow:hidden;min-width:0;overflow-wrap:anywhere;font-weight:500}
.bn small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;margin-top:2px}
.btr{height:9px;border-radius:6px;background:var(--track);overflow:hidden;min-width:0}
.bfl{height:100%;border-radius:6px;min-width:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bv{text-align:right;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bv small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:0}
.rjtr{height:22px;border-radius:8px;background:var(--track);position:relative;overflow:hidden}
.rjfl{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rjmark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55;border-radius:2px}

/* ═══ ЧИЗМА ═══ */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--muted)}
.chart .vt{fill:var(--ink);font-weight:700;font-size:10.5px}
.chart .pt{fill:var(--a)} .chart .ln{stroke:var(--a)}
.chart .dt{fill:var(--ink);font-family:Archivo;font-size:19px;font-weight:600}
.chart .dl{fill:var(--muted);font-family:Inter;font-size:9px}
.gl{stroke:var(--line);stroke-width:1}
.dwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;max-width:100%;min-width:0}
.dwrap::-webkit-scrollbar{height:7px}
.dwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.dch{display:block;height:auto}
.dch text{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--muted)}
.dch .vt{fill:var(--muted);font-weight:600;font-size:10.5px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;
  opacity:0;animation:kirKichik .45s ease both .55s}
.dch .vt.eng{fill:var(--a);font-weight:700;font-size:12px}
.dch .bar{fill:var(--a);opacity:.9} .dch .bar.top{fill:var(--ok);opacity:1}
.dch .mkir{fill:var(--ok)} .dch .mchi{fill:var(--no)}
.mlg{display:flex;gap:18px;font-size:11.5px;color:var(--muted);margin-top:10px;align-items:center}
.mlg i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.mkirb{background:var(--ok)} .mchib{background:var(--no)}
.surish{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:7px}
.surish svg{width:13px;height:13px;flex-shrink:0}
.davrq{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:16px;flex-wrap:wrap}
.davrq .oz{font-size:12px;color:var(--muted)}

/* ═══ КАРТОЧКАЛАР ═══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;cursor:pointer;transition:.16s;text-align:left;position:relative;
  display:flex;flex-direction:column;box-shadow:var(--sh)}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card.sel{border-color:var(--a-line);background:var(--card2);
  box-shadow:0 0 0 1px var(--a-line), 0 10px 28px -14px rgba(224,160,72,.4)}
.cn{font-size:13.5px;font-weight:600;line-height:1.3;padding-right:26px}
.cm{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.cq{margin-top:auto;padding-top:13px;display:flex;align-items:baseline;gap:6px}
.cq b{font-size:23px;font-weight:600;font-family:Archivo;letter-spacing:-.03em}
.cq span{font-size:11px;color:var(--muted)}
.cbar{height:4px;border-radius:4px;background:var(--track);margin-top:11px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rank{position:absolute;top:14px;right:15px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:var(--muted)}

/* ═══ ДЕТАЛ ═══ */
.detail{background:var(--card);border:1px solid var(--a-line);border-radius:var(--r);
  margin-top:18px;overflow:hidden;min-width:0;box-shadow:var(--sh)}
.dh{display:flex;gap:18px;padding:20px 21px;border-bottom:1px solid var(--line);
  align-items:flex-start;flex-wrap:wrap;background:var(--card2)}
.dm{flex:1;min-width:0}
.dh h3{font-size:18px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{font-size:11px;padding:5px 11px;border-radius:9px;background:var(--bg2);
  border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.chip.k{background:var(--ok-dim);border-color:var(--ok-line);color:var(--ok)}.chip.k b{color:var(--ok)}
.chip.c{background:var(--no-dim);border-color:var(--no-line);color:var(--no)}.chip.c b{color:var(--no)}
.dbody{padding:19px 21px;min-width:0}
.dbody+.dbody{border-top:1px solid var(--line)}

/* ═══ МАТРИЦА ═══ */
.mw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;min-width:0}
.mw::-webkit-scrollbar{height:7px}
.mw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.mx{border-collapse:separate;border-spacing:4px;font-size:12px}
.mx th{font-weight:500;color:var(--muted);font-size:10.5px;padding:4px 7px;
  text-align:center;white-space:nowrap}
.mx th.hd{text-align:left;min-width:164px;position:sticky;left:0;background:var(--card);z-index:1}
.cell{min-width:54px;height:36px;border-radius:9px;display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600}
.rn{display:flex;align-items:center;gap:9px;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lg{display:flex;gap:16px;padding-top:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.lg i{width:22px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:6px}

/* ═══ ЖАДВАЛ ═══ */
.tw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;min-width:800px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:12px 15px;border-bottom:1px solid var(--line);
  background:var(--thead);white-space:nowrap}
.tbl td{padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--hover)}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.pill.kel{background:var(--no-dim);border-color:var(--no-line);color:var(--no)}

/* ═══ ХАБАРЛАР ═══ */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:40px 22px;
  text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:5px;
  font-family:Archivo}
.eski{background:var(--a-dim);border:1px solid var(--a-line);color:var(--a);
  border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;
  display:flex;align-items:center;gap:9px}
.eski svg{width:15px;height:15px;flex-shrink:0}
.eski button{margin-left:auto;border:1px solid var(--a-line);background:transparent;color:var(--a);
  border-radius:8px;padding:5px 12px;font-weight:600;white-space:nowrap}
.eski button:hover{background:var(--a-dim)}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--toast);
  color:#fff;padding:13px 20px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
  transition:.26s;z-index:90;max-width:86vw;text-align:center;box-shadow:0 12px 32px -10px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--no);color:#fff}
.load{padding:80px 20px;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--a);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.xato{background:var(--no-dim);border:1px solid var(--no-line);color:var(--no);
  border-radius:var(--r);padding:19px 21px;margin-bottom:18px}
.xato b{display:block;margin-bottom:5px;font-size:15px;font-family:Archivo}
.mobil{display:none}
.yukbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:99;
  background:linear-gradient(90deg,transparent,var(--a),transparent);
  background-size:40% 100%;background-repeat:no-repeat;animation:yuk 1.1s infinite}
@keyframes yuk{0%{background-position:-40% 0}100%{background-position:140% 0}}

/* ═══ ТАШХИС ═══ */
.tsh{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 26px;max-width:660px;box-shadow:var(--sh)}
.tsh h3{font-size:18px;margin-bottom:5px}
.tsh p{margin:7px 0 0;color:var(--muted);font-size:13px}
.tshj{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tshj td{padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.tshj td:first-child{width:52%}
.tshj td:nth-child(2){color:var(--ink);font-family:"JetBrains Mono",monospace}
.tshj tr:last-child td{border-bottom:none}
.tshq{background:var(--a-dim);border:1px solid var(--a-line);color:var(--a);
  border-radius:11px;padding:13px 15px;font-size:12.5px;line-height:1.65;margin-top:16px}
.tshs{display:flex;flex-wrap:wrap;gap:6px}
.tshs span{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--bg2);
  border:1px solid var(--line);color:var(--muted)}

/* ═══ КУНЛИК РЎЙХАТ ═══ */
.jlist{display:flex;flex-direction:column;gap:20px}
.jkun{display:flex;flex-direction:column;gap:8px}
.jsar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 3px 3px}
.jsar b{font-size:12.5px;font-weight:600;font-family:Archivo;color:var(--ink)}
.jsar span{font-size:12px;font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--ok)}
.jkart{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;transition:.13s}
.jkart:hover{border-color:var(--line2)}
.jchap{flex:1;min-width:0}
.jnom{font-size:13.5px;font-weight:500;line-height:1.3;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.jmeta{margin-top:4px;font-size:11.5px;color:var(--muted)}
.jong{text-align:right;flex-shrink:0}
.jmiq{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;letter-spacing:-.02em}
.jxod{font-size:10.5px;color:var(--muted);margin-top:3px}
.jfaqat{display:none}
/* ═══ ХАРИТА ═══ */
.xkarta{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 6px 18px;box-shadow:var(--sh);overflow:hidden}
.xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.xscroll::-webkit-scrollbar{height:7px}
.xscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.xsvg{display:block;width:100%;min-width:660px;height:auto;color:var(--muted)}
.xsurish{display:none;align-items:center;gap:7px;padding:10px 16px 0;font-size:11.5px;color:var(--muted)}
.xsurish svg{width:13px;height:13px;flex-shrink:0}
/* давлат ҳудудлари */
.xyer{stroke-width:1.4;stroke-linejoin:round;fill-opacity:.07;opacity:0;
  animation:yerKir .8s cubic-bezier(.22,1,.36,1) both;transition:fill-opacity .25s}
.xyer.faol{fill-opacity:.16}
.xyer.faol:hover{fill-opacity:.26}
@keyframes yerKir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.xulash{stroke-width:1.4;opacity:.55;stroke-dasharray:2 3}
.xdav{font-family:Archivo,Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;
  opacity:0;animation:kir .6s ease both;
  paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.xnom,.xson,.xizoh{paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round}
.xsh{cursor:pointer;opacity:0;animation:shishSaqla .5s cubic-bezier(.34,1.56,.64,1) both;
  transform-box:fill-box;transform-origin:center}
.xsh .xdoira{transition:fill-opacity .2s,stroke-width .2s}
.xsh:hover .xdoira{fill-opacity:.42;stroke-width:3}
.xsh.tanlangan .xdoira{fill-opacity:.5;stroke-width:3.5}
/* пульс ҳалқаси ва ёзувлар босишни тўсмаслиги керак —
   акс ҳолда қўшни шаҳарни босиб бўлмайди */
.xpuls{opacity:.35;animation:pulsHalqa 2.6s ease-out infinite;
  transform-box:fill-box;transform-origin:center;pointer-events:none}
.xson,.xnom,.xizoh,.xdav{pointer-events:none}
.xson{font-family:Archivo,Inter,sans-serif;font-size:16px;font-weight:700;fill:var(--ink)}
.xnom{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;fill:var(--ink)}
.xizoh{font-family:Inter,sans-serif;font-size:10.5px}
.xafs{display:flex;flex-wrap:wrap;gap:16px;padding:14px 16px 0;font-size:12px;color:var(--muted)}
.xafs span{display:flex;align-items:center;gap:7px}
.xafs i{width:10px;height:10px;border-radius:3px}
.xafs b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.xtashq{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.xchip{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:8px 13px;color:var(--muted);font-size:12.5px;transition:.14s}
.xchip:hover{border-color:var(--line2);color:var(--ink)}
.xchip b{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:14px}
/* маркетинг: лид сифати чизиғи */
.kchiz{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--track);gap:2px}
.kchiz i{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.klg{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:12px;color:var(--muted)}
.klg span{display:flex;align-items:center;gap:7px}
.klg i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.klg b{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:12.5px}
.ksg{flex-wrap:wrap}
/* кассадаги қолдиқ */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.kk{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:17px 18px;
  position:relative;overflow:hidden}
.kk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok)}
.kk.minus::before{background:var(--no)}
.knom{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.3;min-height:34px}
.kson{font-size:27px;font-weight:600;font-family:Archivo,Inter,sans-serif;
  letter-spacing:-.035em;color:var(--ok);line-height:1.1;margin-top:2px}
.kk.minus .kson{color:var(--no)}
.kpul{font-size:11.5px;color:var(--muted);margin-top:4px}
.kbar{height:4px;border-radius:4px;background:var(--track);margin:13px 0 12px;overflow:hidden}
.kbar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.kk.minus .kbar i{background:var(--no)}
.kqat{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;color:var(--muted);padding:3px 0}
.kqat b{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink);font-weight:600}
.kd{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px}
.kdk{background:var(--ok)} .kdc{background:var(--no)}
.kson2{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-size:11px}
.kjami{margin-top:16px;background:var(--a-dim);border:1px solid var(--a-line);border-radius:13px;
  padding:18px 21px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.kjl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--a);font-weight:600}
.kjv{font-size:31px;font-weight:600;font-family:Archivo,Inter,sans-serif;letter-spacing:-.035em;
  color:var(--ok);line-height:1.1;margin-top:6px}
.kjami.minus .kjv{color:var(--no)}
.kjd{font-size:12px;color:var(--muted);margin-top:3px}
.kjo{display:flex;gap:28px}
.kjo>div{display:flex;flex-direction:column;gap:3px}
.kjo span{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kjo b{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:600}
/* доира диаграмма */
.doira{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dsvg{width:180px;height:180px;flex-shrink:0}
.dsek{animation:doiraOs .9s cubic-bezier(.22,1,.36,1) both}
@keyframes doiraOs{from{stroke-dasharray:0 9999}to{stroke-dasharray:var(--ul) var(--bo)}}
.chart .dich,.dsvg .dich{fill:#FFFFFF;font-family:Archivo,Inter,sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:-.01em;opacity:0;animation:kirKichik .4s ease both;
  paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;stroke-linejoin:round}
.dlq{opacity:0;animation:kir .4s cubic-bezier(.22,1,.36,1) both}
.dleg{flex:1;min-width:200px;display:flex;flex-direction:column;gap:9px}
.dlq{display:grid;grid-template-columns:11px 1fr auto auto;align-items:center;gap:10px;font-size:12.5px}
.dlq i{width:11px;height:11px;border-radius:4px}
.dnom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.dfo{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:700;color:var(--ink);min-width:38px;text-align:right}
.dsum{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);min-width:62px;text-align:right}
/* саҳифа тагидаги изоҳ */
.fizoh{margin-top:30px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:19px 21px;box-shadow:var(--sh)}
.fq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fq>div{display:flex;flex-direction:column;gap:3px;padding-left:11px;border-left:2px solid var(--a)}
.fq span{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.fq b{font-size:13.5px;font-weight:600}
.fizoh p{margin:15px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* ═══ АНИМАЦИЯЛАР ═══ */
@keyframes kir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kirKichik{from{opacity:0}to{opacity:1}}
@keyframes chiziqChiz{to{stroke-dashoffset:0}}
@keyframes shishSaqla{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes pulsHalqa{0%{opacity:.5;transform:scale(.7)}70%{opacity:0;transform:scale(2.2)}100%{opacity:0;transform:scale(2.2)}}

.met,.panel,.card,.kk,.detail,.tw,.fizoh,.tsh{animation:kir .42s cubic-bezier(.22,1,.36,1) both}
.mets .met:nth-child(2){animation-delay:.05s}
.mets .met:nth-child(3){animation-delay:.1s}
.mets .met:nth-child(4){animation-delay:.15s}
.kgrid .kk:nth-child(2){animation-delay:.05s}
.kgrid .kk:nth-child(3){animation-delay:.1s}
.kgrid .kk:nth-child(4){animation-delay:.15s}
.kgrid .kk:nth-child(n+5){animation-delay:.2s}
.grid .card:nth-child(n+3){animation-delay:.06s}
.grid .card:nth-child(n+7){animation-delay:.12s}
.bl .bi{animation:kir .4s cubic-bezier(.22,1,.36,1) both}
.bl .bi:nth-child(2){animation-delay:.04s} .bl .bi:nth-child(3){animation-delay:.08s}
.bl .bi:nth-child(4){animation-delay:.12s} .bl .bi:nth-child(5){animation-delay:.16s}
.bl .bi:nth-child(n+6){animation-delay:.2s}

.aline{stroke-dasharray:3000;stroke-dashoffset:3000;
  animation:chiziqChiz 1.4s cubic-bezier(.22,1,.36,1) .1s forwards}
.aarea{opacity:0;animation:kirKichik .9s ease .45s forwards}
.apt{opacity:0;animation:shishSaqla .38s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center}
.bittakun{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 20px;
  border:1px dashed var(--line2);border-radius:var(--r)}
.bittakun b{font-size:38px;font-family:Archivo;font-weight:600;color:var(--a);letter-spacing:-.04em}
.bittakun span{font-size:12.5px;color:var(--muted)}



/* Бошқарув панели тугмаси — чап менюда алоҳида ажралиб туради */
.pswitch .pv-btn{display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:5px;padding:12px 10px;font-weight:600;color:#E6E9EE;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08)}
.pswitch .pv-btn svg{width:16px;height:16px;flex-shrink:0}
.pswitch .pv-btn.on{border-color:transparent}
body.dokyoq .bnav{display:none}
body.dokyoq .main{padding-bottom:50px}
/* ═══════════ БОШҚАРУВ ПАНЕЛИ ═══════════ */
.pv-kick{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pv-vt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pv-card{border:1px solid var(--line);border-radius:18px;padding:18px 20px;
  background:linear-gradient(168deg,var(--card2),var(--card) 62%);box-shadow:var(--sh);min-width:0}
.pv-wait{padding:24px 10px;text-align:center;color:var(--muted);font-size:12.5px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.pv-wait .spin{width:18px;height:18px;border-width:2px;margin:0}
.pv-lnk{border:none;background:none;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:5px;padding:6px 0}
.pv-lnk:hover{color:var(--a)}
.pv-lnk svg{width:13px;height:13px}
.pv-gval b.k{color:var(--ok)}

.halqa-w{position:relative;display:grid;place-items:center;flex-shrink:0}
.halqa-m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.halqa-m b{font-family:Archivo,Inter,sans-serif;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.hq{animation:hqOs 1.3s cubic-bezier(.22,1,.36,1) both .15s}
@keyframes hqOs{from{stroke-dasharray:0 999}}

/* 1 — Режа / факт */
.pv-rjg{display:grid;grid-template-columns:1.25fr repeat(var(--n,3),1fr);gap:12px}
.pv-rj{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;
  background:linear-gradient(165deg,var(--card2),var(--card) 64%);box-shadow:var(--sh);
  animation:kir .5s cubic-bezier(.22,1,.36,1) both}
.pv-rj::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc)}
.pv-rj.jami{background:
  radial-gradient(360px 200px at 100% 0%,rgba(224,160,72,.16),transparent 65%),
  linear-gradient(165deg,var(--card2),var(--card) 64%)}
.pv-rjn{font-family:Archivo,Inter,sans-serif;font-weight:650;font-size:14.5px}
.pv-rj.jami .pv-rjn{font-size:16px}
.pv-rjb{display:flex;align-items:center;gap:16px;margin-top:14px}
.pv-rjs{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.pv-rjs div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--muted)}
.pv-rjs b{font-size:15px;color:var(--ink);font-weight:600}
.pv-rjs b.q{color:var(--no)}
.pv-rj.jami .pv-rjs b{font-size:18px}

/* 2 — Кечанинг ғолиби */
.pv-gold{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  padding:22px 24px;border-radius:20px;border:1px solid rgba(224,160,72,.35);
  background:

.pv-yz{display:flex;flex-direction:column}

/* ═══ ИНВЕСТИЦИЯ КАССАСИ — жамига кирмайди ═══ */
.kinvb{display:inline-block;margin-left:8px;font-style:normal;font-size:9.5px;font-weight:600;
  letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--info-dim);color:var(--info);
  vertical-align:1px;white-space:nowrap}
.pv-kah .kinvb{margin-left:auto}
.kk.kinv,.pv-ka.kinv{border-style:dashed;opacity:.82}
.kinvn{margin-top:10px;font-size:12px;color:var(--muted);padding:0 3px}
.kinvn b{color:var(--ink2);font-weight:600}

/* ═══ МОЛИЯ: ИЗОҲ — ёзувни босганда пастда очилади ═══ */
.mizr,.mizk{cursor:pointer}
.mizc{max-width:300px;position:relative;padding-right:34px!important}
.mizqs{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.mizo{position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:.18s}
.mizr.och .mizo{transform:rotate(-135deg);margin-top:-1px;border-color:var(--a)}
.mizr.och td{background:var(--a-dim)}
.mizd{display:none}
.mizr.och+.mizd{display:table-row}
.mizd td{white-space:normal!important;background:var(--bg2);padding:0!important}
.mizq{display:none;flex-basis:100%;padding:12px 14px 13px;border-left:3px solid var(--a);
  background:var(--card);border-radius:0 9px 9px 0;animation:mizOch .2s ease}
.mizd .mizq{display:block;margin:10px 15px 12px;max-width:900px}
.jkart.mizk{flex-wrap:wrap}
.jkart.mizk.och{border-color:var(--a-line)}
.jkart.mizk.och .mizq{display:block}
.mizt{font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.mizyoq{color:var(--muted);font-style:italic}
.mizm{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.mizm b{color:var(--ink2);font-weight:600}
.mizi{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a);margin-left:7px;vertical-align:2px}
@keyframes mizOch{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ═══ КОНВЕРСИЯ: катта карталар ═══ */
.kvg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.kvk{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r);
  background:linear-gradient(162deg,var(--card2),var(--card) 58%);border:1px solid var(--line);box-shadow:var(--sh);
  position:relative;overflow:hidden}
.kvk::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.kvkm{min-width:0}
.kvkn{font-weight:600;font-size:14.5px;font-family:Archivo}
.kvkf{font-size:11px;color:var(--pc);margin-top:4px;font-weight:600}
.kvkd{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}

/* ═══ ВОРОНКА — учбурчак, тепада кенг, пастда тор ═══ */
.vrn{display:flex;flex-direction:column;gap:2px}
.vq{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,46%);gap:16px;align-items:center;
  animation:vqKir .4s ease both}
.vqs{position:relative;height:50px}
.vqsh{position:absolute;inset:0;background:var(--c);transition:.2s}
.vq:hover .vqsh{filter:brightness(1.1)}
.vq.chetda .vqsh{opacity:.4;background:repeating-linear-gradient(135deg,var(--c) 0 8px,transparent 8px 14px)}
.vqt{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--bg);pointer-events:none;white-space:nowrap}
.vq.chetda .vqt{color:var(--ink)}
.vqt b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.vqt span{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.16)}
.vqi{min-width:0;padding:3px 0 3px 12px;border-left:2px solid var(--c)}
.vqn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtk{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2)}
.vtkr{display:flex;gap:10px;align-items:flex-start}
.vtkr>em{font-style:normal;flex-shrink:0;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:var(--c);color:var(--bg);margin-top:1px}
.vtkr>div>b{font-size:12.5px;color:var(--ink)}
.vtkr .vqk{margin-top:5px}
.vqn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.25}
.vqn em{font-style:normal;flex-shrink:0;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:var(--c);color:var(--bg)}
.vq.chetda .vqo{color:var(--no)}
.vqo{font-size:11.5px;color:var(--muted);margin-top:3px}
.vqo b{color:var(--ink)}
.vqk{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.vqk span{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.vqk b{color:var(--ink2);font-weight:600}
.vxl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;margin-top:16px;
  padding:13px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--c)}
.vxl span{font-weight:600;font-size:13.5px;color:var(--ink)}
.vxl em{grid-column:1;font-style:normal;font-size:11.5px;color:var(--muted)}
.vxl b{grid-column:2;grid-row:1/3;font-size:26px;font-weight:700;color:var(--c);letter-spacing:-.03em}
@keyframes vqKir{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ═══ КОНВЕРСИЯ: таргетолог карталари ═══ */
.kvtg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.kvt{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.kvth{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kvth b{font-size:14.5px;font-family:Archivo}
.kvth span{font-size:11.5px;color:var(--muted)}
.kvt2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kvt2>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
.kvt2 span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kvt2 b{display:block;font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.03em}
.kvt2 em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:6px}
.kvb{display:block;height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:7px}
.kvb i{display:block;height:100%;border-radius:3px}
.kvtq{display:flex;justify-content:space-between;gap:10px;margin-top:11px;font-size:11.5px;color:var(--muted)}
.kvtq b{color:var(--ink2)}

/* ═══ КОНВЕРСИЯ: стадиялар ва ойлар ═══ */
.kst,.koy{display:flex;flex-direction:column;font-size:12.5px}
.kstr,.koyr{display:grid;grid-template-columns:minmax(0,2.2fr) 1.2fr .7fr 1.3fr .9fr;gap:10px;align-items:center;
  padding:8px 4px;border-bottom:1px solid var(--line)}
.koyr{grid-template-columns:1fr .7fr 1.5fr 1.5fr .7fr}
.kstb,.koyb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kstn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.kstp{font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:7px;border:1px solid currentColor;color:var(--c);white-space:nowrap}
.kstb2{display:block;height:4px;border-radius:2px;background:var(--track);margin-top:4px;overflow:hidden}
.kstb2 i{display:block;height:100%}
.kstg{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 4px 6px;
  border-bottom:1px solid var(--line)}
.kstg b{color:var(--c);font-family:Archivo;font-size:13px}
.kstg span{font-size:11.5px;color:var(--muted)}
.koyr .kvb{margin:0 0 4px}

@media(max-width:1080px){ .kvg{grid-template-columns:1fr} }
@media(max-width:820px){
  .vq{grid-template-columns:minmax(0,1fr) 52%;gap:10px}

/* ═══ TURON CLUB: харита ═══ */
.txk{position:relative}
.txsvg{display:block;width:100%;height:auto;max-height:560px}
.txy,.txv{fill:var(--card2);stroke:var(--line2);stroke-width:.7;transition:.18s;vector-effect:non-scaling-stroke}
.txy.bor,.txv.bor{fill:var(--c);fill-opacity:var(--o);stroke:var(--c);stroke-opacity:.9;cursor:pointer}
.txy.bor:hover,.txv.bor:hover{fill-opacity:.95}
.txv{cursor:pointer}
.txv.tan{stroke:var(--ink);stroke-width:2.2;fill-opacity:1}
.txs{cursor:pointer;animation:txKir .5s ease both}
.txs circle{stroke:var(--bg);stroke-width:2.5;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.txn{fill:var(--bg);font:700 14px "JetBrains Mono",monospace;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.txl{fill:var(--ink);font:600 12.5px Archivo,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;pointer-events:none}
.txv0{fill:var(--muted);font:500 10.5px Archivo,sans-serif;text-anchor:middle;dominant-baseline:central;opacity:.8;pointer-events:none;
  paint-order:stroke;stroke:var(--card);stroke-width:3px}
.txh{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
@keyframes txKir{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.txs{transform-box:fill-box;transform-origin:center}

/* давлат карталари */
.tdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.tdk{text-align:left;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;
  padding:13px 15px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;cursor:pointer;transition:.15s;color:var(--ink)}

.pswitch{background:none;padding:0;gap:6px}
#pguruh{display:flex;flex-direction:column;gap:6px}
.pg{background:var(--side2);border:1px solid rgba(255,255,255,.05);border-radius:13px;overflow:hidden;transition:border-color .2s}
.pg.faol{border-color:rgba(224,160,72,.38)}
.pswitch .pg-h{display:flex;align-items:center;gap:8px;width:100%;padding:12px 12px;border-radius:0;text-align:left;
  color:#C9CED6;font-size:13.5px}
.pswitch .pg-h:hover{background:rgba(255,255,255,.04);color:#fff}
.pg-h b{font-family:Archivo;font-weight:600;letter-spacing:.01em;flex:1}
.pg.faol .pg-h b{color:#fff}
.pg-h em{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:#8A919B}
.pg.jonli .pg-h em{background:rgba(78,203,146,.14);color:#4ECB92}
.pg.arxiv .pg-h em{background:rgba(255,255,255,.06);color:#7D858F}
.pg-o{width:14px;height:14px;flex-shrink:0;color:#6E757E;transition:transform .22s}
.pg.och .pg-o{transform:rotate(180deg);color:#E0A048}
.pg-b{display:none;flex-direction:column;gap:2px;padding:0 6px 7px}
.pg.och .pg-b{display:flex;animation:pgOch .22s ease}
@keyframes pgOch{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pswitch .pg-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;
  font-size:12.5px;color:#9AA1AB}
.pg-i i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;margin:0 5px;flex-shrink:0}
.pg-i svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.pg-i span{flex:1}
.pswitch .pg-i.bosh{color:#D7DBE1;font-weight:600}
.pswitch .pg-i.yoq{color:#666D77}
.pg-i.yoq::after{content:"тез орада";font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#5C636C}
.pswitch .pg-i.on{color:#1A1206}
.pg-i.on i{opacity:1}
.pg-i.on::after{color:#1A1206;opacity:.6}
.pg-i.bosh.yoq::after{display:none}
.pg-i span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pswitch .adm-btn{margin-top:2px;padding:11px 10px;border-radius:12px}

/* уланмаган бўлим */
.ulq{border:1px dashed var(--line2);border-radius:18px;padding:46px 22px;text-align:center;background:var(--card)}
.ulq-i{width:58px;height:58px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--a-dim);color:var(--a);border:1px solid var(--a-line)}
.ulq-i svg{width:26px;height:26px}
.ulq>b{display:block;font-family:Archivo;font-size:18px;color:var(--ink)}
.ulq p{margin:9px auto 0;max-width:460px;font-size:13px;line-height:1.6;color:var(--muted)}
.ulq-t{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.pv-rj.ulanmagan{opacity:.6}
.pv-rj.ulanmagan .pv-rjs span{font-size:12px}

/* архив белгиси */
.arxb{display:flex;align-items:center;gap:8px;margin:-6px 0 16px;padding:8px 13px;border-radius:10px;font-size:12px;
  background:var(--bg2);border:1px dashed var(--line2);color:var(--muted)}
.arxb svg{width:14px;height:14px;flex-shrink:0}

<script>
/* ══════════════════════════════════════════════════════
   1. СОЗЛАМА — API ҳаволалари
   ⚠ Бу ерда ҲЕЧ ҚАНДАЙ калит ёки парол йўқ.
     Маълумот фақат «RBA Кириш» берган рухсатнома билан очилади.
   ══════════════════════════════════════════════════════ */

// Кириш (парол, журнал) — Kirish.gs деплойи
var API_KIRISH = 'https://script.google.com/macros/s/AKfycbzMjaAqu8R7Xj1mi2x7XgzNZHnem06_BK2usR714kPSOE8qZgEhf4WAevwbbRNE6mtU/exec';

// Сотув жадвали (интенсив + коуч)
var API = 'https://script.google.com/macros/s/AKfycbzfu9cVpXz50ySk8k_Wcd1RFXlU3myqXv4RaAt6BTs9igrBKPVIM-kEJxHrwY512yz7Fg/exec';

// Молия — фақат admin учун очилади
var API_MOLIYA = 'https://script.google.com/macros/s/AKfycbznMkeiEkQ2YtF7hQiFu76L5yZEaf2hqSiCrUsqn1SmtGDSldMGAaSjPrQ1Tnpw6vr_Sw/exec';

// Маркетинг
var API_MARKETING = 'https://script.google.com/macros/s/AKfycbwCtp5u0u_HaUub73E-X6YiMFY6ayCd1roRDEppKL6yyO9_twR6t5FbBYtoXXdhUMju/exec';

// AI 3.0
var API_AI = 'https://script.google.com/macros/s/AKfycbz0utSwXV43iAKqVG0qvzMtuj02ELwM5ueAhsRarSlvpRqssfZY-NC0szcp5uT6Rr1w/exec';

// Turon club — Turon.gs деплой қилингач, ҳаволани шу ерга қўйинг
// RBA Архив (RBA 13, RBA 14) — Arxiv.gs. Поток ?potok=13|14 билан танланади
var API_ARXIV = 'https://script.google.com/macros/s/AKfycbyQJlJEDa_dBe2qu3MEbLnoDlrLwZuJl7tK8XNg-PdOAo8gOa1rpQ3MeIFEau4yE9cq/exec';
var API_TURON = 'https://script.google.com/macros/s/AKfycbzO6d494h72JqXKOpDmSmSLWP5x8Zpa_w03QnYSkO61DXPUJ21f9tRMuHPiIi7Os75QAg/exec';


/* ══════════════════════════════════════════════════════
   2. ҲОЛАТ — илова нимани кўрсатиб турибди
   ══════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════
   1.5 КИРИШ — PIN экран, рухсатнома, роллар, автоблок
   Код серверда текширилади. Бу ерда фақат рухсатнома сақланади.
   ══════════════════════════════════════════════════════ */

var KIR_SAQ='rba_kirish_v1', QUR_SAQ='rba_qurilma_v1', ROL_SAQ='rba_rol_v1';
var AUTH={token:null,rol:null,exp:0};
var BOSHLANDI=false;
var PIN='', QULF_XATO='', QULF_IZOH='', QULF_BAND=false, QULF_BLOK=false;
var BLOK_DAQIQA=24*60;                  // 24 соат ишлатилмаса — қулф (сервердаги муддат билан бир хил)

function kirishUlangan(){ return API_KIRISH.indexOf('BU_YERGA')<0 }
function adminMi(){ return AUTH.rol==='admin' }

/** Қурилманинг доимий белгиси — бир марта яратилади */
function qurilmaId(){
  var q=null; try{ q=localStorage.getItem(QUR_SAQ) }catch(e){}
  if(!q || !/^[A-Za-z0-9]{12,32}$/.test(q)){
    var a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', r=null;
    try{ r=crypto.getRandomValues(new Uint8Array(20)) }catch(e){}
    q=''; for(var i=0;i<20;i++) q+=a[(r?r[i]:Math.floor(Math.random()*256))%a.length];
    try{ localStorage.setItem(QUR_SAQ,q) }catch(e){}
  }
  return q;
}

/** «Android · Chrome · 412×915» — admin қурилмани танийди */
function qurilmaNomi(){
  var u=navigator.userAgent||'', os='Қурилма', br='Браузер';
  if(/iPhone/.test(u)) os='iPhone';
  else if(/iPad/.test(u) || (/Macintosh/.test(u) && 'ontouchend' in document)) os='iPad';
  else if(/Android/.test(u)){
    var m=u.match(/Android[^;)]*;\s*([^;)]+?)(?:\s+Build\/|\))/);
    var mod=m&&m[1]?m[1].trim():'';
    os='Android'+(mod && mod!=='K' && !/^wv$|Linux/.test(mod) ? ' '+mod : '');
  }
  else if(/Windows/.test(u)) os='Windows';
  else if(/Mac OS X/.test(u)) os='Mac';
  else if(/Linux/.test(u)) os='Linux';
  if(/YaBrowser/.test(u)) br='Яндекс';
  else if(/Edg\//.test(u)) br='Edge';
  else if(/OPR\//.test(u)) br='Opera';
  else if(/Telegram/i.test(u)) br='Telegram';
  else if(/SamsungBrowser/.test(u)) br='Samsung';
  else if(/Firefox|FxiOS/.test(u)) br='Firefox';
  else if(/CriOS|Chrome/.test(u)) br='Chrome';
  else if(/Safari/.test(u)) br='Safari';
  return os+' · '+br+' · '+screen.width+'×'+screen.height;
}

function authOqi(){
  try{
    var a=JSON.parse(localStorage.getItem(KIR_SAQ)||'null');
    if(a && a.token && a.exp>Date.now()+60000) return a;
  }catch(e){}
  return null;
}

async function kirPost(o){
  var r=await fetch(API_KIRISH,{method:'POST',body:JSON.stringify(o)});
  return await r.json();
}

/* ── Экран ──
   Бир марта чизилади. Рақам босилганда фақат нуқталар ва ёзув янгиланади —
   экран қайта чизилмайди, шунинг учун сакрамайди. */
function qulfChiz(){
  var el=document.getElementById('qulf');
  var dots=''; for(var i=0;i<6;i++) dots+='<i></i>';
  function b(r){ return '<button class="qb" type="button" data-pin="'+r+'">'+r+'</button>' }
  var del='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>';
  el.innerHTML='<div class="qk">'+
    '<div class="qlogo">RBA</div>'+
    '<div class="qt">Real Business Academy</div>'+
    '<div class="qs">Бошқарув панелига кириш учун кодни теринг</div>'+
    '<div class="qdots" id="qdots">'+dots+'</div>'+
    '<div class="qmsg" id="qmsg"></div>'+
    '<div class="qpad">'+b(1)+b(2)+b(3)+b(4)+b(5)+b(6)+b(7)+b(8)+b(9)+
      '<span></span>'+b(0)+'<button class="qb bo" type="button" data-pin="del" aria-label="Ўчириш">'+del+'</button></div>'+
    '<div class="qfoot">Бу қурилма: <b>'+esc(qurilmaNomi())+'</b><br>'+
      'Бир марта кирсангиз — 24 соат фаол бўлмагунча код сўралмайди</div>'+
  '</div>';
  qulfYangila();
}

/** Фақат ўзгарган жойлар: нуқталар, ёзув, тугмалар ҳолати */
function qulfYangila(){
  var d=document.getElementById('qdots'); if(!d) return;
  var n=d.children;
  for(var i=0;i<n.length;i++) n[i].classList.toggle('on',i<PIN.length);
  var o=QULF_BAND||QULF_BLOK||!kirishUlangan();
  var bt=document.querySelectorAll('#qulf [data-pin]');
  for(var j=0;j<bt.length;j++) bt[j].disabled=o;
  var m=document.getElementById('qmsg');
  var matn=!kirishUlangan() ? 'Кириш скрипти ҳали уланмаган (API_KIRISH)' : (QULF_XATO||QULF_IZOH||'');
  m.className='qmsg'+(QULF_BAND?'':(QULF_XATO?' xato':''));
  m.innerHTML = QULF_BAND ? '<div class="spin"></div>Текширилмоқда…' : esc(matn);
}

function qulfKorsat(izoh){
  PIN=''; QULF_XATO=''; QULF_IZOH=izoh||''; QULF_BAND=false;
  document.body.classList.add('qulfli');
  qulfChiz();
  serverUygot();
}

/* Код терилаётган пайтда серверлар «уйғонади» (Google скрипти биринчи
   мурожаатда 2–4 сония секин). Натижада кириш ва маълумот тезроқ келади. */
var UYGOTILDI=0;
function serverUygot(){
  if(Date.now()-UYGOTILDI<4*60000) return;
  UYGOTILDI=Date.now();
  [API_KIRISH,API,API_AI,API_MARKETING,API_MOLIYA,API_TURON,API_ARXIV].forEach(function(u){
    if(u && u.indexOf('BU_YERGA')<0) fetch(u+'?amal=tekshir').catch(function(){});
  });
}

/** Сеансни тугатади (рухсатнома ўчади) ва кириш экранини очади */
function qulfla(izoh){
  if(document.body.classList.contains('qulfli') && !AUTH.token) return;
  AUTH={token:null,rol:null,exp:0};
  try{ localStorage.removeItem(KIR_SAQ) }catch(e){}
  main.innerHTML='';
  qulfKorsat(izoh);
}

/** «Чиқиш» — сақланган маълумот ҳам ўчади */
function chiqish(){
  try{ localStorage.removeItem(XOT) }catch(e){}
  D=null;
  qulfla('Сиз тизимдан чиқдингиз');
}

function pinBos(r){
  if(QULF_BAND || QULF_BLOK || !kirishUlangan()) return;
  if(r==='del') PIN=PIN.slice(0,-1);
  else if(PIN.length<6) PIN+=String(r);
  QULF_XATO='';
  var d=document.getElementById('qdots'); if(d) d.classList.remove('silk');
  qulfYangila();
  if(PIN.length===6) pinYubor();
}

async function pinYubor(){
  QULF_BAND=true; qulfYangila();
  var silk=false;
  try{
    var j=await kirPost({amal:'kirish',kod:PIN,qid:qurilmaId(),qurilma:qurilmaNomi()});
    if(j && j.ok){ QULF_BAND=false; kirishOk(j); return }
    QULF_XATO=(j&&j.xato)||'Хатолик';
    if(j && j.qoldi!=null) QULF_XATO+=' · яна '+j.qoldi+' та уриниш';
    if(j && j.blok){ QULF_BLOK=true; setTimeout(function(){ QULF_BLOK=false; QULF_XATO=''; qulfYangila() },60000) }
    silk=true;
  }catch(e){
    QULF_XATO='Серверга уланиб бўлмади — интернетни текширинг';
  }
  PIN=''; QULF_BAND=false; qulfYangila();
  if(silk){ var d=document.getElementById('qdots'); if(d){ d.classList.remove('silk'); void d.offsetWidth; d.classList.add('silk') } }
}

function rolBelgi(){
  document.body.classList.toggle('admin',adminMi());
  var r=document.getElementById('tbRol');
  if(r){ r.textContent=adminMi()?'Admin':'Ходим'; r.className='tbrol'+(adminMi()?' adm':'') }
}

function kirishOk(j){
  var eski=null; try{ eski=localStorage.getItem(ROL_SAQ) }catch(e){}
  // Рол алмашса (admin → ходим) — сақланган маълумот ўчади, молия қолиб кетмасин
  if(eski && eski!==j.rol){ try{ localStorage.removeItem(XOT) }catch(e){} D=null }
  try{ localStorage.setItem(ROL_SAQ,j.rol) }catch(e){}
  AUTH={token:j.token,rol:j.rol,exp:j.exp};
  try{ localStorage.setItem(KIR_SAQ,JSON.stringify(AUTH)) }catch(e){}
  PIN=''; QULF_XATO=''; QULF_IZOH='';
  OXIRGI_HARAKAT=Date.now();
  document.body.classList.remove('qulfli');
  document.getElementById('qulf').innerHTML='';
  rolBelgi();
  if(!adminMi()){
    if(S.prod==='admin'){ S.prod='panel'; S.sahifa='umumiy' }
    if(D) delete D.nazorat;
  }
  if(!BOSHLANDI){ BOSHLANDI=true; boshla() }
  else { chiz(); yukla(!!D) }
  xabar(adminMi()?'Хуш келибсиз, admin':'Хуш келибсиз');
}

/* ── Фаоллик: бўлим алмашганда ва ҳар 5 дақиқада ── */
async function faolYubor(bolim){
  if(!kirishUlangan() || !AUTH.token) return;
  try{
    var j=await kirPost({amal:'faol',t:AUTH.token,bolim:bolim||'',qurilma:qurilmaNomi()});
    if(j && j.chiqish){ qulfla(j.sabab||'Сеанс тугади — қайта киринг'); return }
    if(j && j.token){
      AUTH.token=j.token; AUTH.exp=j.exp;
      try{ localStorage.setItem(KIR_SAQ,JSON.stringify(AUTH)) }catch(e){}
    }
  }catch(e){}
}

var OXIRGI_HARAKAT=Date.now();
['pointerdown','keydown','touchstart','wheel','scroll'].forEach(function(ev){
  document.addEventListener(ev,function(){ OXIRGI_HARAKAT=Date.now() },{passive:true,capture:true});
});
setInterval(function(){
  if(!AUTH.token) return;
  if(Date.now()-OXIRGI_HARAKAT > BLOK_DAQIQA*60000){ qulfla('24 соат фаолият бўлмади — қайта киринг'); return }
  if(AUTH.exp < Date.now()) qulfla('Сеанс муддати тугади — қайта киринг');
},20000);
setInterval(function(){
  if(AUTH.token && document.visibilityState==='visible') faolYubor('');
},5*60000);

/* ── PIN тугмалари ва клавиатура ── */
document.getElementById('qulf').addEventListener('click',function(e){

async function arxYukla(pt,majburiy){
  if(!pt || !arxUlangan() || !D) return;

  D.arx=D.arx||{};
  var bor=D.arx[pt];
  if(bor && bor.praktikum && !bor.xato && !majburiy) return;
  S.xBand[pt]=true; belgi(true); chiz();
  try{
    var j=await bittaYukla(API_ARXIV+'?potok='+pt+'&t='+encodeURIComponent(AUTH.token)+(S.yangi?'&yangi=1':''));

      kouch:     j.kouchP?paketOch(j.kouchP):(j.kouch||[]),

      tadbirlar: j.tadbirlar||[],
      vaqt:      j.vaqt||'', xato:null
    };
  }catch(e){
    D.arx[pt]=D.arx[pt]||{};
    D.arx[pt].xato=e.message;
  }
  S.xBand[pt]=false; belgi(false); saqla(); chiz();
}

/**
 * Сервер маълумотни сиқилган ҳолда юборади: устун номлари ҳар қаторда
 * такрорланмайди, такрорланувчи матнлар эса луғатга чиқарилган.
 * Шу сабаб юклаш ~10 баравар тез. Бу функция уни очади.
 */
function paketOch(p){
  if(!p) return [];
  if(Array.isArray(p)) return p;              // эски формат — шундайлигича
  if(!p.q || !p.m) return [];
  var m=p.m, lugM=p.lugM||[], lug=p.lug||{};
  var lugat={}, i;
  for(i=0;i<lugM.length;i++) lugat[lugM[i]]=lug[lugM[i]]||[];
  return p.q.map(function(r){
    var o={};
    for(var j=0;j<m.length;j++){
      var k=m[j], v=r[j];
      o[k]= lugat[k] ? (lugat[k][v]||'') : v;
    }
    return o;
  });
}
function rang(i){ var l=qoraMi()?RANG_Q:RANG; return l[i%l.length] }

function sanaOqi(v){
  if(!v) return null;
  var m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  var d=new Date(v); return isNaN(d)?null:d;
}
function dfmt(s){ var d=sanaOqi(s); if(!d) return '—';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear() }
function dqisqa(s){ var d=sanaOqi(s); if(!d) return '';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2) }

async function bittaYukla(url){
  var r=await fetch(url);
  var j=await r.json();
  if(!j.ok){
    // Рухсатнома тугаган ёки нотўғри — кириш экранига қайтамиз
    if(j.kirish){ qulfla(j.xato); var e=new Error(j.xato||'Кириш талаб қилинади'); e.kirish=true; throw e }
    throw new Error(j.xato||'Сервер хатоси');
  }
  return j;
}

/**
 * Сотув маълумотини юклайди.
 * Молия АЛОҲИДА ва фақат керак бўлганда юкланади — шунинг учун
 * илова биринчи очилишда анча тез ишга тушади.
 */
async function yukla(jim){
  if(S.band) return;
  S.band=true;
  if(!jim && !D) main.innerHTML='<div class="load"><div class="spin"></div>Маълумот юкланмоқда…</div>';
  belgi(true);

  try{
    var j=await bittaYukla(API+'?amal=baza&t='+encodeURIComponent(AUTH.token)+(S.yangi?'&yangi=1':''));
    // v3 сиқилган формат
    if(j.praktikumP){ j.praktikum=paketOch(j.praktikumP); delete j.praktikumP }
    if(j.kouchP){     j.kouch=paketOch(j.kouchP);         delete j.kouchP }
    // Молия аввал юкланган бўлса, сақлаб қоламиз
    if(D){ j.moliya=D.moliya; j.moliyaTashxis=D.moliyaTashxis;
           j.moliyaVersiya=D.moliyaVersiya; j.moliyaXato=D.moliyaXato;
           j.marketing=D.marketing; j.markTashxis=D.markTashxis;
           j.markVersiya=D.markVersiya; j.markXato=D.markXato;
           j.ai=D.ai; j.aiReja=D.aiReja; j.aiVersiya=D.aiVersiya; j.aiXato=D.aiXato;
           j.turon=D.turon; j.turonPlan=D.turonPlan; j.turonVersiya=D.turonVersiya; j.turonXato=D.turonXato;
           j.turonOq=D.turonOq; j.turonOqXato=D.turonOqXato; j.turonKurs=D.turonKurs;
           j.arx=D.arx;
           j.nazorat=D.nazorat; j.nazoratXato=D.nazoratXato }
    D=j; S.xato=null; S.eski=false;
    aloqa(true,D.vaqt);
    saqla();
  }catch(e){
    if(D){ S.eski=true } else { S.xato=e.message }
    aloqa(false);
  }

  S.band=false; belgi(false); chiz();
  if(moliyaMi()) moliyaYukla();
  if(markMi())   markYukla();
  if(aiMi())     aiYukla();
  if(turonMi())  turonYukla();
  if(panelMi() && D){ moliyaYukla(); markYukla(); }
  if(rbcPanelMi()) turonYukla();
  if(iiPanelMi())  aiYukla();
  if(potok())      arxYukla(potok());
  if(nazoratMi()) nazoratYukla();
}

/** Сунъий интеллект маълумоти — фақат шу бўлим очилганда */
async function aiYukla(majburiy){
  if(!aiUlangan() || S.aBand) return;
  if(!D) return;
  if(D && D.ai && !D.aiXato && !majburiy) return;
  S.aBand=true; belgi(true); chiz();
  try{
    var j=await bittaYukla(API_AI+'?amal=baza&t='+encodeURIComponent(AUTH.token)+(S.yangi?'&yangi=1':''));
    D.ai=j.sotuvP ? paketOch(j.sotuvP) : (j.sotuv||[]);
    D.aiReja=Array.isArray(j.reja)?j.reja:[];

    D.aiXato=null;
  }catch(e){
    D.aiXato=e.message;
    D.ai=D.ai||[];
  }
  S.aBand=false; belgi(false); saqla(); chiz();

/** Сана фильтридан ўтган қаторлар */
/**
 * Сана фильтри — ҳамма бўлимда шу битта функция ишлатилади.
 * (Сотув, молия, маркетинг — учаласи учун бир хил мантиқ.)
 */
function sanaFiltrla(barcha){
  if(!barcha || !barcha.length) return [];
  if(S.oraliq==='hammasi') return barcha;

  var bugun=new Date(); bugun.setHours(0,0,0,0);
  var dan=bugun, gacha=new Date(2099,0,1);

  if(S.oraliq==='kun'){                 // бугун
    dan=bugun; gacha=bugun;
  }
  if(S.oraliq==='kecha'){               // фақат кечаги кун
    dan=new Date(bugun); dan.setDate(dan.getDate()-1);
    gacha=new Date(dan);
  }
  if(S.oraliq==='oy'){                  // шу ойнинг 1-санасидан бугунгача
    dan=new Date(bugun.getFullYear(), bugun.getMonth(), 1);
    gacha=bugun;
  }
  if(S.oraliq==='oraliq'){
    dan   = S.dan   ? sanaOqi(S.dan)   : new Date(2000,0,1);
    gacha = S.gacha ? sanaOqi(S.gacha) : new Date(2099,0,1);
  }
  return barcha.filter(function(x){
    var s=sanaOqi(x.sana); if(!s) return true;
    s.setHours(0,0,0,0);
    return s>=dan && s<=gacha;
  });
}

function satrlar(){
  if(!D) return [];
  var ds=DS();
  return sanaFiltrla((praktikumMi()?ds.praktikum:ds.kouch)||[]);
}

/** Жами: сони, суммалар, келмаганлар */
function jam(l){
  var o={soni:0,kelishuv:0,tolangan:0,qarz:0,kelmagan:0};
  l.forEach(function(x){
    o.soni+=(x.kishi||1);
    o.kelishuv+=x.kelishuv; o.tolangan+=x.tolangan; o.qarz+=x.qarz;
    if(x.kelmagan) o.kelmagan++;
  });
  return o;
}

/** Калит бўйича гуруҳлаб, кўпдан озга тартиблайди */
function guruhla(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,soni:0,tolangan:0,qarz:0,satrlar:[]}; t.push(k) }
    var g=m[k];
    // «Нечи киши» бўлса ўша қўшилади (сунъий интеллект), акс ҳолда 1
    g.soni+=(x.kishi||1); g.tolangan+=x.tolangan; g.qarz+=x.qarz;
    g.satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.soni-a.soni });
}

/**
 * КОНВЕРСИЯ — «menedjer konversiya» варағидан олинади.
 * Илова ўзи ҳисобламайди: варақдаги формула ягона манба,
 * шунинг учун бу ердаги рақам Google Sheets билан доим бир хил бўлади.
 * Сана фильтрига боғлиқ эмас — варақда қандай бўлса, шундай.
 */
function konversiya(menejerNomi){
  var l=DS().konversiya||[];
  for(var i=0;i<l.length;i++)
    if(l[i].menejer===menejerNomi) return l[i].sotuv ? l[i] : null;
  return null;
}

/** 88.235 → «88.2%», 100 → «100%» */
function konvMatn(k){
  if(!k) return null;
  var f=k.foiz;
  return (Math.abs(f-Math.round(f))<0.05 ? Math.round(f) : f.toFixed(1))+'%';
}

/** Ном бошидаги рақам: «6 Тошкент» → 6. Рақамсиз бўлса 999. */
function raqam(nom){
  var m=String(nom).match(/^\s*(\d+)/);
  return m ? +m[1] : 999;
}

/** Локацияларни 1,2,3… тартибида (рақамсизларни сотув сони бўйича) */
function tartibla(l){
  return l.slice().sort(function(a,b){
    var f=raqam(a.nom)-raqam(b.nom);
    return f!==0 ? f : b.soni-a.soni;
  });
}

function tadbir(nom){
  var l=DS().tadbirlar||[];
  for(var i=0;i<l.length;i++) if(l[i].nom===nom) return l[i];
  return null;
}
/** Шаҳар остидаги изоҳ: «19 кун қолди» ёки «бўлиб ўтди» */
function kunIzoh(nom){
  var t=praktikumMi()?tadbir(nom):null;
  if(!t) return '';
  return t.otdi?'бўлиб ўтди':t.kun+' кун қолди';
}

/** Горизонтал устунлар рўйхати */
function ustunlar(l){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var max=Math.max.apply(null,l.map(function(x){ return x.qiy }))||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+(x.ost?'<small>'+esc(x.ost)+'</small>':'')+'</div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.qiy/max*100)+'%;background:'+rang(i)+'"></div></div>'+
      '<div class="bv">'+fmt(x.qiy)+(x.ong?'<small>'+esc(x.ong)+'</small>':'')+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

/** Режа ва факт: яшил тўлдириш + қора чизиқ = режа даражаси */
function rejaUstun(l){
  if(!l.length) return '<div class="empty"><b>План киритилмаган</b>«план» варағини тўлдиринг</div>';
  var max=Math.max.apply(null,l.map(function(x){ return Math.max(x.reja,x.fakt) }))||1;
  l=l.slice().sort(function(a,b){ return raqam(a.rop)-raqam(b.rop) });
  return '<div class="bl">'+l.map(function(x){
    var f=foiz(x.fakt,x.reja);
    var r=f>=100?'var(--green)':f>=60?'var(--ochre)':'var(--red)';
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.rop)+'<small>план '+fmt(x.reja)+' · факт '+fmt(x.fakt)+' · қолди '+fmt(Math.max(0,x.reja-x.fakt))+'</small></div>'+
      '<div class="rjtr"><div class="rjfl" style="width:'+Math.max(1,x.fakt/max*100)+'%;background:'+r+'"></div>'+
      '<div class="rjmark" style="left:calc('+Math.min(99,Math.max(1,x.reja/max*100)).toFixed(1)+'% - 1px)"></div></div>'+
      '<div class="bv" style="color:'+r+'">'+fmt(x.fakt)+'<small>'+f+'%</small></div></div>';
  }).join('')+'</div>';
}

/** Санани танланган қадамга (кун / ҳафта / ой) қисқартиради */
var OYLAR=['янв','фев','март','апр','май','июн','июл','авг','сент','окт','ноя','дек'];

function davrKalit(sana){
  var d=sanaOqi(sana); if(!d) return null;
  if(S.davr==='oy')
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-01';
  if(S.davr==='hafta'){
    var m=new Date(d), dush=(m.getDay()+6)%7;         // ҳафта душанбадан бошланади
    m.setDate(m.getDate()-dush);
    return m.getFullYear()+'-'+('0'+(m.getMonth()+1)).slice(-2)+'-'+('0'+m.getDate()).slice(-2);
  }
  return String(sana).slice(0,10);
}

function davrYorliq(k){
  var d=sanaOqi(k); if(!d) return k;
  if(S.davr==='oy') return OYLAR[d.getMonth()]+' '+String(d.getFullYear()).slice(2);
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2);
}

/**
 * Сотув динамикаси — ҳар бир сана алоҳида устун.
 * Кенглик саналар сонига қараб ўсади, сиғмагани чапга сурилиб кўрилади.
 * Шунинг учун БАРЧА саналар ёрлиғи билан чиқади, ҳеч бири тушиб қолмайди.
 */
/**
 * Силлиқ эгри чизиқ (Catmull-Rom → безье).
 * Нуқталарни синиқ эмас, юмшоқ тўлқин қилиб боғлайди.
 */
function egri(nuq){
  if(nuq.length<2) return nuq.length?('M'+nuq[0][0]+' '+nuq[0][1]):'';
  var d='M'+nuq[0][0].toFixed(1)+' '+nuq[0][1].toFixed(1);
  for(var i=0;i<nuq.length-1;i++){
    var p0=nuq[i-1]||nuq[i], p1=nuq[i], p2=nuq[i+1], p3=nuq[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+
       ','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}

function dinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={soni:0,pul:0}; t.push(k) }
    m[k].soni+=(x.kishi||1); m[k].pul+=(x.tolangan||0);
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда сотув йўқ');
  if(t.length===1)
    return '<div class="bittakun"><b class="num">'+m[t[0]].soni+'</b>'+
           '<span>'+davrYorliq(t[0])+' — шу битта кунда</span></div>';

  var slot = S.davr==='kun' ? 26 : 52;
  var chap = 46, ong = 26, tep = 34, past = 54;
  /* Чизма панелнинг БУТУН кенглигини эгаллайди; нуқта кўп бўлса
     кенгаяди ва чапга суриб кўрилади. */
  var bor = Math.max(320, (main.clientWidth||960) - 74);
  var W = Math.max(bor, chap+ong+slot*(t.length-1)), H = 252;
  var max = 1;
  t.forEach(function(k){ if(m[k].soni>max) max=m[k].soni });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+fmt(Math.round(max*f))+'</text>';
  });

  var nuq=t.map(function(k,i){ return [X(i),Y(m[k].soni)] });
  var yol=egri(nuq);
  var maydon=yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+'L'+X(0).toFixed(1)+' '+(H-past)+'Z';

  /* Жой етарли бўлса — ҲАР БИР сана устида сони турсин */
  var oraliq=(W-chap-ong)/Math.max(1,t.length-1);
  var qadam=Math.max(1,Math.ceil(t.length/12));
  var sonQadam=oraliq>=26 ? 1 : Math.ceil(26/oraliq);
  var belgi='',yorliq='';
  t.forEach(function(k,i){
    var x=X(i), y=Y(m[k].soni), eng=(m[k].soni===max);
    if(t.length<=30 || i%qadam===0 || i===t.length-1 || eng){
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(eng?4.8:3.4)+
        '" fill="var(--a)" style="animation-delay:'+(0.5+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+': '+m[k].soni+' та</title></circle>';
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
    }
    if(i%sonQadam===0 || i===t.length-1 || eng)
      belgi+='<text class="vt'+(eng?' eng':'')+'" x="'+x.toFixed(1)+'" y="'+(y-13).toFixed(1)+
        '" text-anchor="middle">'+fmt(m[k].soni)+'</text>';
  });

  var id='g'+Math.floor(Math.random()*1e6);
  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" '+
    'viewBox="0 0 '+W+' '+H+'" style="max-width:100%">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" style="stop-color:var(--a);stop-opacity:.42"/>'+
      '<stop offset="100%" style="stop-color:var(--a);stop-opacity:0"/></linearGradient></defs>'+
    tor+
    '<path class="aarea" d="'+maydon+'" fill="url(#'+id+')"/>'+
    '<path class="aline" d="'+yol+'" fill="none" stroke="var(--a)" stroke-width="2.6" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    belgi+yorliq+'</svg></div>'+
    (W>bor+4 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Чизма тепасидаги Кун / Ҳафта / Ой тугмалари ва қисқа хулоса */
function davrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+(x.kishi||1);
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг фаол: '+davrYorliq(eng)+' \u2014 '+m[eng]+' та сотув' : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}

function sarlavha(h1,izoh,asbob){

      'Архив — ёпилган поток, маълумоти ўзгармайди'+(av?' · ўқилган: '+esc(String(av).slice(0,16)):'')+'</div>';

/** Бўш ҳолат — сана фильтри сабаб бўлса, дарҳол тузатиш тугмаси чиқади */
function bosh(matn){
  var h='<div class="empty"><b>'+esc(matn)+'</b>';
  if(S.oraliq!=='hammasi')
    h+='Сана фильтри торайтириб турибди.'+
       '<div style="margin-top:11px"><button class="btn btn-o" data-o="hammasi">Ҳаммасини кўрсатиш</button></div>';
  return h+'</div>';
}

function bolim(nom,izoh,ichi){
  return '<div class="sec"><h2>'+esc(nom)+'</h2><p>'+esc(izoh)+'</p></div><div class="panel">'+ichi+'</div>';
}

/** Сана бўйича гуруҳланган сотувлар — деталда ва телефонда ишлатилади */
function kunlikRoyxat(l){
  if(!l.length) return '<div class="empty">Сотув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],sm=0; lst.forEach(function(x){ sm+=x.tolangan });
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+lst.length+' та · '+pul(sm)+'</span></div>'+
      lst.map(function(x){
        var teg=praktikumMi()?x.joy:x.produkt;
        return '<div class="jkart"><div class="jchap">'+
          '<div class="jnom">'+esc(x.fio||'—')+'</div>'+
          '<div class="jmeta">'+esc(teg||'')+'</div></div>'+
          '<div class="jong"><div class="jmiq">'+pul(x.tolangan)+'</div>'+
          '<div class="jxod">'+esc(x.menejer||'—')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

   8. БЎЛИМ 1 — УМУМИЙ
   «Режа қандай бажарилаяпти?»
   ══════════════════════════════════════════════════════ */

function umumiySahifa(){
  var l=satrlar(), j=jam(l);
  var reja=(DS().reja&&DS().reja[asos()])||[];

  reja.forEach(function(x){ rJami+=x.reja; fJami+=x.fakt });
  var b=foiz(fJami,rJami);

  return sarlavha(
    praktikumMi()?'3 кунлик — умумий':'Коучинг — умумий',

    sanaFiltr()+mobilTugma()) +

  '<div class="mets">'+
    '<div class="met o"><div class="met-l">План</div><div class="met-v num">'+fmt(rJami)+'</div>'+
      '<div class="met-d">факт '+fmt(fJami)+' · қолди '+fmt(Math.max(0,rJami-fJami))+

    '<div class="met k"><div class="met-l">Тўланган</div><div class="met-v num">'+pul(j.tolangan)+'</div>'+
      '<div class="met-d">келишув '+pul(j.kelishuv)+'</div></div>'+
    '<div class="met c"><div class="met-l">Қарздорлик</div><div class="met-v num">'+pul(j.qarz)+'</div>'+
      '<div class="met-d">келишувнинг '+foiz(j.qarz,j.kelishuv)+'%</div></div>'+

  bolim('План бажарилиши','Ҳар бир РОП бўйича. Қора чизиқ — план даражаси.',rejaUstun(reja))+

  bolim('Сотув динамикаси','Ҳар бир санада нечта сотув бўлган',davrQatori(l)+dinamika(l));
