<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Real Business Academy — Бошқарув панели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   РБА — БОШҚАРУВ ПАНЕЛИ · дизайн тизими
   Қора режим асосий. Оқ режим — тугма орқали.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* фон қатламлари */
  --bg:#0B0D10; --bg2:#11141A; --card:#151A21; --card2:#1B212A;
  --line:#232A34; --line2:#333C48;
  /* матн */
  --ink:#F0EEE9; --ink2:#B9BEC7; --muted:#7D858F;
  /* акцент */
  --a:#E0A048; --a2:#F2C078; --a-dim:rgba(224,160,72,.13); --a-line:rgba(224,160,72,.30);
  /* ҳолат ранглари */
  --ok:#4ECB92; --ok-dim:rgba(78,203,146,.12); --ok-line:rgba(78,203,146,.26);
  --no:#F0796E; --no-dim:rgba(240,121,110,.12); --no-line:rgba(240,121,110,.26);
  --info:#6FA8DC; --info-dim:rgba(111,168,220,.12);
  /* матрица шкаласи */
  --z0:#161B22; --z0f:#3E4650; --z1:#1D2530; --z1f:#8A929C;
  --z2:#3A2D14; --z2f:#E0A048; --z3:#123024; --z3f:#4ECB92;
  /* ўлчов */
  --r:14px; --r2:10px; --nav:66px; --tb:56px; --sw:252px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --side:#0E1116; --side2:#1A1F27; --side3:#232A34;
  --track:#1D232C; --thead:#141920; --hover:#1A2028;
  --sel-bg:var(--a); --sel-fg:#1A1206; --toast:#232A34;
  --prog:rgba(255,255,255,.08);
  /* JS ичида ишлатиладиган эски номлар — янгиларига боғланган */
  --green:var(--ok); --red:var(--no); --ochre:var(--a);
}
body.oq{
  --bg:#F4F2ED; --bg2:#EDEAE3; --card:#FFFFFF; --card2:#F7F5F1;
  --line:#E2DFD7; --line2:#CBC6BB;
  --ink:#16181C; --ink2:#4A4F57; --muted:#767C85;
  --a:#B87218; --a2:#8A5310; --a-dim:#FBF1DF; --a-line:#EBD6AF;
  --ok:#2C7A57; --ok-dim:#E6F3EC; --ok-line:#C7E2D4;
  --no:#B23A31; --no-dim:#FBEAE8; --no-line:#F0D0CC;
  --info:#2F5C8F; --info-dim:#E9EFF7;
  --z0:#F1EFEA; --z0f:#A9A49B; --z1:#F5F3EE; --z1f:#767C85;
  --z2:#FBF0DE; --z2f:#8A5310; --z3:#E6F3EC; --z3f:#2C7A57;
  --sh:0 1px 2px rgba(20,22,26,.05), 0 8px 24px -14px rgba(20,22,26,.18);
  --side:#12151A; --side2:#1E232B; --side3:#2A313B;
  --track:#EDEAE4; --thead:#FAF8F5; --hover:#FAF8F5;
  --sel-bg:#16181C; --sel-fg:#FFFFFF; --toast:#16181C;
  --prog:rgba(0,0,0,.08);
  --green:var(--ok); --red:var(--no); --ochre:var(--a);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.02em;font-weight:600}
button{font-family:inherit;font-size:13px;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
/* ═══ ЮҚОРИ ПАНЕЛ ═══ */
.tbar{position:fixed;top:0;left:0;right:0;height:var(--tb);z-index:95;display:flex;
  align-items:center;gap:8px;padding:0 12px;background:var(--side);
  border-bottom:1px solid rgba(255,255,255,.07)}
.tbic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#C2C9D2;
  transition:.15s}
.tbic:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.16)}
.tbic svg{width:19px;height:19px}
.tbic i{display:block;width:17px;height:1.9px;border-radius:2px;background:currentColor;
  transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .18s}
.burger{flex-direction:column;gap:4px;display:flex;align-items:center;justify-content:center}
body:not(.yopiq) .burger i:nth-child(1){transform:translateY(5.9px) rotate(45deg)}
body:not(.yopiq) .burger i:nth-child(2){opacity:0}
body:not(.yopiq) .burger i:nth-child(3){transform:translateY(-5.9px) rotate(-45deg)}
.tbmid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  gap:9px;pointer-events:none}
.tbmid b{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:17px;color:#fff;
  letter-spacing:.14em}
.tbmid .tbn{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6E757E;
  border-left:1px solid rgba(255,255,255,.12);padding-left:9px;white-space:nowrap}
.tbong{margin-left:auto;display:flex;gap:7px;align-items:center}
.tblive{display:flex;align-items:center;gap:7px;font-size:11px;color:#6E757E;
  padding-right:6px;white-space:nowrap}

.app{display:block;height:calc(100vh - var(--tb));margin-top:var(--tb);
  overflow:hidden;position:relative}
.ovl{position:fixed;inset:var(--tb) 0 0 0;z-index:80;background:rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transition:.24s;backdrop-filter:blur(2px)}

/* ═══ ЧАП ПАНЕЛ ═══ */
.side{position:fixed;top:var(--tb);left:0;bottom:0;width:var(--sw);z-index:85;
  background:var(--side);color:#D7D3CC;display:flex;flex-direction:column;
  padding:16px 14px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.05);
  transform:translateX(0);transition:transform .3s cubic-bezier(.22,1,.36,1)}
body.yopiq .side{transform:translateX(-101%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 20px}
.bm{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--a2),var(--a));color:#1A1206;
  font-family:Archivo;font-weight:700;font-size:11.5px;letter-spacing:.02em;
  box-shadow:0 3px 10px -2px rgba(224,160,72,.45)}
.bt{font-family:Archivo;font-weight:600;font-size:14.5px;line-height:1.2;color:#fff}
.bs{font-size:10px;color:#6E757E;letter-spacing:.11em;text-transform:uppercase;margin-top:2px}

.pswitch{display:flex;flex-direction:column;gap:2px;background:var(--side2);
  border-radius:12px;padding:4px;margin-bottom:6px}
.pswitch button{border:none;background:none;color:#8A919B;padding:10px;border-radius:9px;
  font-size:12.5px;font-weight:500;transition:.14s;text-align:center}
.pswitch button:hover{color:#fff;background:rgba(255,255,255,.04)}
.pswitch button.on{background:linear-gradient(145deg,var(--a2),var(--a));color:#1A1206;font-weight:600;
  box-shadow:0 3px 10px -3px rgba(224,160,72,.5)}

.nl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#5C636C;padding:18px 10px 8px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;
  color:#9AA1AB;font-size:13.5px;border:none;background:none;width:100%;text-align:left;
  transition:.14s;position:relative}
.ni:hover{background:var(--side2);color:#fff}
.ni.on{background:var(--side2);color:#fff;font-weight:500}
.ni.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--a)}
.ni .ik{display:grid;place-items:center;flex-shrink:0}
.ni .nt{flex:1;min-width:0}
.nson{margin-left:auto;font-style:normal;font-family:"JetBrains Mono",monospace;
  font-size:11px;font-weight:600;color:#6E757E;background:rgba(255,255,255,.05);
  border-radius:7px;padding:2px 7px;min-width:24px;text-align:center;transition:.14s}
.ni.on .nson{color:var(--a);background:rgba(224,160,72,.14)}
.ni svg{width:18px;height:18px}
.ni.on .ik{color:var(--a)}
.sf{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.live{display:flex;align-items:center;gap:8px;font-size:11px;color:#5C636C;padding:9px 11px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(78,203,146,.15);animation:p 2.6s infinite}
.dot.bad{background:var(--no);box-shadow:0 0 0 3px rgba(240,121,110,.15);animation:none}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══ АСОСИЙ МАЙДОН ═══ */
.main{height:100%;overflow-y:auto;padding:26px 30px 70px;min-width:0;background:var(--bg);margin-left:var(--sw);transition:margin-left .3s cubic-bezier(.22,1,.36,1)}
body.yopiq .main{margin-left:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;margin-bottom:22px;min-width:0}
h1{font-size:27px;overflow-wrap:anywhere;line-height:1.15}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seg{display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 13px;color:var(--muted);
  border-radius:8px;white-space:nowrap;transition:.13s;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
input{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:var(--ink);max-width:100%;transition:.13s}
input:focus{border-color:var(--a-line);outline:none}
input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:11px;
  display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap;transition:.13s}
.btn:hover{border-color:var(--line2);background:var(--card2)}
.btn svg{width:15px;height:15px}
.btn-o{background:linear-gradient(145deg,var(--a2),var(--a));border-color:transparent;
  color:#1A1206;font-weight:600}
.btn-o:hover{filter:brightness(1.07)}
.sanaqut{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:5px 7px}

/* ═══ МЕТРИКА КАРТАЛАРИ ═══ */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.met{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 19px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.met::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.met-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.met-v{font-size:29px;font-weight:600;margin-top:9px;letter-spacing:-.035em;line-height:1.05;
  font-family:Archivo,Inter,sans-serif}
.met-d{font-size:11.5px;color:var(--muted);margin-top:5px}
.met.k::after{background:var(--ok)} .met.k .met-v{color:var(--ok)}
.met.c::after{background:var(--no)} .met.c .met-v{color:var(--no)}
.met.o::after{background:var(--a)}  .met.o .met-v{color:var(--a)}
.mprog{height:5px;border-radius:5px;background:var(--prog);margin-top:12px;overflow:hidden}
.mprog i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ═══ БЎЛИМ САРЛАВҲАСИ ═══ */
.sec{margin:30px 0 13px}
.sec h2{font-size:16px;letter-spacing:-.015em}
.sec p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:19px 21px;min-width:0;box-shadow:var(--sh)}
.eb{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;font-weight:600}

/* ═══ УСТУНЛИ РЎЙХАТ ═══ */
.bl{display:flex;flex-direction:column;gap:13px}
.bi{display:grid;grid-template-columns:172px 1fr 92px;gap:14px;align-items:center;min-width:0}
.bn{font-size:13px;line-height:1.3;overflow:hidden;min-width:0;overflow-wrap:anywhere;font-weight:500}
.bn small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;margin-top:2px}
.btr{height:9px;border-radius:6px;background:var(--track);overflow:hidden;min-width:0}
.bfl{height:100%;border-radius:6px;min-width:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bv{text-align:right;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bv small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:0}
.rjtr{height:22px;border-radius:8px;background:var(--track);position:relative;overflow:hidden}
.rjfl{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rjmark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55;border-radius:2px}

/* ═══ ЧИЗМА ═══ */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--muted)}
.chart .vt{fill:var(--ink);font-weight:700;font-size:10.5px}
.chart .pt{fill:var(--a)} .chart .ln{stroke:var(--a)}
.chart .dt{fill:var(--ink);font-family:Archivo;font-size:19px;font-weight:600}
.chart .dl{fill:var(--muted);font-family:Inter;font-size:9px}
.gl{stroke:var(--line);stroke-width:1}
.dwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;max-width:100%;min-width:0}
.dwrap::-webkit-scrollbar{height:7px}
.dwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.dch{display:block;height:auto}
.dch text{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--muted)}
.dch .vt{fill:var(--ink);font-weight:700;font-size:10.5px}
.dch .bar{fill:var(--a);opacity:.9} .dch .bar.top{fill:var(--ok);opacity:1}
.dch .mkir{fill:var(--ok)} .dch .mchi{fill:var(--no)}
.mlg{display:flex;gap:18px;font-size:11.5px;color:var(--muted);margin-top:10px;align-items:center}
.mlg i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.mkirb{background:var(--ok)} .mchib{background:var(--no)}
.surish{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:7px}
.surish svg{width:13px;height:13px;flex-shrink:0}
.davrq{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:16px;flex-wrap:wrap}
.davrq .oz{font-size:12px;color:var(--muted)}

/* ═══ КАРТОЧКАЛАР ═══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;cursor:pointer;transition:.16s;text-align:left;position:relative;
  display:flex;flex-direction:column;box-shadow:var(--sh)}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card.sel{border-color:var(--a-line);background:var(--card2);
  box-shadow:0 0 0 1px var(--a-line), 0 10px 28px -14px rgba(224,160,72,.4)}
.cn{font-size:13.5px;font-weight:600;line-height:1.3;padding-right:26px}
.cm{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.cq{margin-top:auto;padding-top:13px;display:flex;align-items:baseline;gap:6px}
.cq b{font-size:23px;font-weight:600;font-family:Archivo;letter-spacing:-.03em}
.cq span{font-size:11px;color:var(--muted)}
.cbar{height:4px;border-radius:4px;background:var(--track);margin-top:11px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rank{position:absolute;top:14px;right:15px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:var(--muted)}

/* ═══ ДЕТАЛ ═══ */
.detail{background:var(--card);border:1px solid var(--a-line);border-radius:var(--r);
  margin-top:18px;overflow:hidden;min-width:0;box-shadow:var(--sh)}
.dh{display:flex;gap:18px;padding:20px 21px;border-bottom:1px solid var(--line);
  align-items:flex-start;flex-wrap:wrap;background:var(--card2)}
.dm{flex:1;min-width:0}
.dh h3{font-size:18px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{font-size:11px;padding:5px 11px;border-radius:9px;background:var(--bg2);
  border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.chip.k{background:var(--ok-dim);border-color:var(--ok-line);color:var(--ok)}.chip.k b{color:var(--ok)}
.chip.c{background:var(--no-dim);border-color:var(--no-line);color:var(--no)}.chip.c b{color:var(--no)}
.dbody{padding:19px 21px;min-width:0}
.dbody+.dbody{border-top:1px solid var(--line)}

/* ═══ МАТРИЦА ═══ */
.mw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;min-width:0}
.mw::-webkit-scrollbar{height:7px}
.mw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.mx{border-collapse:separate;border-spacing:4px;font-size:12px}
.mx th{font-weight:500;color:var(--muted);font-size:10.5px;padding:4px 7px;
  text-align:center;white-space:nowrap}
.mx th.hd{text-align:left;min-width:164px;position:sticky;left:0;background:var(--card);z-index:1}
.cell{min-width:54px;height:36px;border-radius:9px;display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600}
.rn{display:flex;align-items:center;gap:9px;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lg{display:flex;gap:16px;padding-top:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.lg i{width:22px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:6px}

/* ═══ ЖАДВАЛ ═══ */
.tw{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;min-width:800px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:12px 15px;border-bottom:1px solid var(--line);
  background:var(--thead);white-space:nowrap}
.tbl td{padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--hover)}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.pill.kel{background:var(--no-dim);border-color:var(--no-line);color:var(--no)}

/* ═══ ХАБАРЛАР ═══ */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:40px 22px;
  text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:5px;
  font-family:Archivo}

.met,.panel,.card,.kk,.detail,.tw,.fizoh,.tsh{animation:kir .42s cubic-bezier(.22,1,.36,1) both}
.mets .met:nth-child(2){animation-delay:.05s}

.kgrid .kk:nth-child(n+5){animation-delay:.2s}
.grid .card:nth-child(n+3){animation-delay:.06s}
.grid .card:nth-child(n+7){animation-delay:.12s}

.bl .bi:nth-child(4){animation-delay:.12s} .bl .bi:nth-child(5){animation-delay:.16s}
.bl .bi:nth-child(n+6){animation-delay:.2s}

<script>
/* ══════════════════════════════════════════════════════
   1. СОЗЛАМА — фақат шу икки қаторни тўлдирасиз
   ══════════════════════════════════════════════════════ */

// Сотув жадвали (интенсив + коуч)
var API   = 'https://script.google.com/macros/s/AKfycbxU50MkZBDmgxKrWW9XnKLldouq7u-o-lexMwsDNSxulZ-yqWCznrzFJg9qNQUVxwNtWw/exec';
var KALIT = 'sotuv-2026-BUNI-OZGARTIRING-1a2b3c';

// Молия жадвали («Финансе орг») — Moliya.gs дан чиққан ҳавола
var API_MOLIYA   = 'https://script.google.com/macros/s/AKfycbzeYH2CQKzncHrRxp0dn8ClEHj6FibbkzvrmOp5r-mCISC8I7iZkhRoRvWkED0QPpr3hw/exec';
var KALIT_MOLIYA = 'moliya-2026-BUNI-OZGARTIRING-9z8y7x';

// ── Маркетинг (алоҳида жадвал, алоҳида Apps Script) ──
var API_MARKETING   = 'https://script.google.com/macros/s/AKfycbwiVKenlzSr9oUA-T-PiZMlNVoVZUlveIH82mCYFpsqt_OAigzt0etZJexq58052WNY/exec';
var KALIT_MARKETING = 'marketing-2026-BUNI-OZGARTIRING-5k4j3h';

/* Сунъий интеллект (RBA AI 3.0) — AI.gs деплойи */
var API_AI   = 'https://script.google.com/macros/s/AKfycbw0KmelTqx6XC-oql_YuvM9S-UMNByLospSMjSfv4Cv2671ABwz5N6p3UVbol477Ru2/exec';
var KALIT_AI = 'ai-2026-BUNI-OZGARTIRING-7r6t5y';


/* ══════════════════════════════════════════════════════
   2. ҲОЛАТ — илова нимани кўрсатиб турибди
   ══════════════════════════════════════════════════════ */

var D = null;                 // сервердан келган маълумот
var S = {
  prod:    'praktikum',       // қайси продукт: praktikum | kouch | moliya
  valyuta: 'UZS',             // молияда: UZS | USD
  sahifa:  'umumiy',          // қайси бўлим
  oraliq:  'hammasi',         // сана фильтри
  davr:    'kun',             // динамика қадами: kun | hafta | oy
  dan:null, gacha:null, tmpDan:'', tmpGacha:'',
  ochiq:   null,              // очилган карточка номи
  qidiruv: '',
  target:  'hammasi',         // маркетинг: қайси таргетолог
  eski:false, xato:null, band:false, mBand:false, kBand:false, aBand:false, yangi:false
};

var PROD_NOM={praktikum:'3 кунлик',kouch:'Коучинг',ai:'Сунъий интеллект',
              moliya:'Молия',marketing:'Маркетинг'};

var XOT='rba_sotuv_v2', TEMA='rba_tema_v1', MENYU='rba_menyu_v1';
var main=document.getElementById('main');
var RANG=['#C87A21','#2E7D5B','#2F5C8F','#B33A32','#6B5B95','#7A5236','#D9A22B','#3E7D53','#8B8880','#D77B96'];
var RANG_Q=['#E8A244','#4FC091','#5E9BD6','#E8776D','#A08FD0','#C08B5E','#EFC55A','#6BCBA0','#B0ABA1','#EC9BB2'];


/* ══════════════════════════════════════════════════════
   3. КИЧИК ЁРДАМЧИЛАР
   ══════════════════════════════════════════════════════ */

function fmt(n){ return Math.round(n).toLocaleString('ru-RU').replace(/[\u00a0\s]/g,'\u202f') }
function pul(n){ return '$'+fmt(n) }
function foiz(a,b){ return b?Math.round(a/b*100):0 }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function qoraMi(){ return !document.body.classList.contains('oq') }

/**
 * Сервер маълумотни сиқилган ҳолда юборади: устун номлари ҳар қаторда
 * такрорланмайди, такрорланувчи матнлар эса луғатга чиқарилган.
 * Шу сабаб юклаш ~10 баравар тез. Бу функция уни очади.
 */
function paketOch(p){
  if(!p) return [];
  if(Array.isArray(p)) return p;              // эски формат — шундайлигича
  if(!p.q || !p.m) return [];
  var m=p.m, lugM=p.lugM||[], lug=p.lug||{};
  var lugat={}, i;
  for(i=0;i<lugM.length;i++) lugat[lugM[i]]=lug[lugM[i]]||[];
  return p.q.map(function(r){
    var o={};
    for(var j=0;j<m.length;j++){
      var k=m[j], v=r[j];
      o[k]= lugat[k] ? (lugat[k][v]||'') : v;
    }
    return o;
  });
}
function rang(i){ var l=qoraMi()?RANG_Q:RANG; return l[i%l.length] }

function sanaOqi(v){
  if(!v) return null;
  var m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  var d=new Date(v); return isNaN(d)?null:d;
}
function dfmt(s){ var d=sanaOqi(s); if(!d) return '—';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear() }
function dqisqa(s){ var d=sanaOqi(s); if(!d) return '';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2) }


/* ══════════════════════════════════════════════════════
   4. МАЪЛУМОТ — сервер билан алоқа
   ══════════════════════════════════════════════════════ */

/** Молия API созланганми */
function moliyaUlangan(){ return API_MOLIYA.indexOf('BU_YERGA')<0 }
function markUlangan(){ return API_MARKETING.indexOf('BU_YERGA')<0 }
function aiUlangan(){ return API_AI.indexOf('BU_YERGA')<0 }

async function bittaYukla(url){
  var r=await fetch(url);
  var j=await r.json();
  if(!j.ok) throw new Error(j.xato||'Сервер хатоси');
  return j;
}

/**
 * Сотув маълумотини юклайди.
 * Молия АЛОҲИДА ва фақат керак бўлганда юкланади — шунинг учун
 * илова биринчи очилишда анча тез ишга тушади.
 */
async function yukla(jim){
  if(S.band) return;
  S.band=true;
  if(!jim && !D) main.innerHTML='<div class="load"><div class="spin"></div>Маълумот юкланмоқда…</div>';
  belgi(true);

  try{
    var j=await bittaYukla(API+'?amal=baza&kalit='+encodeURIComponent(KALIT)+(S.yangi?'&yangi=1':''));
    // v3 сиқилган формат
    if(j.praktikumP){ j.praktikum=paketOch(j.praktikumP); delete j.praktikumP }
    if(j.kouchP){     j.kouch=paketOch(j.kouchP);         delete j.kouchP }
    // Молия аввал юкланган бўлса, сақлаб қоламиз
    if(D){ j.moliya=D.moliya; j.moliyaTashxis=D.moliyaTashxis;
           j.moliyaVersiya=D.moliyaVersiya; j.moliyaXato=D.moliyaXato;
           j.marketing=D.marketing; j.markTashxis=D.markTashxis;
           j.markVersiya=D.markVersiya; j.markXato=D.markXato;
           j.ai=D.ai; j.aiReja=D.aiReja; j.aiVersiya=D.aiVersiya; j.aiXato=D.aiXato }
    D=j; S.xato=null; S.eski=false;
    aloqa(true,D.vaqt);
    saqla();
  }catch(e){
    if(D){ S.eski=true } else { S.xato=e.message }
    aloqa(false);
  }

  S.band=false; belgi(false); chiz();
  if(moliyaMi()) moliyaYukla();
  if(markMi())   markYukla();
  if(aiMi())     aiYukla();
}

/** Сунъий интеллект маълумоти — фақат шу бўлим очилганда */
async function aiYukla(majburiy){
  if(!aiUlangan() || S.aBand) return;
  if(D && D.ai && !majburiy) return;
  S.aBand=true; belgi(true); chiz();
  try{
    var j=await bittaYukla(API_AI+'?amal=baza&kalit='+encodeURIComponent(KALIT_AI)+(S.yangi?'&yangi=1':''));
    D.ai=j.sotuvP ? paketOch(j.sotuvP) : (j.sotuv||[]);
    D.aiReja=j.reja||[];
    D.aiVersiya=j.versiya||null;
    D.aiXato=null;
  }catch(e){
    D.aiXato=e.message;
    D.ai=D.ai||[];
  }
  S.aBand=false; belgi(false); saqla(); chiz();
}

/** Маркетинг маълумоти — фақат бир марта, «Маркетинг» очилганда */
async function markYukla(majburiy){
  if(!markUlangan() || S.kBand) return;
  if(D && D.marketing && !majburiy) return;
  S.kBand=true; belgi(true); chiz();
  try{
    var j=await bittaYukla(API_MARKETING+'?amal=lid&kalit='+encodeURIComponent(KALIT_MARKETING)+(S.yangi?'&yangi=1':''));
    D.marketing=j.lidlarP ? paketOch(j.lidlarP) : (j.lidlar||[]);
    D.markTashxis=j.tashxis||null;
    D.markVersiya=j.versiya||null;
    D.markXato=null;
  }catch(e){
    D.markXato=e.message;
    D.marketing=D.marketing||[];
  }
  S.kBand=false; belgi(false); saqla(); chiz();
}

/** Молия маълумоти — фақат бир марта, «Молия» очилганда */
async function moliyaYukla(majburiy){
  if(!moliyaUlangan() || S.mBand) return;
  if(D && D.moliya && !majburiy) return;          // аллақачон бор
  S.mBand=true; belgi(true); chiz();
  try{
    var j=await bittaYukla(API_MOLIYA+'?amal=moliya&kalit='+encodeURIComponent(KALIT_MOLIYA)+(S.yangi?'&yangi=1':''));
    D.moliya=j.moliyaP ? paketOch(j.moliyaP) : (j.moliya||[]);
    D.moliyaTashxis=j.tashxis||null;
    D.moliyaVersiya=j.versiya||null;
    D.moliyaXato=null;
  }catch(e){
    D.moliyaXato=e.message;
    D.moliya=D.moliya||[];
  }
  S.mBand=false; belgi(false); saqla(); chiz();
}

function saqla(){
  try{ localStorage.setItem(XOT,JSON.stringify(D)) }catch(e){}
}

function belgi(on){ document.getElementById('yukIndikator').style.display=on?'':'none' }

function aloqa(ok,vaqt){
  document.getElementById('dot').className='dot'+(ok?'':' bad');
  document.getElementById('liveT').textContent=ok?('янгиланди '+String(vaqt||'').slice(11)):'алоқа йўқ';
}

function boshla(){
  var bor=null;
  try{ bor=JSON.parse(localStorage.getItem(XOT)||'null') }catch(e){}
  if(bor){ D=bor; S.eski=true; chiz(); aloqa(true,''); }
  yukla(!!bor);
}


/* ══════════════════════════════════════════════════════
   5. ҲИСОБ — сана фильтри, гуруҳлаш, жамлаш
   ══════════════════════════════════════════════════════ */

function praktikumMi(){ return S.prod==='praktikum' }

/** Жорий продукт учун кесим: практикумда — шаҳар, коучда — продукт */
function kesim(){
  return praktikumMi()
    ? { nom:'Шаҳар',   ol:function(x){ return x.joy } }
    : { nom:'Продукт', ol:function(x){ return x.produkt } };
}

/** Сана фильтридан ўтган қаторлар */
/**
 * Сана фильтри — ҳамма бўлимда шу битта функция ишлатилади.
 * (Сотув, молия, маркетинг — учаласи учун бир хил мантиқ.)
 */
function sanaFiltrla(barcha){
  if(!barcha || !barcha.length) return [];
  if(S.oraliq==='hammasi') return barcha;

  var bugun=new Date(); bugun.setHours(0,0,0,0);
  var dan=bugun, gacha=new Date(2099,0,1);

  if(S.oraliq==='kun'){                 // бугун
    dan=bugun; gacha=bugun;
  }
  if(S.oraliq==='kecha'){               // фақат кечаги кун
    dan=new Date(bugun); dan.setDate(dan.getDate()-1);
    gacha=new Date(dan);
  }
  if(S.oraliq==='oy'){                  // шу ойнинг 1-санасидан бугунгача
    dan=new Date(bugun.getFullYear(), bugun.getMonth(), 1);
    gacha=bugun;
  }
  if(S.oraliq==='oraliq'){
    dan   = S.dan   ? sanaOqi(S.dan)   : new Date(2000,0,1);
    gacha = S.gacha ? sanaOqi(S.gacha) : new Date(2099,0,1);
  }
  return barcha.filter(function(x){
    var s=sanaOqi(x.sana); if(!s) return true;
    s.setHours(0,0,0,0);
    return s>=dan && s<=gacha;
  });
}

function satrlar(){
  if(!D) return [];
  return sanaFiltrla((praktikumMi()?D.praktikum:D.kouch)||[]);
}

/** Жами: сони, суммалар, келмаганлар */
function jam(l){
  var o={soni:0,kelishuv:0,tolangan:0,qarz:0,kelmagan:0};
  l.forEach(function(x){
    o.soni+=(x.kishi||1);
    o.kelishuv+=x.kelishuv; o.tolangan+=x.tolangan; o.qarz+=x.qarz;
    if(x.kelmagan) o.kelmagan++;
  });
  return o;
}

/** Калит бўйича гуруҳлаб, кўпдан озга тартиблайди */
function guruhla(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,soni:0,tolangan:0,qarz:0,satrlar:[]}; t.push(k) }
    var g=m[k];
    // «Нечи киши» бўлса ўша қўшилади (сунъий интеллект), акс ҳолда 1
    g.soni+=(x.kishi||1); g.tolangan+=x.tolangan; g.qarz+=x.qarz;
    g.satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.soni-a.soni });
}

/**
 * КОНВЕРСИЯ — «menedjer konversiya» варағидан олинади.
 * Илова ўзи ҳисобламайди: варақдаги формула ягона манба,
 * шунинг учун бу ердаги рақам Google Sheets билан доим бир хил бўлади.
 * Сана фильтрига боғлиқ эмас — варақда қандай бўлса, шундай.
 */
function konversiya(menejerNomi){
  var l=(D&&D.konversiya)||[];
  for(var i=0;i<l.length;i++)
    if(l[i].menejer===menejerNomi) return l[i].sotuv ? l[i] : null;
  return null;
}

/** 88.235 → «88.2%», 100 → «100%» */
function konvMatn(k){
  if(!k) return null;
  var f=k.foiz;
  return (Math.abs(f-Math.round(f))<0.05 ? Math.round(f) : f.toFixed(1))+'%';
}

/** Ном бошидаги рақам: «6 Тошкент» → 6. Рақамсиз бўлса 999. */
function raqam(nom){
  var m=String(nom).match(/^\s*(\d+)/);
  return m ? +m[1] : 999;
}

/** Локацияларни 1,2,3… тартибида (рақамсизларни сотув сони бўйича) */
function tartibla(l){
  return l.slice().sort(function(a,b){
    var f=raqam(a.nom)-raqam(b.nom);
    return f!==0 ? f : b.soni-a.soni;
  });
}

function tadbir(nom){
  var l=(D&&D.tadbirlar)||[];
  for(var i=0;i<l.length;i++) if(l[i].nom===nom) return l[i];
  return null;
}
/** Шаҳар остидаги изоҳ: «19 кун қолди» ёки «бўлиб ўтди» */
function kunIzoh(nom){
  var t=praktikumMi()?tadbir(nom):null;
  if(!t) return '';
  return t.otdi?'бўлиб ўтди':t.kun+' кун қолди';
}


/* ══════════════════════════════════════════════════════
   6. ЧИЗМАЛАР — 3 хил, бошқа йўқ
   ══════════════════════════════════════════════════════ */

/** Горизонтал устунлар рўйхати */
function ustunlar(l){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var max=Math.max.apply(null,l.map(function(x){ return x.qiy }))||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+(x.ost?'<small>'+esc(x.ost)+'</small>':'')+'</div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.qiy/max*100)+'%;background:'+rang(i)+'"></div></div>'+
      '<div class="bv">'+fmt(x.qiy)+(x.ong?'<small>'+esc(x.ong)+'</small>':'')+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

/** Режа ва факт: яшил тўлдириш + қора чизиқ = режа даражаси */
function rejaUstun(l){
  if(!l.length) return '<div class="empty"><b>Режа киритилмаган</b>«план» варағини тўлдиринг</div>';
  var max=Math.max.apply(null,l.map(function(x){ return Math.max(x.reja,x.fakt) }))||1;
  l=l.slice().sort(function(a,b){ return raqam(a.rop)-raqam(b.rop) });
  return '<div class="bl">'+l.map(function(x){
    var f=foiz(x.fakt,x.reja);
    var r=f>=100?'var(--green)':f>=60?'var(--ochre)':'var(--red)';
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.rop)+'<small>режа '+fmt(x.reja)+' · қолди '+fmt(Math.max(0,x.reja-x.fakt))+'</small></div>'+
      '<div class="rjtr"><div class="rjfl" style="width:'+Math.max(1,x.fakt/max*100)+'%;background:'+r+'"></div>'+
      '<div class="rjmark" style="left:calc('+Math.min(99,Math.max(1,x.reja/max*100)).toFixed(1)+'% - 1px)"></div></div>'+
      '<div class="bv" style="color:'+r+'">'+fmt(x.fakt)+'<small>'+f+'%</small></div></div>';
  }).join('')+'</div>';
}

/** Санани танланган қадамга (кун / ҳафта / ой) қисқартиради */
var OYLAR=['янв','фев','март','апр','май','июн','июл','авг','сент','окт','ноя','дек'];

function davrKalit(sana){
  var d=sanaOqi(sana); if(!d) return null;
  if(S.davr==='oy')
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-01';
  if(S.davr==='hafta'){
    var m=new Date(d), dush=(m.getDay()+6)%7;         // ҳафта душанбадан бошланади
    m.setDate(m.getDate()-dush);
    return m.getFullYear()+'-'+('0'+(m.getMonth()+1)).slice(-2)+'-'+('0'+m.getDate()).slice(-2);
  }
  return String(sana).slice(0,10);
}

function davrYorliq(k){
  var d=sanaOqi(k); if(!d) return k;
  if(S.davr==='oy') return OYLAR[d.getMonth()]+' '+String(d.getFullYear()).slice(2);
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2);
}

/**
 * Сотув динамикаси — ҳар бир сана алоҳида устун.
 * Кенглик саналар сонига қараб ўсади, сиғмагани чапга сурилиб кўрилади.
 * Шунинг учун БАРЧА саналар ёрлиғи билан чиқади, ҳеч бири тушиб қолмайди.
 */
/**
 * Силлиқ эгри чизиқ (Catmull-Rom → безье).
 * Нуқталарни синиқ эмас, юмшоқ тўлқин қилиб боғлайди.
 */
function egri(nuq){
  if(nuq.length<2) return nuq.length?('M'+nuq[0][0]+' '+nuq[0][1]):'';
  var d='M'+nuq[0][0].toFixed(1)+' '+nuq[0][1].toFixed(1);
  for(var i=0;i<nuq.length-1;i++){
    var p0=nuq[i-1]||nuq[i], p1=nuq[i], p2=nuq[i+1], p3=nuq[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+
       ','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}

function dinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={soni:0,pul:0}; t.push(k) }
    m[k].soni+=(x.kishi||1); m[k].pul+=(x.tolangan||0);
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда сотув йўқ');
  if(t.length===1)
    return '<div class="bittakun"><b class="num">'+m[t[0]].soni+'</b>'+
           '<span>'+davrYorliq(t[0])+' — шу битта кунда</span></div>';

  var slot = S.davr==='kun' ? 26 : 52;
  var chap = 42, ong = 20, tep = 28, past = 54;
  var W = Math.max(560, chap+ong+slot*(t.length-1)), H = 224;
  var max = 1;
  t.forEach(function(k){ if(m[k].soni>max) max=m[k].soni });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+fmt(Math.round(max*f))+'</text>';
  });

  var nuq=t.map(function(k,i){ return [X(i),Y(m[k].soni)] });
  var yol=egri(nuq);
  var maydon=yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+'L'+X(0).toFixed(1)+' '+(H-past)+'Z';

  var qadam=Math.max(1,Math.ceil(t.length/12));
  var belgi='',yorliq='';
  t.forEach(function(k,i){
    var x=X(i), y=Y(m[k].soni), eng=(m[k].soni===max);
    if(t.length<=30 || i%qadam===0 || i===t.length-1 || eng){
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(eng?4.6:3.2)+
        '" fill="var(--a)" style="animation-delay:'+(0.5+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+': '+m[k].soni+' та</title></circle>';
      if(eng) belgi+='<text class="vt" x="'+x.toFixed(1)+'" y="'+(y-12).toFixed(1)+
        '" text-anchor="middle">'+m[k].soni+'</text>';
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
    }
  });

  var id='g'+Math.floor(Math.random()*1e6);
  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" style="stop-color:var(--a);stop-opacity:.42"/>'+
      '<stop offset="100%" style="stop-color:var(--a);stop-opacity:0"/></linearGradient></defs>'+
    tor+
    '<path class="aarea" d="'+maydon+'" fill="url(#'+id+')"/>'+
    '<path class="aline" d="'+yol+'" fill="none" stroke="var(--a)" stroke-width="2.6" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    belgi+yorliq+'</svg></div>'+
    (W>620 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Чизма тепасидаги Кун / Ҳафта / Ой тугмалари ва қисқа хулоса */
function davrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+(x.kishi||1);
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг фаол: '+davrYorliq(eng)+' \u2014 '+m[eng]+' та сотув' : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}

  if(S.oraliq==='oraliq') h+='<div class="sanaqut">'+
    '<input type="date" id="dan" value="'+esc(S.tmpDan)+'"><span style="color:var(--muted)">—</span>'+
    '<input type="date" id="gacha" value="'+esc(S.tmpGacha)+'">'+
    '<button class="btn btn-o" id="qollaBtn">Қўллаш</button></div>';
  return h;
}

/* Режим ва янгилаш тугмалари юқори панелга кўчди */
function mobilTugma(){ return '' }

/* Продукт тугмалари энди фақат чап менюда — сарлавҳа устида такрорланмайди */
function produktSwitch(){ return '' }

function eskiBelgi(){
  if(!S.eski) return '';
  return '<div class="eski"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
    '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>'+
    '<span>Сақланган ҳолат кўрсатилмоқда</span><button id="eskiYangila">Янгилаш</button></div>';
}

function sarlavha(h1,izoh,asbob){
  return produktSwitch()+
    '<div class="head"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(izoh)+'</div></div>'+
    '<div class="tools">'+(asbob||'')+'</div></div>'+eskiBelgi();
}

/** Бўш ҳолат — сана фильтри сабаб бўлса, дарҳол тузатиш тугмаси чиқади */
function bosh(matn){
  var h='<div class="empty"><b>'+esc(matn)+'</b>';
  if(S.oraliq!=='hammasi')
    h+='Сана фильтри торайтириб турибди.'+
       '<div style="margin-top:11px"><button class="btn btn-o" data-o="hammasi">Ҳаммасини кўрсатиш</button></div>';
  return h+'</div>';
}

function bolim(nom,izoh,ichi){
  return '<div class="sec"><h2>'+esc(nom)+'</h2><p>'+esc(izoh)+'</p></div><div class="panel">'+ichi+'</div>';
}

/** Сана бўйича гуруҳланган сотувлар — деталда ва телефонда ишлатилади */
function kunlikRoyxat(l){
  if(!l.length) return '<div class="empty">Сотув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],sm=0; lst.forEach(function(x){ sm+=x.tolangan });
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+lst.length+' та · '+pul(sm)+'</span></div>'+
      lst.map(function(x){
        var teg=praktikumMi()?x.joy:x.produkt;
        return '<div class="jkart"><div class="jchap">'+
          '<div class="jnom">'+esc(x.fio||'—')+'</div>'+
          '<div class="jmeta">'+esc(teg||'')+'</div></div>'+
          '<div class="jong"><div class="jmiq">'+pul(x.tolangan)+'</div>'+
          '<div class="jxod">'+esc(x.menejer||'—')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}


/* ══════════════════════════════════════════════════════
   8. БЎЛИМ 1 — УМУМИЙ
   «Режа қандай бажарилаяпти?»
   ══════════════════════════════════════════════════════ */

function umumiySahifa(){
  var l=satrlar(), j=jam(l);
  var reja=(D.reja&&D.reja[S.prod])||[];
  var rJami=0,fJami=0;
  reja.forEach(function(x){ rJami+=x.reja; fJami+=x.fakt });
  var b=foiz(fJami,rJami);

  return sarlavha(
    praktikumMi()?'3 кунлик — умумий':'Коучинг — умумий',
    'Режа, сотув сони ва пул ҳолати',
    sanaFiltr()+mobilTugma()) +

  '<div class="mets">'+
    '<div class="met o"><div class="met-l">Режа</div><div class="met-v num">'+fmt(rJami)+'</div>'+
      '<div class="met-d">факт '+fmt(fJami)+' · қолди '+fmt(Math.max(0,rJami-fJami))+
        ' <span style="opacity:.7">(«план» варағидан)</span></div>'+
      '<div class="mprog"><i style="width:'+Math.min(100,b)+'%;background:'+(b>=100?'var(--green)':'var(--ochre)')+'"></i></div></div>'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">танланган даврда</div></div>'+
    '<div class="met k"><div class="met-l">Тўланган</div><div class="met-v num">'+pul(j.tolangan)+'</div>'+
      '<div class="met-d">келишув '+pul(j.kelishuv)+'</div></div>'+
    '<div class="met c"><div class="met-l">Қарздорлик</div><div class="met-v num">'+pul(j.qarz)+'</div>'+
      '<div class="met-d">келишувнинг '+foiz(j.qarz,j.kelishuv)+'%</div></div>'+
  '</div>'+

  bolim('Режа бажарилиши','Ҳар бир РОП бўйича. Қора чизиқ — режа даражаси.',rejaUstun(reja))+
  ropDoira(l)+
  bolim('Сотув динамикаси','Ҳар бир санада нечта сотув бўлган',davrQatori(l)+dinamika(l));
}


/* ══════════════════════════════════════════════════════
   9. БЎЛИМ 2 — МЕНЕЖЕРЛАР
   «Ким қанча сотди ва қаерга?»
   ══════════════════════════════════════════════════════ */

function menejerSahifa(){
  var l=satrlar();
  var men=guruhla(l,function(x){ return x.menejer });
  var korinadi=S.qidiruv
    ? men.filter(function(x){ return x.nom.toLowerCase().indexOf(S.qidiruv.toLowerCase())>=0 })
    : men;
  var max=men.length?men[0].soni:1;
  var ochiq=null;
  men.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var h=sarlavha('Менежерлар','Ким қанча сотган — батафсил учун босинг',
    '<input type="text" id="qid" placeholder="Исм бўйича қидириш" value="'+esc(S.qidiruv)+'" style="width:180px">'+
    sanaFiltr()+mobilTugma());

  h+='<div class="grid">'+(korinadi.length?korinadi.map(function(x){
    var n=men.indexOf(x);
    var kon=konversiya(x.nom);
    var kt=kon ? ' · конверсия '+konvMatn(kon) : '';
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-men="'+esc(x.nom)+'">'+
      '<span class="rank">#'+(n+1)+'</span>'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+pul(x.tolangan)+kt+'</div>'+
      '<div class="cq"><b class="num">'+fmt(x.soni)+'</b><span>та сотув</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.soni/max*100)+'%;background:'+rang(n)+'"></i></div>'+
    '</button>';
  }).join(''):'<div class="empty">Менежер топилмади</div>')+'</div>';

  if(ochiq) h+=menejerDetal(ochiq);

  if(D.konversiya && D.konversiya.length)
    h+='<div class="sub" style="margin:14px 0 0">Конверсия «menedjer konversiya» варағидан олинади '+
       'ва сана фильтрига боғлиқ эмас.</div>';

  h+='<div class="sec"><h2>Умумий жадвал</h2>'+
     '<p>Қаторлар — менежерлар, устунлар — '+esc(kesim().nom.toLowerCase())+'. Катакда сотув сони.</p></div>'+
     '<div class="panel">'+matritsa(l)+'</div>';
  return h;
}

function menejerDetal(o){
  var k=kesim();
  var bolinish=tartibla(guruhla(o.satrlar,k.ol));
  var kon=konversiya(o.nom);
  var konChip = kon
    ? '<span class="chip">Конверсия <b>'+konvMatn(kon)+'</b> · '+
      fmt(kon.sotuv)+' сотув, '+fmt(kon.kelmagan)+' келмаган</span>'
    : '';
  return '<div class="detail">'+
    '<div class="dh"><div class="dm"><h3>'+esc(o.nom)+'</h3>'+
      '<div class="chips">'+
        '<span class="chip">Сотув: <b>'+fmt(o.soni)+'</b></span>'+
        '<span class="chip k">Тўланган <b>'+pul(o.tolangan)+'</b></span>'+
        '<span class="chip c">Қарз <b>'+pul(o.qarz)+'</b></span>'+
        konChip+
      '</div></div>'+
      '<button class="btn" data-yop>Ёпиш</button></div>'+
    '<div class="dbody"><div class="eb">Қаерга сотган</div>'+
      ustunlar(bolinish.map(function(x){
        return {nom:x.nom, qiy:x.soni, ost:kunIzoh(x.nom), ong:pul(x.tolangan)};
      }))+'</div>'+
    '<div class="dbody"><div class="eb">Қачон сотган</div>'+kunlikRoyxat(o.satrlar)+'</div>'+
  '</div>';
}

/** Менежер × шаҳар (ёки продукт) жадвали */
function matritsa(l){
  var k=kesim();
  var men=guruhla(l,function(x){ return x.menejer });
  if(!men.length) return '<div class="empty">Маълумот йўқ</div>';

  var ustun=[];
  l.forEach(function(x){ var v=k.ol(x)||'—'; if(ustun.indexOf(v)<0) ustun.push(v) });
  ustun.sort(function(a,b){
    var f=raqam(a)-raqam(b);
    return f!==0 ? f : String(a).localeCompare(String(b));
  });

  var katak={},max=0;
  l.forEach(function(x){
    var a=(x.menejer||'—')+'|'+(k.ol(x)||'—');
    katak[a]=(katak[a]||0)+1;
    if(katak[a]>max) max=katak[a];
  });

  var h='<div class="mw"><table class="mx"><thead><tr><th class="hd">Менежер</th>';
  ustun.forEach(function(u){ h+='<th>'+esc(u)+'</th>' });
  h+='<th style="padding-left:10px">Жами</th></tr></thead><tbody>';

  men.forEach(function(m,mi){
    var jami=0,td='';
    ustun.forEach(function(u){
      var v=katak[m.nom+'|'+u]||0; jami+=v;
      var bg='var(--z0)',col='var(--z0f)';
      if(v>0){
        var n=v/max;
        if(n>=.6){ bg='var(--z3)'; col='var(--z3f)' }
        else if(n>=.25){ bg='var(--z2)'; col='var(--z2f)' }
        else { bg='var(--z1)'; col='var(--z1f)' }
      }
      td+='<td><div class="cell" style="background:'+bg+';color:'+col+'">'+(v||'·')+'</div></td>';
    });
    h+='<tr><th class="hd"><span class="rn"><i class="sw" style="background:'+rang(mi)+'"></i>'+esc(m.nom)+'</span></th>'+
       td+'<td style="padding-left:10px"><b class="num">'+fmt(jami)+'</b></td></tr>';
  });

  return h+'</tbody></table></div>'+
    '<div class="lg"><span><i style="background:var(--z3)"></i>кўп</span>'+
    '<span><i style="background:var(--z2)"></i>ўртача</span>'+
    '<span><i style="background:var(--z1)"></i>кам</span>'+
    '<span><i style="background:var(--z0)"></i>йўқ</span></div>';
}


/**
 * РОП кесими — иккита доира: сотув сони ва тўланган пул.
 * Кимнинг улуши катталигини бир қарашда кўрсатади.
 */
function ropDoira(l){
  var g=guruhla(l,function(x){ return x.rop });
  if(g.length<2) return '';
  g=g.slice().sort(function(a,b){ return raqam(a.nom)-raqam(b.nom) });

  var soni=g.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} });
  var pull=g.filter(function(x){ return x.tolangan>0 })
            .map(function(x){ return {nom:x.nom,summa:x.tolangan,soni:x.soni} });

  var h='<div class="two" style="margin-top:16px">'+
    '<div><div class="sec" style="margin-top:0"><h2>РОП улуши — сотув сони</h2>'+
      '<p>Ким нечта сотган</p></div>'+
    '<div class="panel">'+mDoira(soni,'var(--green)',function(v){ return fmt(v) })+'</div></div>';
  h+= pull.length
    ? '<div><div class="sec" style="margin-top:0"><h2>РОП улуши — тўланган пул</h2>'+
      '<p>Ким қанча пул киритган</p></div>'+
      '<div class="panel">'+mDoira(pull,'var(--green)',function(v){ return pul(v) })+'</div></div>'
    : '';
  return h+'</div>';
}

   9.5 ХАРИТА — 3 кунлик тадбирлар географияси
   Тўртта давлат: Ўзбекистон, Қозоғистон, Қирғизистон, Тожикистон

/* ── ҲАҚИҚИЙ ДАВЛАТ ЧЕГАРАЛАРИ ──────────────────────────
   Манба: Natural Earth (world.geo.json), соддалаштирилган.
   Проекция: эквидистант, ўрта кенгликка мослаб чўзилган. */
var XARITA_W=752.7, XARITA_H=496.8;

/* Шаҳарлар — ҳақиқий координаталари */
var SHAHAR = [
  {kalit:'шимкент',   nom:'Шимкент',   davlat:'Қозоғистон',  lat:42.32, lon:69.60},
  {kalit:'ош',        nom:'Ош',        davlat:'Қирғизистон', lat:40.53, lon:72.80},
  {kalit:'самарканд', nom:'Самарқанд', davlat:'Ўзбекистон',  lat:39.65, lon:66.96},

  {kalit:'худжанд',   nom:'Хўжанд',    davlat:'Тожикистон',  lat:40.28, lon:69.62},
  {kalit:'хужанд',    nom:'Хўжанд',    davlat:'Тожикистон',  lat:40.28, lon:69.62},
  {kalit:'тошкент',   nom:'Тошкент',   davlat:'Ўзбекистон',  lat:41.31, lon:69.24}
];

var DAVLAT_RANG = {
  'Ўзбекистон':  '#4ECB92',
  'Қозоғистон':  '#5E9BD6',
  'Қирғизистон': '#E8A244',
  'Тожикистон':  '#A08FD0'
};

/**
 * «6 Тошкент» → шаҳар маълумоти.
 * ⚠ Диққат: «тошкент» ичида «ош» бор, шунинг учун ичидан излаш МУМКИН ЭМАС —
 *   фақат тўлиқ мослик текширилади.
 */
function shaharNorm(nom){
  return String(nom||'').toLowerCase()
    .replace(/ў/g,'у').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҳ/g,'х')
    .replace(/ы/g,'и').replace(/ё/g,'е').replace(/й/g,'и')
    .replace(/[\s\d.,\-—]/g,'');
}

function shaharTop(nom){
  var t=shaharNorm(nom);
  if(!t) return null;
  for(var i=0;i<SHAHAR.length;i++)
    if(t===shaharNorm(SHAHAR[i].kalit)) return SHAHAR[i];
  return null;
}


/**
 * Тадбирлар харитаси.
 * Доира катталиги — сотув сони, ранги — давлат.
 * ⚠ Бу схематик харита: шаҳарлар ҳақиқий координаталари бўйича
 *   жойлаштирилган, лекин давлат чегаралари чизилмаган.
 */
/** Координатани харита нуқтасига айлантиради */
function xproy(lon,lat){
  var p=XARITA_PROY;
  return [ (lon-p.lon0)*p.kx, (p.lat1-lat)*p.k ];
}

/**
 * ТАДБИРЛАР ХАРИТАСИ — ҳақиқий давлат чегаралари билан.
 * Шаҳарлар аниқ координатасида туради; ном ва изоҳ ёнига чиқарилиб,
 * бир-бирига халақит бермаслиги учун сурилади (ингичка чизиқ билан боғланади).
 */
function xarita(guruh, mijoz){
  var nuq=[];
  guruh.forEach(function(g){
    var sh=shaharTop(g.nom);
    if(sh) nuq.push({sh:sh, g:g});
  });
  if(!nuq.length) return '';

  var birlik = mijoz ? ' та мижоз' : ' та сотув';
  var W=XARITA_W, H=XARITA_H;
  var max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni; });

  // ── давлатлар ──
  var davKod={'Ўзбекистон':'uz','Қозоғистон':'kz','Қирғизистон':'kg','Тожикистон':'tj'};
  var dav={};
  nuq.forEach(function(x){
    var d=x.sh.davlat;
    if(!dav[d]) dav[d]={nom:d,soni:0,shahar:0};
    dav[d].soni+=x.g.soni; dav[d].shahar++;
  });

  var yer='';
  ['kz','uz','kg','tj'].forEach(function(k,i){
    var nomi=null;
    for(var d in davKod) if(davKod[d]===k) nomi=d;
    var bor=!!dav[nomi];
    yer+='<path class="xyer'+(bor?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(bor?DAVLAT_RANG[nomi]:'var(--line)')+'" '+
      'stroke="'+(bor?DAVLAT_RANG[nomi]:'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+nomi+
      (bor?' — '+fmt(dav[nomi].soni)+birlik:'')+'</title></path>';
  });

  // ── шаҳар нуқталари ──
  var P=nuq.map(function(x){
    var c=xproy(x.sh.lon,x.sh.lat);
    return { x:c[0], y:c[1], r:9+15*Math.sqrt(x.g.soni/max), it:x };
  });

  /* Ёзувни доиранинг ЁНИГА чиқарамиз (тагига эмас) —
     Тошкент, Шимкент ва Хўжанд бир вертикалда тургани учун
     тагига қўйилса устма-уст тушади. */
  P.sort(function(a,b){ return a.y-b.y });
  var ENI=96;                                  // ёзув эгаллайдиган тахминий кенглик
  P.forEach(function(p){
    p.ong = p.x < XARITA_W*0.62;               // ўнгда жой борми
    p.lx = p.ong ? p.x+p.r+10 : p.x-p.r-10;
    p.ly = p.y-1;
  });
  /* Ёзувлар бир-бирини босмаслиги учун вертикал суриб чиқарамиз.
     Чапга ва ўнгга ёзилганлар турли томонга чўзилади, шунинг учун
     фақат lx эмас, ёзувнинг БУТУН эгаллаган жойи солиштирилади. */
  function chap(p){ return p.ong ? p.lx : p.lx-ENI }
  function ong(p){  return p.ong ? p.lx+ENI : p.lx }
  for(var q=0;q<220;q++){
    for(var i=0;i<P.length;i++){
      for(var j=i+1;j<P.length;j++){
        if(chap(P[i])>ong(P[j]) || ong(P[i])<chap(P[j])) continue;   // кесишмайди
        var dy=P[j].ly-P[i].ly, d=Math.abs(dy);
        if(d<42){
          var s2=(42-d)/2*(dy<0?-1:1);
          P[i].ly-=s2; P[j].ly+=s2;
        }
      }
    }
  }
  P.forEach(function(p){ p.ly=Math.max(22,Math.min(H-24,p.ly)) });

  var shar='';
  P.forEach(function(p,i){
    var x=p.it, t=mijoz?null:tadbir(x.g.nom);
    var kutil=t && !t.otdi;
    var c=DAVLAT_RANG[x.sh.davlat];
    var uch=p.ong ? p.x+p.r : p.x-p.r;
    var chiziq='<line class="xulash" x1="'+uch.toFixed(1)+'" y1="'+p.y.toFixed(1)+
      '" x2="'+p.lx.toFixed(1)+'" y2="'+p.ly.toFixed(1)+'" stroke="'+c+'"/>';
    var yon=p.ong?'start':'end';
    shar+='<g class="xsh'+(S.ochiq===x.g.nom?' tanlangan':'')+'" data-kes="'+esc(x.g.nom)+
      '" style="animation-delay:'+(0.4+i*0.09).toFixed(2)+'s">'+chiziq+
      (kutil?'<circle class="xpuls" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'"/>':'')+
      '<circle class="xdoira" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'" fill-opacity="'+(kutil?.55:.34)+'" stroke="'+c+'" stroke-width="2"/>'+
      '<text class="xson" x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+p.lx.toFixed(1)+'" y="'+(p.ly-3).toFixed(1)+'" text-anchor="'+yon+'">'+
        esc(x.sh.nom)+'</text>'+
      '<text class="xizoh" x="'+p.lx.toFixed(1)+'" y="'+(p.ly+11).toFixed(1)+'" text-anchor="'+yon+'" '+
        'fill="'+(kutil?c:'currentColor')+'">'+
        (t?(t.otdi?'бўлиб ўтди':t.kun+' кун қолди')
           :(mijoz&&jami?Math.round(x.g.soni/jami*100)+'%':''))+'</text>'+
      '<title>'+esc(x.sh.nom)+' · '+x.sh.davlat+' — '+fmt(x.g.soni)+birlik+'</title></g>';
  });

  var tashqari=guruh.filter(function(g){ return !shaharTop(g.nom) });
  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){
        return '<button class="xchip" data-kes="'+esc(g.nom)+'"><b>'+fmt(g.soni)+'</b>'+esc(g.nom)+'</button>';
      }).join('')+'</div>'
    : '';

  var afsona='<div class="xafs">'+Object.keys(dav).sort().map(function(d){
    return '<span><i style="background:'+DAVLAT_RANG[d]+'"></i>'+d+' <b>'+fmt(dav[d].soni)+'</b></span>';
  }).join('')+'</div>';

  return '<div class="xkarta"><div class="xscroll">'+
    '<svg class="xsvg" viewBox="0 0 '+W+' '+H+'">'+yer+shar+'</svg></div>'+
    '<div class="xsurish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Харитани чапга-ўнгга суринг</div>'+
    afsona+chip+'</div>';
}


/* ══════════════════════════════════════════════════════
   10. БЎЛИМ 3 — ШАҲАРЛАР / ПРОДУКТ
   «Қаерга сотилди ва ким сотди?»
   ══════════════════════════════════════════════════════ */

function kesimSahifa(){
  var l=satrlar(), k=kesim();
  var guruh=tartibla(guruhla(l,k.ol));
  var max=1;
  guruh.forEach(function(x){ if(x.soni>max) max=x.soni });
  var ochiq=null;
  guruh.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var h=sarlavha(praktikumMi()?'Шаҳарлар':'Продукт',
    'Қаерга қанча сотилган — батафсил учун босинг',
    sanaFiltr()+mobilTugma());

  h+='<div class="grid">'+(guruh.length?guruh.map(function(x,i){
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-kes="'+esc(x.nom)+'">'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+(kunIzoh(x.nom)||pul(x.tolangan))+'</div>'+
      '<div class="cq"><b class="num">'+fmt(x.soni)+'</b><span>та сотув</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.soni/max*100)+'%;background:'+rang(i)+'"></i></div>'+
    '</button>';
  }).join(''):'<div class="empty">Маълумот йўқ</div>')+'</div>';

  if(ochiq){
    var men=guruhla(ochiq.satrlar,function(x){ return x.menejer });
    h+='<div class="detail">'+
      '<div class="dh"><div class="dm"><h3>'+esc(ochiq.nom)+'</h3>'+
        '<div class="sub">'+esc(kunIzoh(ochiq.nom))+'</div>'+
        '<div class="chips">'+
          '<span class="chip">Сотув: <b>'+fmt(ochiq.soni)+'</b></span>'+
          '<span class="chip k">Тўланган <b>'+pul(ochiq.tolangan)+'</b></span>'+
          '<span class="chip c">Қарз <b>'+pul(ochiq.qarz)+'</b></span>'+
        '</div></div>'+
        '<button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="eb">Ким сотган</div>'+
        ustunlar(men.map(function(x){ return {nom:x.nom,qiy:x.soni,ong:pul(x.tolangan)} }))+'</div>'+
      '<div class="dbody"><div class="eb">Қачон сотилган</div>'+kunlikRoyxat(ochiq.satrlar)+'</div>'+
    '</div>';
  }

  // ── Саҳифа охири: мижозлар географияси + манбалар (фақат 3 кунлик) ──
  if(praktikumMi()) h+=mijozGeo(l);

  return h;
}

/**
 * МИЖОЗЛАР ГЕОГРАФИЯСИ — «Давлати» устуни бўйича.
 * Тадбир қаерда бўлгани эмас, МИЖОЗ қаердан экани кўрсатилади.
 */
function mijozGeo(l){
  var bor=l.some(function(x){ return x.davlat });
  var h='';

  if(bor){
    var geo=guruhla(l,function(x){ return x.davlat });
    var xrt=xarita(geo,true);
    var jami=0;
    geo.forEach(function(g){ jami+=g.soni });

    h+='<div class="sec"><h2>Мижозлар географияси</h2>'+
       '<p>Мижоз қайси шаҳардан — доира катталиги мижозлар сони</p></div>';
    if(xrt) h+=xrt;

    h+='<div class="dbody"><div class="eb">Шаҳарлар бўйича мижозлар</div>'+
      ustunlar(geo.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong: jami?Math.round(x.soni/jami*100)+'%':'' };
      }))+'</div>';
  }

  // ── Манбалар (Источник) ──
  if(l.some(function(x){ return x.manba })){
    var mn=guruhla(l,function(x){ return x.manba || 'Кўрсатилмаган' });
    var mj=0;
    mn.forEach(function(g){ mj+=g.soni });
    h+='<div class="sec"><h2>Манбалар</h2><p>Мижоз қайси манбадан келган</p></div>'+
      '<div class="dbody">'+ustunlar(mn.map(function(x){

   Манба: «Финансе орг» варағи (алоҳида жадвал, алоҳида API)

function moliyaMi(){ return S.prod==='moliya' }

/** Молия ёзувлари: сана фильтри + валюта фильтри */
function mSatrlar(){
  var l=((D&&D.moliya)||[]).filter(function(x){ return x.valyuta===S.valyuta });
  return sanaFiltrla(l);
}

/** Валюта белгиси билан сумма */
function mpul(v){
  return S.valyuta==='USD' ? '$'+fmt(v) : fmt(v)+' сўм';
}

/** Қисқа кўриниш: 1 830 000 → 1.8 млн (метрикалар учун) */
function mqisqa(v){
  var a=Math.abs(v), b=v<0?'−':'';
  if(S.valyuta==='USD') return b+'$'+fmt(a);
  if(a>=1e9) return b+(a/1e9).toFixed(a>=1e10?0:1).replace('.',',')+' млрд';
  if(a>=1e6) return b+(a/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' млн';
  if(a>=1e3) return b+Math.round(a/1e3)+' минг';
  return b+fmt(a);
}

/** Кирим/чиқим бўйича жамлаш */
function mJam(l){
  var o={kirim:0,chiqim:0,soni:l.length};
  l.forEach(function(x){ if(x.tip==='kirim') o.kirim+=x.summa; else o.chiqim+=x.summa });
  o.farq=o.kirim-o.chiqim;
  return o;
}

/** Калит бўйича гуруҳлаб, суммаси бўйича тартиблайди */
function mGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,summa:0,soni:0,satrlar:[]}; t.push(k) }
    m[k].summa+=x.summa; m[k].soni++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.summa-a.summa });
}

/** Валюта танлаш тугмалари */
function valyutaSeg(){
  function b(v){ return '<button data-val="'+v+'" class="'+(S.valyuta===v?'on':'')+'">'+
    (v==='UZS'?'сўм':'$ USD')+'</button>' }
  return '<div class="seg">'+b('UZS')+b('USD')+'</div>';
}

/** Молия улданмаган ёки маълумот йўқ бўлса */
function mBoshHolat(){

      '<b>Deploy → Anyone</b> қилинганми ва <b>KALIT_MOLIYA</b> иккала жойда бир хилми.</div></div>';

/**
 * Ёзув ўқилмаганда — сабабини рақамлар билан кўрсатади.

      return '<tr><td>'+esc(x[0])+'</td><td><b>'+esc(x[1])+'</b></td></tr>' }).join('')+'</table>';

  if(t.tipQiymatlar && t.tipQiymatlar.length){
    h+='<div class="eb" style="margin-top:16px">ТиП устунида нима ёзилган</div><table class="tshj">'+
      t.tipQiymatlar.map(function(x){

     '<div class="tshs">'+t.sarlavha.map(function(x){ return '<span>'+esc(x)+'</span>' }).join('')+'</div>';

  if(v!=='2.0')
    h+='<div class="tshq">⚠ Сервердаги версия — <b>'+esc(v||'номаълум')+'</b>, кутилгани <b>2.0</b>.<br>'+
       'Apps Script → Deploy → Manage deployments → ✏ → Version: <b>New version</b> → Deploy</div>';

/**
 * КАССАДАГИ ҚОЛДИҚ — ҳозир ҳар бир кассада қанча пул борлиги.
 * Ҳисоб оддий: кирим − чиқим. Пастда ҳаммасининг йиғиндиси.
 */
function mKassaBlok(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.kassa||'Кўрсатилмаган';
    if(!m[k]){ m[k]={nom:k,kirim:0,chiqim:0,soni:0}; t.push(k) }
    var g=m[k];
    g.soni++;
    if(x.tip==='kirim') g.kirim+=x.summa; else g.chiqim+=x.summa;
  });
  if(!t.length) return bosh('Бу даврда маълумот йўқ');

  var q=t.map(function(k){ var g=m[k]; g.qoldiq=g.kirim-g.chiqim; return g })
         .sort(function(a,b){ return b.qoldiq-a.qoldiq });

  var jami={kirim:0,chiqim:0,soni:0};
  q.forEach(function(g){ jami.kirim+=g.kirim; jami.chiqim+=g.chiqim; jami.soni+=g.soni });
  jami.qoldiq=jami.kirim-jami.chiqim;

  var eng=1;
  q.forEach(function(g){ if(Math.abs(g.qoldiq)>eng) eng=Math.abs(g.qoldiq) });

  var h='<div class="kgrid">'+q.map(function(g){
    var manfiy=g.qoldiq<0;
    return '<div class="kk'+(manfiy?' minus':'')+'">'+
      '<div class="knom">'+esc(g.nom)+'</div>'+
      '<div class="kson num">'+mqisqa(g.qoldiq)+'</div>'+
      '<div class="kpul">'+mpul(Math.abs(g.qoldiq))+(manfiy?' минусда':'')+'</div>'+
      '<div class="kbar"><i style="width:'+Math.max(2,Math.abs(g.qoldiq)/eng*100)+'%"></i></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdk"></i>кирим</span><b class="num">'+mqisqa(g.kirim)+'</b></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdc"></i>чиқим</span><b class="num">'+mqisqa(g.chiqim)+'</b></div>'+
      '<div class="kqat kson2"><span>'+fmt(g.soni)+' та ёзув</span></div>'+
    '</div>';
  }).join('')+'</div>';

  h+='<div class="kjami'+(jami.qoldiq<0?' minus':'')+'">'+
    '<div><div class="kjl">Ҳамма кассада жами</div>'+
      '<div class="kjv num">'+mqisqa(jami.qoldiq)+'</div>'+
      '<div class="kjd">'+mpul(Math.abs(jami.qoldiq))+(jami.qoldiq<0?' минусда':'')+'</div></div>'+
    '<div class="kjo">'+
      '<div><span>кирим</span><b class="num">'+mqisqa(jami.kirim)+'</b></div>'+
      '<div><span>чиқим</span><b class="num">'+mqisqa(jami.chiqim)+'</b></div>'+
      '<div><span>ёзувлар</span><b class="num">'+fmt(jami.soni)+'</b></div>'+
    '</div></div>';

  return h;
}

/**
 * Доира диаграмма — фоизлар билан.
 * Ўртасида жами, ёнида рўйхат: ном, фоиз, сумма.
 */
function mDoira(guruh, rang, fmtFn){
  var F=fmtFn||mqisqa;
  if(!guruh.length) return bosh('Маълумот йўқ');
  var jami=0; guruh.forEach(function(x){ jami+=x.summa });
  if(!jami) return bosh('Маълумот йўқ');

  var top=guruh.slice(0,7);
  var qolgan=guruh.slice(7);
  if(qolgan.length){
    var q={nom:'Бошқалари',summa:0,soni:0};
    qolgan.forEach(function(x){ q.summa+=x.summa; q.soni+=x.soni });
    if(q.summa>0) top=top.concat([q]);
  }

  var R=62, qalin=30, C=2*Math.PI*R, siljish=0, halqa='', ichYorliq='';
  var AJRAT=5;                                  // бўлаклар орасидаги қора чизиқ
  top.forEach(function(x,i){
    var ul=x.summa/jami*C;
    if(ul<=0) return;
    var f=x.summa/jami*100;
    var kor=Math.max(0.5,ul-AJRAT);
    halqa+='<circle class="dsek" cx="90" cy="90" r="'+R+'" fill="none" stroke="'+mRang(i,rang)+'" '+
      'stroke-width="'+qalin+'" stroke-dasharray="0 '+C.toFixed(2)+'" '+
      'stroke-dashoffset="'+(-siljish-AJRAT/2).toFixed(2)+'" transform="rotate(-90 90 90)" '+
      'style="--ul:'+kor.toFixed(2)+';--bo:'+(C-kor).toFixed(2)+';animation-delay:'+
      (0.15+i*0.09).toFixed(2)+'s"><title>'+esc(x.nom)+': '+F(x.summa)+
      ' ('+(f>=10?Math.round(f):f.toFixed(1))+'%)</title></circle>';

    if(f>=6){
      var brc=(siljish+ul/2)/C*360-90;
      var rad=brc*Math.PI/180;
      ichYorliq+='<text class="dich" x="'+(90+R*Math.cos(rad)).toFixed(1)+'" y="'+
        (90+R*Math.sin(rad)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" '+
        'style="animation-delay:'+(0.7+i*0.07).toFixed(2)+'s">'+
        (f>=10?Math.round(f):f.toFixed(1))+'%</text>';
    }
    siljish+=ul;
  });

  return '<div class="doira">'+
    '<svg class="chart dsvg" viewBox="0 0 180 180">'+halqa+ichYorliq+
      '<text class="dt" x="90" y="86" text-anchor="middle">'+F(jami)+'</text>'+
      '<text class="dl" x="90" y="103" text-anchor="middle">жами</text></svg>'+
    '<div class="dleg">'+top.map(function(x,i){
      var f=jami?x.summa/jami*100:0;
      return '<div class="dlq" style="animation-delay:'+(0.25+i*0.06).toFixed(2)+'s">'+
        '<i style="background:'+mRang(i,rang)+'"></i>'+
        '<span class="dnom">'+esc(x.nom)+'</span>'+
        '<b class="dfo">'+(f>=10?Math.round(f):f.toFixed(1))+'%</b>'+
        '<span class="dsum">'+F(x.summa)+'</span></div>';
    }).join('')+'</div></div>';
}


/** Диаграмма учун ранг: асосий рангдан очиқроқ поғоналар */
function mRang(i,asos){
  /* Поғоналар етарлича тўқ — устидаги оқ фоиз ёзуви ҳамма бўлакда ўқилади */
  var yashil=['#2E9670','#38A87E','#25835F','#43BA8D','#1C704F','#4ECB92','#155C41','#66D7A3'];
  var qizil =['#C0524A','#D3625A','#A8443D','#E0736A','#8E3831','#EC8880','#7A2E28','#F09E97'];
  var l=(asos==='var(--red)')?qizil:yashil;
  return l[i%l.length];
}


/** Энг йирик моддалар — 2-даража (Стадия) кесимида */
function mTopModda(l,tip,rang){
  var g=mGuruh(l.filter(function(x){ return x.tip===tip }),
               function(x){ return x.stadiya||x.asosiy||'—' }).slice(0,8);
  return mUstunlar(g,rang);
}

/**
 * Саҳифа тагидаги изоҳ — ҳозир НИМА кўрсатилаётганини айтади.
 * Фильтр қўйилганда чалкашмаслик учун.
 */
function filtrIzoh(l){
  var d=['Ҳаммаси','Шу ой','Кеча','Бугун','Сана оралиғи'];
  var k=['hammasi','oy','kecha','kun','oraliq'].indexOf(S.oraliq);
  var davr=d[k<0?0:k];

  var sanalar=l.map(function(x){ return x.sana }).filter(Boolean).sort();
  var oraliq = sanalar.length
    ? dfmt(sanalar[0])+' — '+dfmt(sanalar[sanalar.length-1])
    : '—';

  var q=[
    ['Давр', davr],
    ['Сана оралиғи', oraliq],
    ['Валюта', S.valyuta==='USD'?'AQSH доллари':'сўм'],
    ['Ёзувлар', fmt(l.length)+' та']
  ];
  if(S.kassa && S.kassa!=='hammasi') q.push(['Касса', S.kassa]);

  return '<div class="fizoh"><div class="eb">Ҳозир нима кўрсатилмоқда</div><div class="fq">'+
    q.map(function(x){
      return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';
    }).join('')+'</div>'+
    '<p>Юқоридаги барча рақамлар шу шартларга мос ёзувлардан ҳисобланган. '+
    'Бошқа давр керак бўлса, тепадаги сана тугмаларини ўзгартиринг.</p></div>';
}

/** Молия учун Кун / Ҳафта / Ой тугмалари — хулосада энг катта кирим кўрсатилади */
function mDavrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    if(x.tip!=='kirim') return;
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+x.summa;
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг катта кирим: '+davrYorliq(eng)+' \u2014 '+mqisqa(m[eng]) : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}

/** Кирим/чиқим динамикаси — ёнма-ён иккита устун */
function mDinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={kirim:0,chiqim:0}; t.push(k) }
    m[k][x.tip]+=x.summa;
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда ёзув йўқ');

  var slot = S.davr==='kun' ? 28 : 56;
  var chap = 64, ong = 20, tep = 26, past = 54;
  var W = Math.max(600, chap+ong+slot*(t.length-1)), H = 230;
  var max = 1;
  t.forEach(function(k){ max=Math.max(max,m[k].kirim,m[k].chiqim) });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+mqisqa(max*f)+'</text>';
  });

  var id=Math.floor(Math.random()*1e6);
  var qatlam='';
  [['kirim','var(--ok)','k'+id],['chiqim','var(--no)','c'+id]].forEach(function(p,qi){
    var nuq=t.map(function(k,i){ return [X(i),Y(m[k][p[0]])] });
    var yol=egri(nuq);
    qatlam+='<path class="aarea" d="'+yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+
      'L'+X(0).toFixed(1)+' '+(H-past)+'Z" fill="url(#'+p[2]+')" '+
      'style="animation-delay:'+(0.45+qi*0.12).toFixed(2)+'s"/>'+
      '<path class="aline" d="'+yol+'" fill="none" stroke="'+p[1]+'" stroke-width="2.4" '+
      'stroke-linecap="round" stroke-linejoin="round" '+
      'style="animation-delay:'+(0.1+qi*0.18).toFixed(2)+'s"/>';
  });

  var qadam=Math.max(1,Math.ceil(t.length/12));
  var yorliq='',belgi='';
  t.forEach(function(k,i){
    var x=X(i);
    if(t.length<=30 || i%qadam===0 || i===t.length-1){
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].kirim).toFixed(1)+
        '" r="3" fill="var(--ok)" style="animation-delay:'+(0.55+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · кирим '+mpul(m[k].kirim)+'</title></circle>'+
        '<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].chiqim).toFixed(1)+
        '" r="3" fill="var(--no)" style="animation-delay:'+(0.6+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · чиқим '+mpul(m[k].chiqim)+'</title></circle>';
    }
  });

  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<defs>'+
      '<linearGradient id="k'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--ok);stop-opacity:.40"/>'+
        '<stop offset="100%" style="stop-color:var(--ok);stop-opacity:0"/></linearGradient>'+
      '<linearGradient id="c'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--no);stop-opacity:.36"/>'+
        '<stop offset="100%" style="stop-color:var(--no);stop-opacity:0"/></linearGradient>'+
    '</defs>'+tor+qatlam+belgi+yorliq+'</svg></div>'+
    '<div class="mlg"><span><i class="mkirb"></i>кирим</span><span><i class="mchib"></i>чиқим</span></div>'+
    (W>620 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Сумма бўйича горизонтал устунлар */
function mUstunlar(l,rangi){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var jami=l.reduce(function(s,x){ return s+x.summa },0);
  var max=l[0].summa||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+'<small>'+x.soni+' та ёзув · '+foiz(x.summa,jami)+'%</small></div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.summa/max*100)+
        '%;background:'+(rangi||rang(i))+'"></div></div>'+
      '<div class="bv">'+mqisqa(x.summa)+'</div></div>';
  }).join('')+'</div>';
}

/** Сана бўйича гуруҳланган молия ёзувлари */
function mRoyxat(l){
  if(!l.length) return '<div class="empty">Ёзув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) }).slice(0,200);
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],kir=0,chi=0;
    lst.forEach(function(x){ if(x.tip==='kirim') kir+=x.summa; else chi+=x.summa });
    var yozuv=[];
    if(kir) yozuv.push('<span style="color:var(--green)">+'+mqisqa(kir)+'</span>');
    if(chi) yozuv.push('<span style="color:var(--red)">−'+mqisqa(chi)+'</span>');
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+yozuv.join(' · ')+'</span></div>'+
      lst.map(function(x){
        var kir2=x.tip==='kirim';
        return '<div class="jkart"><div class="jchap">'+
          '<div class="jnom">'+esc(x.stadiya||x.asosiy||'—')+'</div>'+
          '<div class="jmeta">'+esc([x.asosiy,x.kichik].filter(Boolean).join(' · '))+'</div></div>'+
          '<div class="jong"><div class="jmiq" style="color:'+(kir2?'var(--green)':'var(--red)')+'">'+
            (kir2?'+':'−')+mqisqa(x.summa)+'</div>'+
          '<div class="jxod">'+esc(x.kassa||'')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

     '<div><div class="sec" style="margin-top:0"><h2>Чиқим тузилиши</h2>'+
       '<p>Асосий стадия бўйича · жами '+mpul(j.chiqim)+'</p></div>'+
     '<div class="panel">'+mDoira(chi,'var(--red)')+'</div></div></div>';

  // ── Энг йирик моддалар (2-даража) ──
  h+='<div class="two" style="margin-top:16px">'+

     '<div><div class="sec" style="margin-top:0"><h2>Энг йирик чиқим моддалари</h2>'+

     '<div class="panel">'+mTopModda(l,'chiqim','var(--red)')+'</div></div></div>';

  // ── Саҳифа таги: ҳозир нима кўрсатилаётгани ──

        '</div></div>'+
        '<button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="eb">Стадия бўйича</div>'+mUstunlar(st,asosRang)+'</div>'+

/* ══════════════════════════════════════════════════════
   15. МАРКЕТИНГ
   «Лидлар қаердан келди ва нечтаси сотувга айланди?»
   ══════════════════════════════════════════════════════ */

function markMi(){ return S.prod==='marketing' }

var MK_NOM={yangi:'Янги лид',sifatsiz:'Сифатсиз',sotuv:'Сотув',obrabotka:'Обработкада'};
var MK_RANG={yangi:'var(--info)',sifatsiz:'var(--no)',sotuv:'var(--ok)',obrabotka:'var(--a)'};

/** Сана ва таргетолог фильтридан ўтган лидлар */
function kSatrlar(barchaTarget){
  if(!D || !D.marketing) return [];
  var l=sanaFiltrla(D.marketing);
  if(!barchaTarget && S.target!=='hammasi')
    l=l.filter(function(x){ return x.target===S.target });
  return l;
}

function kJam(l){
  var o={jami:l.length,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0};
  l.forEach(function(x){ o[x.holat]++ });
  o.konv=o.jami?o.sotuv/o.jami*100:0;
  return o;
}

function kFoiz(f){ return (f>=10?Math.round(f):f.toFixed(1))+'%' }

/** Таргетологлар кесими — конверсия бўйича */
function kTargetlar(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.target||'—';
    if(!m[k]){ m[k]={nom:k,jami:0,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0,satrlar:[]}; t.push(k) }
    m[k].jami++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){
    var g=m[k]; g.konv=g.jami?g.sotuv/g.jami*100:0; return g;
  }).sort(function(a,b){ return b.jami-a.jami });
}

function kBoshHolat(){
  if(S.kBand || (markUlangan() && D && !D.marketing && !D.markXato))
    return '<div class="load"><div class="spin"></div>Маркетинг маълумоти юкланмоқда…</div>';
  if(!markUlangan())
    return '<div class="empty"><b>Маркетинг уланмаган</b>HTML файлдаги <b>API_MARKETING</b> га '+
           'Marketing.gs дан чиққан ҳаволани қўйинг.</div>';
  if(D && D.markXato)
    return '<div class="xato"><b>Маркетинг серверига уланиб бўлмади</b>'+esc(D.markXato)+'</div>';
  if(!D.marketing || !D.marketing.length) return kTashxis();
  return '';
}

function kTashxis(){
  var t=D.markTashxis;
  if(!t) return '<div class="tsh"><h3>Лид ўқилмади</h3>'+
    '<p>Сервер ташхис юбормади — эски версия ишлаяпти.</p>'+
    '<div class="tshq">Apps Script → Deploy → Manage deployments → ✏ → '+
    'Version: <b>New version</b> → Deploy</div></div>';
  return '<div class="tsh"><h3>Лид ўқилмади</h3><table class="tshj">'+
    '<tr><td>Скрипт версияси</td><td><b>'+esc(t.versiya||'?')+'</b></td></tr>'+
    '<tr><td>Ўқилган варақ</td><td><b>«'+esc(t.varaq)+'»</b></td></tr>'+
    '<tr><td>Варақдаги қаторлар</td><td><b>'+fmt(t.jamiQator)+'</b></td></tr>'+
    '<tr><td>Сана йўқ</td><td><b>'+fmt(t.sanasiz||0)+'</b></td></tr>'+
    '<tr><td>Ўқилди</td><td><b>'+fmt(t.oqilgan)+'</b></td></tr></table></div>';
}

/** Таргетолог танлаш тугмалари */
function kTargetSeg(){
  var l=kTargetlar(sanaFiltrla(D.marketing||[]));
  var h='<div class="seg ksg"><button data-tg="hammasi" class="'+(S.target==='hammasi'?'on':'')+'">Ҳаммаси</button>';
  l.forEach(function(x){
    h+='<button data-tg="'+esc(x.nom)+'" class="'+(S.target===x.nom?'on':'')+'">'+esc(x.nom)+'</button>';
  });
  return h+'</div>';
}

/** Ҳолат бўйича тақсимот — тўртта рангли полоса */
function kHolatChiziq(j){
  if(!j.jami) return '';
  var q=['sotuv','obrabotka','yangi','sifatsiz'];
  return '<div class="kchiz">'+q.map(function(k){
    var f=j[k]/j.jami*100;
    return f<=0?'':'<i style="width:'+f+'%;background:'+MK_RANG[k]+'" title="'+MK_NOM[k]+': '+j[k]+'"></i>';
  }).join('')+'</div>'+
  '<div class="klg">'+q.map(function(k){
    return '<span><i style="background:'+MK_RANG[k]+'"></i>'+MK_NOM[k]+
      ' <b>'+fmt(j[k])+'</b> · '+kFoiz(j.jami?j[k]/j.jami*100:0)+'</span>';
  }).join('')+'</div>';
}


/* ── 15.1 УМУМИЙ ─────────────────────────────────────── */

function markUmumiy(){
  var h=sarlavha('Маркетинг — умумий','Лидлар, сифати ва конверсияси',
    sanaFiltr()+mobilTugma());

/** Маркетинг учун гуруҳлаш (сон бўйича) */
function kGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,soni:0,sotuv:0,sifatsiz:0,obrabotka:0,yangi:0,satrlar:[]}; t.push(k) }
    m[k].soni++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.soni-a.soni });
}

/** Давлатлар — харитадаги чегара коди ва марказий нуқтаси */
var AI_DAVLAT=[
  {kalit:'узбекистон',  nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},
  {kalit:'узбекстан',   nom:'Ўзбекистон',  kod:'uz', lat:41.4, lon:64.4},

  {kalit:'казахстан',   nom:'Қозоғистон',  kod:'kz', lat:43.6, lon:68.5},
